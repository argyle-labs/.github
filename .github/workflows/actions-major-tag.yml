name: Actions major tag

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to point its major tag at (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: actions-major-tag
  cancel-in-progress: false

jobs:
  move-major:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cut the next v1.N.0 on main
        id: cut
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          tag="$(git tag --points-at "$sha" --list 'v1.*.0' | sort -V | tail -n1)"
          if [[ -z "$tag" ]]; then
            last="$(git tag --list 'v1.*.0' | sort -V | tail -n1)"
            n=0
            if [[ "$last" =~ ^v1\.([0-9]+)\.0$ ]]; then
              n=$((BASH_REMATCH[1] + 1))
            fi
            tag="v1.${n}.0"
            git tag "$tag" "$sha"
            git push origin "refs/tags/${tag}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Move vX to the release tag
        env:
          VERSION: ${{ steps.cut.outputs.tag || inputs.version || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not vX.Y.Z"
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          sha="$(git rev-parse "refs/tags/${VERSION}^{commit}")"
          git config user.name  "actions-major-tag"
          git config user.email "actions-major-tag@argyle-labs.local"
          git tag -f "$major" "$sha"
          git push -f origin "refs/tags/${major}"
          echo "${major} -> ${VERSION} (${sha})" >> "$GITHUB_STEP_SUMMARY"

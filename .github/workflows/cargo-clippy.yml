name: cargo clippy

# `cargo clippy -D warnings`. Check-mode output cannot reuse a plain build's
# target/, so this leans on the shared sccache.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label; a crate over the default runners' memory cap can request `ci-large`.
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: >-
          Directory the tool runs in.
        required: false
        type: string
        default: '.'
      artifacts:
        description: >-
          Lines of `name:path`: artifacts from earlier jobs placed before the step runs (e.g. `vite-dist:ui/dist`).
        required: false
        type: string
        default: ''
      build-jobs:
        description: >-
          CARGO_BUILD_JOBS. Empty keeps cargo default parallelism.
        required: false
        type: string
        default: ''
      debuginfo:
        description: >-
          CARGO_PROFILE_{DEV,TEST}_DEBUG. '0' (default) drops debuginfo to cut compile memory; empty keeps the profile default.
        required: false
        type: string
        default: '0'
      env:
        description: >-
          Extra KEY=VALUE lines exported for the job.
        required: false
        type: string
        default: ''
      args:
        description: >-
          Cargo arguments selecting packages/features.
        required: false
        type: string
        default: '--workspace --all-targets --all-features'
    secrets:
      CI_REGISTRY_USER:
        required: false
      CI_REGISTRY_TOKEN:
        required: false
      SCCACHE_S3_ACCESS_KEY:
        required: false
      SCCACHE_S3_SECRET_KEY:
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # CI-only: link the image's system OpenSSL instead of compiling openssl-src.
  # Release builds do not set this, so shipped binaries keep vendoring it.
  OPENSSL_NO_VENDOR: "1"

jobs:
  clippy:
    runs-on: ${{ inputs.runs-on }}
    # The ci-rust image bakes in the toolchain, sccache and Node (act needs node
    # in the job container for JS actions). Its tag tracks
    # orca/rust-toolchain.toml; bump both together.
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    # Gitea runs `run:` in a custom container with sh (dash); force bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: argyle-labs/.github/.github/actions/fetch-artifacts@main
        with:
          artifacts: ${{ inputs.artifacts }}

      - uses: argyle-labs/.github/.github/actions/rust-setup@main
        with:
          working-directory: ${{ inputs.working-directory }}
          build-jobs: ${{ inputs.build-jobs }}
          debuginfo: ${{ inputs.debuginfo }}
          env: ${{ inputs.env }}
          wrap-cc: 'true'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

      - name: Clippy
        working-directory: ${{ inputs.working-directory }}
        env:
          ARGS: ${{ inputs.args }}
        run: |
          export t0=$SECONDS; trap 'echo "clippy|$((SECONDS - t0))|$?" >> /tmp/ci-phases' EXIT
          read -ra args <<< "$ARGS"
          cargo clippy --locked "${args[@]}" -- -D warnings

      - uses: argyle-labs/.github/.github/actions/ci-summary@main
        if: ${{ !cancelled() }}

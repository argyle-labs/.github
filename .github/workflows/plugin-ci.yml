name: Plugin CI (reusable)

# ─────────────────────────────────────────────────────────────────────────────
# Reusable CI for orca dynamic (subprocess) plugins. ONE definition of "does
# this plugin format, lint, test, AND meet its coverage floor?". Every plugin
# repo is a thin caller:
#
#   name: CI
#   on:
#     push:         { branches: [main] }
#     pull_request: { branches: [main] }
#   concurrency:
#     group: ci-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     ci:
#       uses: argyle-labs/.github/.github/workflows/plugin-ci.yml@main
#       secrets: inherit
#
# The caller's `ci` job calling this reusable `ci` job surfaces as `ci / ci` —
# require that context in branch protection (uniform across all repos).
#
# DETERMINISTIC BY DEFAULT (see [[orca-published-crate-plugin-compat-range]]):
# plugins build against the orca git rev pinned in their committed lockfile
# (the current stable orca tag). CI reflects only the plugin's own diff —
# reproducible, and one breaking orca merge can no longer turn the whole fleet
# red on unrelated PRs. Testing against orca `main` is the CANARY's job
# (plugin-canary.yml / fleet-canary.yml), opt-in via `sync_orca_main: true`.
#
# COVERAGE IS MANDATORY, NOT A KNOB. Every plugin measures and gates line
# coverage of its OWN crates (cargo-llvm-cov instruments workspace members
# only — never the orca dependency). The floor is the single value in the
# repo's `.coverage-floor` file; ratchet it up as tests land, never down. A
# repo without the file gates at 0 (still measured + reported) so adoption is
# safe before a floor is seeded.
#
#  • Drop local-dev patch: plugin repos carry a developer-only `[patch]` in
#    `.cargo/config.toml` redirecting plugin-toolkit to a local `../orca`
#    checkout. Remove it so the git dependency is used. `rm -f` no-ops if absent.
#
#  • ORCA_FETCH_TOKEN (via `secrets: inherit`) authenticates the private orca
#    git fetch through git's tokenized `insteadOf` rewrite.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain to install (rustup channel)."
        required: false
        type: string
        default: "stable"
      sync_orca_main:
        description: >-
          Advance the orca dependency to `main` HEAD before lint/test instead of
          honoring the committed lockfile pin. FALSE on the PR hot path
          (deterministic). The canary workflows set this TRUE to detect drift
          against live orca.
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Resolve git deps via the git CLI so the tokenized `insteadOf` rewrite is
  # honored when fetching the private orca dependency.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # No `name:` — the check run must report as `ci` so callers surface `ci / ci`
  # and branch protection can require one uniform context across all plugins.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy, rustfmt

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Drop local-dev cargo patch
        run: rm -f .cargo/config.toml

      - name: Authenticate private orca git dependency
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.ORCA_FETCH_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      # Deterministic by default: build exactly what the committed lockfile
      # pins. Only when sync_orca_main is set (canary) do we advance the orca
      # source to main HEAD. The `|| cargo generate-lockfile` fallback handles a
      # lock still in local-dev PATH form (no git package to target).
      - name: Sync orca dep to main tip (canary only)
        if: ${{ inputs.sync_orca_main }}
        run: cargo update -p plugin-toolkit || cargo generate-lockfile

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      # Coverage IS the test step — nextest engine under llvm-cov, gated on the
      # repo's floor. Measures workspace crates only (the plugin's own code).
      # `--no-tests=pass`: stub plugins with no tests yet must not fail CI (a
      # test-less repo simply has 0% covered against a 0 floor); nextest
      # otherwise exits non-zero on an empty test set.
      - name: Test + coverage gate (line coverage ≥ floor)
        run: |
          floor="$(cat .coverage-floor 2>/dev/null || echo 0)"
          echo "Coverage floor for this repo: ${floor}%"
          cargo llvm-cov nextest --no-fail-fast --no-tests=pass --fail-under-lines "$floor"

name: Plugin CI (reusable)

# ─────────────────────────────────────────────────────────────────────────────
# Reusable CI workflow for orca dynamic (subprocess) plugins — the PR gate.
#
# The pipeline model (Gitea-canonical, see [[gitea-canonical-github-mirror-only]]):
#
#   • On a PR to main AND on push to main, a plugin caller runs THIS workflow:
#       test        → cargo test (fail = block the PR)
#       build       → cross-compile the release binaries for every target
#                     (fail = block the PR)
#     Branch protection on `main` marks `test` + `build` as required checks, so
#     "tests pass + release builds" IS the merge gate. On merge to main the same
#     two jobs re-run as post-merge validation.
#
#   • Releasing is a SEPARATE, manually-triggered step. `plugin-release.yml` is
#     reached only via a caller `workflow_dispatch` (channel=rc, then
#     channel=stable). That deliberate operator trigger is the approval gate for
#     each cut — Gitea has no `environment:` protection-rule feature, so the
#     manual dispatch is the portable gate. See plugin-release.yml.
#
# This workflow deliberately mirrors plugin-release.yml's build steps (same
# toolchain install, same zig cross-compile, same macOS SDK provisioning, same
# artifact path discipline) so a green PR build is a faithful predictor of a
# green release build. It differs only in that it: (a) adds a `test` job, (b)
# does NOT compute/write a release version — it builds at the committed
# Cargo.toml version, and (c) does NOT tag or publish anything.
#
# One caller per plugin repo does:
#
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#   jobs:
#     ci:
#       uses: argyle-labs/.github/.github/workflows/plugin-ci.yml@main
#       secrets: inherit           # carries ORCA_FETCH_TOKEN for the private dep
#
# No `permissions:` block is required on the caller — CI neither tags nor
# publishes, so the default read-only token is sufficient.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      targets:
        description: >-
          JSON array of Rust target triples to build. Default: the six
          first-party release triples — kept identical to plugin-release.yml so
          the PR build covers exactly what a release would build. Every non-host
          target cross-compiles with cargo-zigbuild.
        required: false
        type: string
        default: >-
          ["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","aarch64-apple-darwin","x86_64-apple-darwin"]
      bins:
        description: 'JSON array of bin names to build. Empty ([]) = derive the crate''s sole bin from cargo metadata.'
        required: false
        type: string
        default: "[]"

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # ── Shared compilation cache: sccache → MinIO S3 on frigg (LXC116,
  #    10.10.10.31). Turns the cold full-graph orca recompile (~15 crates)
  #    into a cache fetch shared across every plugin build. Creds are the
  #    org-level Gitea secrets SCCACHE_S3_* (scoped sccache-rw MinIO user).
  #    CARGO_INCREMENTAL=0 is MANDATORY — sccache and incremental compilation
  #    are mutually exclusive; leaving it on silently disables all cache hits.
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: 10.10.10.31:9000
  SCCACHE_S3_USE_SSL: "false"
  SCCACHE_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

jobs:
  # ── Unit/integration tests. First required check. ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Install sccache
        run: |
          set -euo pipefail
          ver=v0.8.2
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${ver}/sccache-${ver}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/sccache'
          chmod +x /usr/local/bin/sccache
          sccache --version

      - name: Drop local-dev cargo patch
        run: rm -f .cargo/config.toml

      - name: Authenticate private orca git dependency (Gitea)
        run: |
          # See plugin-release.yml for the full rationale. orca is fetched from
          # Gitea (host rewrite of the github.com-spelled dep). ORCA_FETCH_TOKEN
          # must be a GITEA token with read on argyle-labs/orca.
          git config --global \
            url."https://x-access-token:${{ secrets.ORCA_FETCH_TOKEN }}@gitea.scottkey.me/".insteadOf \
            "https://github.com/"

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --workspace

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # ── Build the release binaries for every target. Second required check. ──
  #    Mirrors plugin-release.yml's `build` job exactly (see file header). The
  #    only difference: no computed-version write — it builds at the committed
  #    Cargo.toml version, and nothing is published.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install sccache
        run: |
          set -euo pipefail
          ver=v0.8.2
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${ver}/sccache-${ver}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/sccache'
          chmod +x /usr/local/bin/sccache
          sccache --version

      - name: Drop local-dev cargo patch
        run: rm -f .cargo/config.toml

      - name: Authenticate private orca git dependency (Gitea)
        run: |
          # See plugin-release.yml for the full rationale. orca is fetched from
          # Gitea (host rewrite of the github.com-spelled dep). ORCA_FETCH_TOKEN
          # must be a GITEA token with read on argyle-labs/orca.
          git config --global \
            url."https://x-access-token:${{ secrets.ORCA_FETCH_TOKEN }}@gitea.scottkey.me/".insteadOf \
            "https://github.com/"

      - name: Resolve bin list
        id: bins
        run: |
          set -euo pipefail
          requested='${{ inputs.bins }}'
          if [ "$(echo "$requested" | tr -d '[:space:]')" != "[]" ]; then
            bins=$(echo "$requested" | jq -r '.[]')
          else
            bins=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[].targets[] | select(.kind[] == "bin") | .name')
          fi
          if [ -z "$bins" ]; then
            echo "::error::no bin targets found — is this a [[bin]] plugin crate?"; exit 1
          fi
          {
            echo "list<<EOF"
            echo "$bins"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "bins: $(echo "$bins" | paste -sd, -)"

      - name: Install cross toolchain (zig + cargo-zigbuild)
        if: ${{ matrix.target != 'x86_64-unknown-linux-gnu' }}
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages cargo-zigbuild ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Provision macOS SDK (darwin framework linking)
        if: ${{ endsWith(matrix.target, '-apple-darwin') }}
        env:
          MACOS_SDK_VERSION: "14.5"
        run: |
          set -euo pipefail
          url="https://github.com/joseluisq/macosx-sdks/releases/download/${MACOS_SDK_VERSION}/MacOSX${MACOS_SDK_VERSION}.sdk.tar.xz"
          dest="$HOME/macos-sdk"
          mkdir -p "$dest"
          echo "→ fetching macOS SDK ${MACOS_SDK_VERSION}"
          curl -fsSL --retry 5 --retry-connrefused "$url" | tar -xJ -C "$dest"
          sdkroot="$dest/MacOSX${MACOS_SDK_VERSION}.sdk"
          test -d "$sdkroot/System/Library/Frameworks/Security.framework" \
            || { echo "::error::macOS SDK missing Security.framework at $sdkroot"; exit 1; }
          echo "SDKROOT=$sdkroot" >> "$GITHUB_ENV"
          echo "provisioned $sdkroot"

      - name: Add rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Build release binaries
        env:
          RUSTFLAGS: ${{ contains(matrix.target, '-musl') && '-C target-feature=+crt-static' || '' }}
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) builder="cargo build" ;;
            *)                        builder="cargo zigbuild" ;;
          esac
          bin_flags=""
          while IFS= read -r b; do
            [ -n "$b" ] && bin_flags="$bin_flags --bin $b"
          done <<< '${{ steps.bins.outputs.list }}'
          export CARGO_BUILD_TARGET="${{ matrix.target }}"
          echo "→ $builder --release --target ${{ matrix.target }}$bin_flags"
          # shellcheck disable=SC2086
          $builder --release --target "${{ matrix.target }}" $bin_flags

      - name: Assert binaries built
        run: |
          set -euo pipefail
          while IFS= read -r bin; do
            [ -z "$bin" ] && continue
            path="target/${{ matrix.target }}/release/${bin}"
            if [ ! -f "$path" ]; then
              echo "::error::binary not found at $path"
              ls -la "target/${{ matrix.target }}/release" || echo "  (missing)"
              exit 1
            fi
            echo "ok: $path"
          done <<< '${{ steps.bins.outputs.list }}'

      - name: sccache stats
        if: always()
        run: sccache --show-stats

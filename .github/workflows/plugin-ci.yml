name: Plugin CI (reusable)

# ─────────────────────────────────────────────────────────────────────────────
# Reusable CI workflow for orca dynamic (subprocess) plugins — the PR gate.
#
# The pipeline model (Gitea-canonical, see [[gitea-canonical-github-mirror-only]]):
#
#   • Before approval — on a PR to main AND on push to main — a plugin caller
#     runs THIS workflow, which is TEST + LINT ONLY:
#       test → cargo fmt --check + cargo clippy -D warnings + cargo test
#              (fail = block the PR)
#     Branch protection on `main` marks `test` as the single required check.
#     CI does NOT build binaries: cross-compiling every target on every PR/push
#     burns runner minutes and sccache load for artifacts no one consumes until
#     a release is cut. Building is deferred to the release workflow.
#
#   • Building + releasing happen AFTER approval, together, in the SEPARATE
#     manually-triggered `plugin-release.yml` (reached only via a caller
#     `workflow_dispatch`: channel=rc, then channel=stable). That deliberate
#     operator trigger IS the approval gate — Gitea has no `environment:`
#     protection-rule feature, so the manual dispatch is the portable gate.
#     Release order: build the binaries, then cut/publish the release. So the
#     first time a commit is cross-compiled is at release time, post-approval.
#     See plugin-release.yml.
#
# One caller per plugin repo does:
#
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#   jobs:
#     ci:
#       uses: argyle-labs/.github/.github/workflows/plugin-ci.yml@main
#       secrets: inherit           # carries ORCA_FETCH_TOKEN for the private dep
#
# No `permissions:` block is required on the caller — CI neither tags nor
# publishes, so the default read-only token is sufficient.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # CI is test + lint only. The build target matrix (targets/bins) lives solely
  # in plugin-release.yml, which is where binaries are built.
  workflow_call:
    inputs:
      lock-check:
        description: >-
          Cargo.lock drift gate: `warn` (annotate only) or `enforce` (fail the
          job). Defaults to `enforce`; a repo can opt down with
          `with: { lock-check: warn }`.
        required: false
        type: string
        default: enforce

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # ── Shared compilation cache: sccache → the fleet MinIO S3. Turns the cold
  #    full-graph orca recompile (~15 crates) into a cache fetch shared across
  #    every plugin build. Endpoint is the org variable SCCACHE_ENDPOINT, never
  #    a literal address (this repo mirrors to public GitHub). Creds are the
  #    org-level Gitea secrets SCCACHE_S3_* (scoped sccache-rw MinIO user).
  #    CARGO_INCREMENTAL=0 is MANDATORY — sccache and incremental compilation
  #    are mutually exclusive; leaving it on silently disables all cache hits.
  CARGO_INCREMENTAL: "0"
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
  SCCACHE_S3_USE_SSL: "false"
  SCCACHE_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
  # sccache's idle timer resets only on new requests, so a single rustc longer
  # than the 600s default gets its server shut down under it. The job
  # container's lifetime bounds the server instead.
  SCCACHE_IDLE_TIMEOUT: "0"
  # A server that does die mid-build degrades to a local compile instead of
  # failing the rustc invocation.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_ERROR_LOG: /tmp/sccache-error.log
  # CI-only: link the image's system OpenSSL instead of compiling openssl-src
  # (vendored in most plugin locks via git2/rusqlite/native-tls). Release
  # builds do not set this, so shipped binaries keep vendoring it.
  OPENSSL_NO_VENDOR: "1"

jobs:
  # ── Unit/integration tests. First required check. ──
  #
  # Runs INSIDE the prebuilt ci-rust image (epic #53): the pinned Rust toolchain
  # (+ clippy/rustfmt) and sccache are baked in, so this job no longer downloads
  # rustup (the recurring static.rust-lang.org Fastly wedge) or curls sccache —
  # it starts compiling immediately. Image is pulled from the internal Gitea
  # registry over the vanity TLS host (vars.CI_REGISTRY); the pinned :1.95.0 tag
  # tracks orca/rust-toolchain.toml — bump both together when Rust moves.
  test:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    # In a custom container Gitea defaults `run:` steps to `sh` (dash), not the
    # stock runner's bash — force bash so the orca-auth step's ${var/…/…}
    # substitution (and any other bashism) works.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Drop local-dev cargo patch
        run: rm -f .cargo/config.toml

      # A lock generated under the local path patch records orca crates with no
      # `source`, so CI silently re-resolves against whatever orca main is at
      # that moment and the sccache keys miss every time main moves.
      - name: Cargo.lock drift check
        env:
          MODE: ${{ inputs.lock-check }}
        # Fail-open: a probe that cannot run (no jq in an older image, cargo
        # metadata erroring) warns and passes; only MODE=enforce on a detected
        # problem fails the step.
        run: |
          set +e -uo pipefail
          problems=()
          probe_fail() { echo "::warning title=Cargo.lock drift check skipped::$1"; exit 0; }
          command -v jq >/dev/null || probe_fail "jq not available in this image"
          if [ -f Cargo.lock ]; then
            meta=$(cargo metadata --no-deps --format-version 1 2>/dev/null) \
              || probe_fail "cargo metadata --no-deps failed"
            members=$(echo "$meta" | jq -r '.packages[].name') && [ -n "$members" ] \
              || probe_fail "could not list workspace members"
            # [[package]] blocks without a `source` that are not members of this
            # workspace came from a path patch.
            sourceless=$(awk '
              /^\[\[package\]\]/ { if (name != "" && !src) print name; name=""; src=0; next }
              /^name = /             { gsub(/"/, "", $3); name=$3 }
              /^source = /           { src=1 }
              END                    { if (name != "" && !src) print name }
            ' Cargo.lock | grep -vxF -f <(printf '%s\n' "$members") || true)
            if [ -n "$sourceless" ]; then
              problems+=("Cargo.lock has path-sourced (sourceless) entries for non-member crates: $(echo "$sourceless" | paste -sd, -) — regenerate the lock without .cargo/config.toml")
            fi
            if ! err=$(cargo metadata --locked --format-version 1 2>&1 >/dev/null); then
              problems+=("cargo metadata --locked failed (lock out of sync with Cargo.toml): $(echo "$err" | grep -m1 -i error)")
            fi
          else
            problems+=("no Cargo.lock committed")
          fi
          [ "${#problems[@]}" -eq 0 ] && { echo "Cargo.lock is git-sourced and in sync"; exit 0; }
          level=warning; [ "$MODE" = enforce ] && level=error
          {
            echo "### Cargo.lock drift (${MODE})"
            for p in "${problems[@]}"; do echo "- $p"; done
          } >> "$GITHUB_STEP_SUMMARY"
          for p in "${problems[@]}"; do echo "::${level} title=Cargo.lock drift::$p"; done
          [ "$MODE" = enforce ] && exit 1
          exit 0

      # Starting the server up front runs sccache's storage check against MinIO,
      # so an unreachable backend falls back to an uncached build in seconds
      # with a visible warning instead of stalling inside the first rustc. The
      # wrappers are exported only on success (cc-rs honours a multi-word
      # CC/CXX, so SQLCipher/libgit2/jemalloc are cached too).
      - name: sccache preflight
        run: |
          # A failed write check leaves sccache up but READ-ONLY, reported only in this append-only log.
          : > "$SCCACHE_ERROR_LOG" 2>/dev/null || true
          if timeout 60 sccache --start-server; then
            echo "sccache server up ($SCCACHE_ENDPOINT/$SCCACHE_BUCKET)"
            { echo "RUSTC_WRAPPER=sccache"; echo "CC=sccache cc"; echo "CXX=sccache c++"; } >> "$GITHUB_ENV"
            if ro=$(grep -A 5 'storage write check failed' "$SCCACHE_ERROR_LOG" 2>/dev/null); then
              echo "::error title=sccache READ-ONLY::sccache cache is READ-ONLY (backend write check failed): cache will not fill; check MinIO disk. $(tr '\n' ' ' <<< "$ro")"
            fi
          else
            echo "::warning title=sccache unavailable::sccache server did not start against the MinIO backend; building UNCACHED. $(tail -n 5 "$SCCACHE_ERROR_LOG" 2>/dev/null | tr '\n' ' ')"
          fi

      # orca's plugin-toolkit is pinned to the PUBLIC github.com/argyle-labs/orca
      # mirror and fetched from github directly — no auth, no insteadOf rewrite.
      # The internal Gitea's external hostname does not resolve inside runner
      # containers, so it cannot be the fetch target here. Fetch uses the git
      # CLI via CARGO_NET_GIT_FETCH_WITH_CLI=true (env).

      # ── Frontend gate (UI plugins only) ──────────────────────────────────
      # Gated on a ui/package.json so Rust-only plugins skip it entirely. For a
      # UI plugin (e.g. peacock, a SvelteKit app under ui/) the frontend is
      # embedded into the binary via rust-embed from ui/dist — but ui/dist is
      # gitignored (only a placeholder index.html is tracked), so nothing here
      # actually tested or built the UI before. Build it and run its own checks
      # so a broken frontend fails the PR, and so `npm run build` output exists
      # for the cargo steps below to embed. Node/npm come from the ci-rust image.
      - name: Detect UI
        id: ui
        run: |
          if [ -f ui/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no ui/package.json — skipping frontend gate"
          fi

      - name: UI install (npm ci)
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        run: npm ci

      - name: UI typecheck (svelte-check)
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        run: npm run check

      - name: UI unit tests (vitest)
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        run: npm run test:run

      - name: UI build (vite → ui/dist)
        if: steps.ui.outputs.present == 'true'
        working-directory: ui
        run: npm run build

      # ── Rust gate ────────────────────────────────────────────────────────
      # Each timed phase appends `name|seconds|exit` to /tmp/ci-phases from an
      # EXIT trap, so a failing phase is still recorded; the summary renders it.
      - name: Format check
        run: cargo fmt --all --check

      - name: Fetch dependencies
        run: |
          export t0=$SECONDS; trap 'echo "fetch|$((SECONDS - t0))|$?" >> /tmp/ci-phases' EXIT
          cargo fetch --locked

      # Clippy first: check mode is the cheaper build, so lint failures report
      # sooner. The two phases share only build scripts and proc-macros (library
      # deps are checked for clippy and compiled for test either way), so the
      # order does not change total compile work. Same --workspace/--all-features
      # keeps those shared units identical. Test still runs if clippy fails.
      - name: Clippy
        run: |
          export t0=$SECONDS; trap 'echo "clippy|$((SECONDS - t0))|$?" >> /tmp/ci-phases' EXIT
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        run: |
          export t0=$SECONDS; trap 'echo "test|$((SECONDS - t0))|$?" >> /tmp/ci-phases' EXIT
          cargo test --locked --workspace --all-features

      - name: Timings + sccache summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Phase timings"
            echo "| phase | seconds | exit |"
            echo "|---|---:|---:|"
            if [ -f /tmp/ci-phases ]; then
              while IFS='|' read -r p t e; do echo "| $p | $t | $e |"; done < /tmp/ci-phases
            fi
            echo
            echo "### sccache"
            stats=$(sccache --show-stats 2>&1) || stats="(sccache server not running)"
            echo '```'
            echo "$stats"
            echo '```'
            # ReadOnly mode fails every write without ever completing one.
            werr=$(awk '/^Cache write errors/ {print $NF}' <<< "$stats")
            wavg=$(awk '/^Average cache write/ {print $(NF-1)}' <<< "$stats")
            if [ "${werr:-0}" -gt 0 ] && [ "$wavg" = 0.000 ]; then
              echo "**sccache cache is READ-ONLY**: ${werr} cache write errors and no successful write; the cache did not fill (check MinIO disk)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if errs=$(grep -m 20 -iE 'error|warn|failed|panic' "$SCCACHE_ERROR_LOG" 2>/dev/null); then
            echo "::warning title=sccache errors::$(tr '\n' ' ' <<< "$errs")"
          fi

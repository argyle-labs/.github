name: Plugin CI (reusable)

# ─────────────────────────────────────────────────────────────────────────────
# Reusable CI workflow for orca dynamic (subprocess) plugins.
#
# ONE source of truth for "does this plugin build, lint, and test against LIVE
# orca `main`?". Every plugin repo drops its hand-rolled ci.yml and becomes a
# thin caller:
#
#   # .github/workflows/ci.yml
#   name: CI
#   on:
#     push:         { branches: [main] }
#     pull_request: { branches: [main] }
#   concurrency:
#     group: ci-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     ci:
#       uses: argyle-labs/.github/.github/workflows/plugin-ci.yml@main
#       secrets: inherit
#
# The caller's `ci` job calling this reusable `ci` job surfaces the check as
# `ci / ci` — require that context in branch protection (uniform across repos).
#
# Why the steps below are non-obvious:
#
#  • Drop local-dev patch: plugin repos carry a developer-only `[patch]` in
#    `.cargo/config.toml` redirecting plugin-toolkit to a local `../orca`
#    checkout, which doesn't exist in CI. Remove it so the git dependency
#    (private argyle-labs/orca) is used. `rm -f` is a no-op if absent.
#
#  • Sync orca dep to main tip: the committed lockfile pins a CONCRETE orca git
#    rev (or a stale path-form entry). A plain `cargo build` HONORS that locked
#    rev and would silently validate against OLD orca — the exact trap that let
#    a fleet of plugins pass CI while broken against live orca. `cargo update -p
#    plugin-toolkit` advances the shared orca git source to current `main` HEAD
#    before we lint/test, so CI always reflects live orca.
#
#  • ORCA_FETCH_TOKEN (via `secrets: inherit`) authenticates the private orca
#    git fetch through git's tokenized `insteadOf` rewrite. Swap to a 1Password
#    service-account / fine-grained PAT later; the wiring stays the same.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain to install (rustup channel)."
        required: false
        type: string
        default: "stable"

env:
  CARGO_TERM_COLOR: always
  # Resolve git deps via the git CLI so the tokenized `insteadOf` rewrite is
  # honored when fetching the private orca dependency.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # No `name:` — the check run must report as `ci` so callers surface `ci / ci`
  # and branch protection can require one uniform context across all plugins.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Drop local-dev cargo patch
        run: rm -f .cargo/config.toml

      - name: Authenticate private orca git dependency
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.ORCA_FETCH_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Sync orca dep to main tip
        # Advance the orca git source to main HEAD before lint/test. If the
        # committed lock is in local-dev PATH form (plugin-toolkit resolved from
        # ../orca, so there's no git package to target), `cargo update -p` errors
        # `did not match any packages` — fall back to regenerating the lock fresh
        # from Cargo.toml, which resolves plugin-toolkit from git at main tip.
        run: cargo update -p plugin-toolkit || cargo generate-lockfile

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

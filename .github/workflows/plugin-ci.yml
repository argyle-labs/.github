name: Plugin CI (reusable)

# ─────────────────────────────────────────────────────────────────────────────
# Reusable CI workflow for orca dynamic (subprocess) plugins — the PR gate.
#
# The pipeline model (Gitea-canonical, see [[gitea-canonical-github-mirror-only]]):
#
#   • Before approval — on a PR to main AND on push to main — a plugin caller
#     runs THIS workflow, which is TEST + LINT ONLY:
#       test → cargo fmt --check + cargo clippy -D warnings + cargo test
#              (fail = block the PR)
#     Branch protection on `main` marks `test` as the single required check.
#     CI does NOT build binaries: cross-compiling every target on every PR/push
#     burns runner minutes and sccache load for artifacts no one consumes until
#     a release is cut. Building is deferred to the release workflow.
#
#   • Building + releasing happen AFTER approval, together, in the SEPARATE
#     manually-triggered `plugin-release.yml` (reached only via a caller
#     `workflow_dispatch`: channel=rc, then channel=stable). That deliberate
#     operator trigger IS the approval gate — Gitea has no `environment:`
#     protection-rule feature, so the manual dispatch is the portable gate.
#     Release order: build the binaries, then cut/publish the release. So the
#     first time a commit is cross-compiled is at release time, post-approval.
#     See plugin-release.yml.
#
# One caller per plugin repo does:
#
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#   jobs:
#     ci:
#       uses: argyle-labs/.github/.github/workflows/plugin-ci.yml@main
#       secrets: inherit           # carries ORCA_FETCH_TOKEN for the private dep
#
# No `permissions:` block is required on the caller — CI neither tags nor
# publishes, so the default read-only token is sufficient.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # No inputs: CI is test + lint only. The build target matrix (targets/bins)
  # lives solely in plugin-release.yml, which is where binaries are built.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # ── Shared compilation cache: sccache → MinIO S3 on frigg (LXC116,
  #    10.10.10.31). Turns the cold full-graph orca recompile (~15 crates)
  #    into a cache fetch shared across every plugin build. Creds are the
  #    org-level Gitea secrets SCCACHE_S3_* (scoped sccache-rw MinIO user).
  #    CARGO_INCREMENTAL=0 is MANDATORY — sccache and incremental compilation
  #    are mutually exclusive; leaving it on silently disables all cache hits.
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: 10.10.10.31:9000
  SCCACHE_S3_USE_SSL: "false"
  SCCACHE_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

jobs:
  # ── Unit/integration tests. First required check. ──
  #
  # Runs INSIDE the prebuilt ci-rust image (epic #53): the pinned Rust toolchain
  # (+ clippy/rustfmt) and sccache are baked in, so this job no longer downloads
  # rustup (the recurring static.rust-lang.org Fastly wedge) or curls sccache —
  # it starts compiling immediately. Image is pulled from the internal Gitea
  # registry over the vanity TLS host (vars.CI_REGISTRY); the pinned :1.95.0 tag
  # tracks orca/rust-toolchain.toml — bump both together when Rust moves.
  test:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Drop local-dev cargo patch
        run: rm -f .cargo/config.toml

      - name: Authenticate private orca git dependency (Gitea)
        env:
          ORCA_FETCH_TOKEN: ${{ secrets.ORCA_FETCH_TOKEN }}
        run: |
          # orca is a github.com-spelled git dep, but the canonical forge is
          # Gitea. Rewrite github.com → THIS runner's own Gitea, taken from
          # GITHUB_SERVER_URL: internal act_runners see http://10.10.10.20:3000
          # (which resolves), whereas the external hostname gitea.scottkey.me
          # does NOT resolve on them — hardcoding it broke every plugin build.
          # ORCA_FETCH_TOKEN is a Gitea token with read on argyle-labs/orca.
          base="${GITHUB_SERVER_URL:-https://gitea.scottkey.me}"
          auth="${base/:\/\//://x-access-token:${ORCA_FETCH_TOKEN}@}"
          git config --global url."${auth}/".insteadOf "https://github.com/"

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --workspace

      - name: sccache stats
        if: always()
        run: sccache --show-stats

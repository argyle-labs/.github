name: _matrix-probe

# THROWAWAY probe: does this Gitea act fan out a STATIC matrix into parallel
# jobs across runners? Each job records which runner ran it and overlaps in time
# (sleep) so concurrency is observable. Delete after the parallel-native-build
# design is settled.
on:
  workflow_dispatch:

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - name: Report + overlap
        run: |
          echo "shard=${{ matrix.n }} runner=${RUNNER_NAME:-?} host=$(hostname) start=$(date +%T)"
          sleep 20
          echo "shard=${{ matrix.n }} end=$(date +%T)"

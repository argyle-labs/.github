name: CI image (ci-rust)

# ─────────────────────────────────────────────────────────────────────────────
# Build + publish the prebuilt Rust toolchain image (ci-image/Dockerfile) to the
# INTERNAL Gitea container registry. Consumed by plugin-ci.yml / plugin-release
# via `container:` so CI/release jobs never re-acquire the toolchain (the
# recurring rustup / static.rust-lang.org Fastly-egress failure). See issue #53.
#
# Rebuild is rare — only when the pinned Rust version bumps (track
# orca/rust-toolchain.toml), the Dockerfile changes, or the weekly base-image
# refresh. NOT part of the per-plugin hot path.
#
# Prereqs (epic slice 1, Gitea admin): container registry enabled + a publish
# robot account. Org secrets: CI_REGISTRY_USER / CI_REGISTRY_TOKEN.
# (Names use the CI_ prefix, NOT GITEA_ — Gitea reserves the GITEA_/GITHUB_
# prefixes and rejects action secret/var names that use them.)
# Org var CI_REGISTRY points at the registry host; the committed default is
# the vanity host `gitea.scottkey.me` (TLS via Caddy). Runner hosts on the
# tailnet resolve it over valid TLS, so the default path needs NO insecure /
# HTTP handling — prefer it. Only when CI_REGISTRY is set to a plain-HTTP LAN
# endpoint (a runner that can't resolve the vanity name) set org var
# CI_REGISTRY_HTTP=true: the build then marks it insecure for buildkit, and you
# must also add that endpoint to the runner docker daemon's insecure-registries
# so `docker login` works. The real LAN endpoint lives in the var, never here —
# this repo mirrors to public GitHub.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      rust_version:
        description: Rust toolchain to bake (must match orca/rust-toolchain.toml).
        type: string
        default: "1.95.0"
  push:
    branches: [main]
    paths:
      - ci-image/**
      - .github/workflows/ci-image.yml
  schedule:
    # Weekly base-image + security refresh (Mondays 08:00 UTC).
    - cron: "0 8 * * 1"

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      RUST_VERSION: ${{ inputs.rust_version || '1.95.0' }}
      REGISTRY: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}
      IMAGE: argyle-labs/ci-rust
    steps:
      - uses: actions/checkout@v4

      # BuildKit runs in its own builder container and does NOT inherit the host
      # daemon's insecure-registries. For the default vanity TLS host this is a
      # no-op (empty config). Only when CI_REGISTRY_HTTP=true (registry is a
      # plain-HTTP LAN endpoint) do we write a buildkitd config marking it
      # insecure — otherwise the `--push` fails "HTTP response to HTTPS client".
      # Host comes from env.REGISTRY (the org var); never hardcoded — this repo
      # mirrors to public GitHub.
      - name: Buildkit registry config (only for a plain-HTTP endpoint)
        id: buildkit
        env:
          CI_REGISTRY_HTTP: ${{ vars.CI_REGISTRY_HTTP }}
        run: |
          if [ "${CI_REGISTRY_HTTP:-false}" = "true" ]; then
            {
              printf '[registry."%s"]\n' "$REGISTRY"
              printf '  http = true\n'
              printf '  insecure = true\n'
            } > "${RUNNER_TEMP}/buildkitd.toml"
            echo "config=${RUNNER_TEMP}/buildkitd.toml" >> "$GITHUB_OUTPUT"
            echo "Marked $REGISTRY insecure (HTTP) for buildkit."
          else
            echo "config=" >> "$GITHUB_OUTPUT"
            echo "Default TLS registry handling for $REGISTRY."
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # network=host so the builder resolves the vanity name via host DNS
          # (tailnet/LAN) and reaches the registry directly.
          driver-opts: network=host
          buildkitd-config: ${{ steps.buildkit.outputs.config }}

      - name: Log in to the Gitea registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ci-image
          file: ci-image/Dockerfile
          build-args: |
            RUST_VERSION=${{ env.RUST_VERSION }}
          push: true
          # Version-pinned tag (the "runner requests rust X" contract) + a
          # moving `latest` for consumers that just want the current toolchain.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.RUST_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest

      - name: Summary
        run: |
          echo "Published ${REGISTRY}/${IMAGE}:${RUST_VERSION} (+ :latest)" >> "$GITHUB_STEP_SUMMARY"

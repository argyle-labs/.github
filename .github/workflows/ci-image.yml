name: CI image (ci-rust)

# ─────────────────────────────────────────────────────────────────────────────
# Build + publish the prebuilt Rust toolchain image (ci-image/Dockerfile) to the
# INTERNAL Gitea container registry. Consumed by plugin-ci.yml / plugin-release
# via `container:` so CI/release jobs never re-acquire the toolchain (the
# recurring rustup / static.rust-lang.org Fastly-egress failure). See issue #53.
#
# Rebuild is rare — only when the pinned Rust version bumps (track
# orca/rust-toolchain.toml), the Dockerfile changes, or the weekly base-image
# refresh. NOT part of the per-plugin hot path.
#
# Prereqs (epic slice 1, Gitea admin): container registry enabled + a publish
# robot account. Org secrets: CI_REGISTRY_USER / CI_REGISTRY_TOKEN.
# (Names use the CI_ prefix, NOT GITEA_ — Gitea reserves the GITEA_/GITHUB_
# prefixes and rejects action secret/var names that use them.)
# Org var CI_REGISTRY points at the registry host; the committed default is
# the vanity host `gitea.scottkey.me` (TLS via Caddy). Runner hosts on the
# tailnet resolve it over valid TLS, so the default path needs NO insecure /
# HTTP handling — prefer it. Only when CI_REGISTRY is set to a plain-HTTP LAN
# endpoint (a runner that can't resolve the vanity name) set org var
# CI_REGISTRY_HTTP=true: the build then marks it insecure for buildkit, and you
# must also add that endpoint to the runner docker daemon's insecure-registries
# so `docker login` works. The real LAN endpoint lives in the var, never here —
# this repo mirrors to public GitHub.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      rust_version:
        description: Rust toolchain to bake (must match orca/rust-toolchain.toml).
        type: string
        default: "1.95.0"
  push:
    branches: [main]
    paths:
      - ci-image/**
      - .github/workflows/ci-image.yml
      - .github/actions/job-image-build-platform/**
      - .github/actions/job-image-merge/**
  schedule:
    # Weekly base-image + security refresh (Mondays 08:00 UTC).
    - cron: "0 8 * * 1"

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUST_VERSION: ${{ inputs.rust_version || '1.95.0' }}
  REGISTRY: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}
  IMAGE: argyle-labs/ci-rust

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/lib
      - name: Validate rust_version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . .github/lib/semver.sh
          semver_valid --stable "$RUST_VERSION" || { echo "::error::bad rust_version: $RUST_VERSION"; exit 1; }
          echo "rust=$RUST_VERSION" >> "$GITHUB_OUTPUT"

  toolkit:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
      build-version: ${{ steps.latest-build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Latest orca-plugin-toolkit
        id: latest
        uses: ./.github/actions/crate-latest
        with:
          crate: orca-plugin-toolkit
      - name: Latest orca-plugin-toolkit-build
        id: latest-build
        uses: ./.github/actions/crate-latest
        with:
          crate: orca-plugin-toolkit-build

  build:
    needs: [version, toolkit]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: linux-arm64-docker
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.platform }}
        uses: ./.github/actions/job-image-build-platform
        with:
          image: ${{ env.IMAGE }}
          platform: ${{ matrix.platform }}
          context: ci-image
          file: ci-image/Dockerfile
          build-args: |
            RUST_VERSION=${{ needs.version.outputs.rust }}
            TOOLKIT_VERSION=${{ needs.toolkit.outputs.version }}
            TOOLKIT_BUILD_VERSION=${{ needs.toolkit.outputs.build-version }}
          registry: ${{ env.REGISTRY }}
          registry-http: ${{ vars.CI_REGISTRY_HTTP || 'false' }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image tags
        id: tags
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUST_VERSION: ${{ needs.version.outputs.rust }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . .github/lib/semver.sh
          semver_valid --stable "$RUST_VERSION" || { echo "::error::bad rust_version: $RUST_VERSION"; exit 1; }
          if [ "$REF" = refs/heads/main ]; then
            printf 'tags<<EOF\n%s\nlatest\nEOF\n' "$RUST_VERSION" >> "$GITHUB_OUTPUT"
          else
            suffix=$(tr -c 'A-Za-z0-9_.\n-' '-' <<< "$REF_NAME")
            suffix=${suffix:0:$((127 - ${#RUST_VERSION}))}
            echo "tags=${RUST_VERSION}-${suffix}" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge platform digests
        uses: ./.github/actions/job-image-merge
        with:
          image: ${{ env.IMAGE }}
          tags: ${{ steps.tags.outputs.tags }}
          registry: ${{ env.REGISTRY }}
          registry-http: ${{ vars.CI_REGISTRY_HTTP || 'false' }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

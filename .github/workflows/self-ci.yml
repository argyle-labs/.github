name: Self CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: actionlint
        uses: ./.github/actions/actionlint
      - name: ShellCheck
        if: ${{ !cancelled() }}
        uses: ./.github/actions/shellcheck

name: Self CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: actionlint
        uses: ./.github/actions/actionlint
      - name: ShellCheck
        if: ${{ !cancelled() }}
        uses: ./.github/actions/shellcheck

  job-release-version:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-test
        run: bash .github/actions/job-release-version/test.sh

  release-tag:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-test
        run: bash .github/actions/release-tag/test.sh

  plugin-size-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Tools
        run: command -v jq >/dev/null || { apt-get -qq update && apt-get -qq install -y jq >/dev/null; }
      - name: Self-test
        run: bash .github/actions/plugin-size-check/test.sh

  cargo-target-cache:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-test
        run: bash .github/actions/cargo-target-cache/test.sh

  plugin-toolkit-latest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-test
        run: bash .github/actions/plugin-toolkit-latest/test.sh

  source-hash:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-test
        run: bash .github/actions/source-hash/test.sh

  crate-hashes:
    runs-on: ubuntu-latest
    container: rust:1.95-slim-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools
        run: apt-get -qq update && apt-get -qq install -y git jq nodejs >/dev/null
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-test
        run: bash .github/actions/crate-hashes/test.sh

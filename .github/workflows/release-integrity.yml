name: Release integrity (reusable)

# ─────────────────────────────────────────────────────────────────────────────
# Enforces the HARD RULE: every release goes through the pipeline and lands as a
# release WITH ASSETS on BOTH Gitea (canonical) and GitHub (mirror). Nothing may
# bypass the pipeline — a hand-cut `git tag vX.Y.Z-rc.N` produces a phantom
# (tag, no binaries, not rollable, not mirrored). This is the detective control
# that makes such a phantom fail loudly instead of sitting unnoticed.
# See [[releases-must-go-through-pipeline-assets-on-both]].
#
# One caller per repo:
#
#   name: Release integrity
#   on:
#     push: { tags: ['v*'] }        # every release tag is checked as it lands
#     schedule: [{ cron: '17 6 * * *' }]  # daily sweep catches drift / phantoms
#     workflow_dispatch: {}
#   jobs:
#     verify:
#       uses: argyle-labs/.github/.github/workflows/release-integrity.yml@main
#       secrets: inherit
#
# On a `push` of a tag, only that tag is checked. On `schedule`/`dispatch` (no
# specific tag) EVERY `v*` tag in the repo is checked — so pre-existing phantoms
# (e.g. a hand-tagged rc) are surfaced too, not just newly-pushed ones.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      tag:
        description: "Single tag to verify. Empty = verify every v* tag (sweep)."
        required: false
        type: string
        default: ""
      require_assets:
        description: "Fail if a release exists but carries zero assets."
        required: false
        type: boolean
        default: true

jobs:
  verify:
    name: Verify release assets on Gitea + GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need all tags for the sweep

      - name: Verify every release tag has assets on both registries
        env:
          # Gitea (canonical) is reached via the ambient Actions API; GitHub
          # (mirror) via the release token used by the publish workflow.
          GITEA_API: ${{ github.api_url }}
          GITEA_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUIRE_ASSETS: ${{ inputs.require_assets }}
        run: |
          set -euo pipefail

          # ── which tags to check ────────────────────────────────────────────
          if [ -n "$INPUT_TAG" ]; then
            tags="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ] && [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            tags="$REF_NAME"
          else
            tags="$(git tag -l 'v*' | sort -V)"
          fi
          if [ -z "$tags" ]; then
            echo "No v* tags to verify."; exit 0
          fi

          # ── asset name set for a release, keyed on HTTP status ─────────────
          # Prints the sentinel "MISSING" when no release exists for the tag
          # (any non-200), else the comma-joined sorted asset names (empty string
          # = a release with zero assets). Must key on the status code: a 404
          # body is empty and would otherwise be indistinguishable from a real
          # release that happens to have no assets.
          assets_for() {
            # $1 = full URL, $2 = full Authorization header value
            local resp code body
            resp="$(curl -sS -H "$2" -H "Accept: application/vnd.github+json" \
                      -w $'\n%{http_code}' "$1" 2>/dev/null || true)"
            code="$(printf '%s' "$resp" | tail -n1)"
            body="$(printf '%s' "$resp" | sed '$d')"
            if [ "$code" != "200" ]; then echo "MISSING"; return; fi
            printf '%s' "$body" | jq -r '(.assets // [] | map(.name) | sort | join(","))' 2>/dev/null || echo "MISSING"
          }
          gitea_assets()  { assets_for "$GITEA_API/repos/$REPO/releases/tags/$1" "Authorization: token $GITEA_TOKEN"; }
          github_assets() { assets_for "https://api.github.com/repos/$REPO/releases/tags/$1" "Authorization: Bearer $GH_TOKEN"; }

          # ── mirror-lag tolerance ───────────────────────────────────────────
          # Gitea is canonical: its release + assets exist the instant the tag
          # lands. The GitHub side is an ASYNC mirror — on a fresh tag push it is
          # eventually-consistent and lags by seconds-to-minutes. Failing on that
          # transient window produces a red run for a release that is fine once
          # the mirror settles. So the GitHub-side conditions (not-mirrored,
          # zero-assets, asset-mismatch) RETRY with backoff; only when they still
          # hold after MIRROR_RETRIES do we fail. Phantom (Gitea missing) is a
          # real pipeline bypass, never a mirror artifact — it fails immediately.
          MIRROR_RETRIES="${MIRROR_RETRIES:-12}"   # attempts before giving up
          MIRROR_INTERVAL="${MIRROR_INTERVAL:-15}"  # seconds between attempts

          fail=0
          for tag in $tags; do
            gt="$(gitea_assets "$tag")"

            if [ "$gt" = "MISSING" ]; then
              echo "::error title=Phantom release::$tag has a tag but NO release on Gitea — it bypassed the pipeline."
              fail=1; continue
            fi

            # Poll the GitHub mirror until it matches Gitea or we run out of tries.
            attempt=0; reason=""
            while :; do
              gh="$(github_assets "$tag")"
              if [ "$gh" = "MISSING" ]; then
                reason="Not mirrored::$tag has a Gitea release but NO release on GitHub."
              elif [ "$REQUIRE_ASSETS" = "true" ] && { [ -z "$gt" ] || [ -z "$gh" ]; }; then
                reason="No assets::$tag release exists but carries zero assets (Gitea='[$gt]' GitHub='[$gh]')."
              elif [ "$gt" != "$gh" ]; then
                reason="Asset mismatch::$tag assets differ between registries."
              else
                reason=""   # settled — Gitea and GitHub agree
                break
              fi
              [ "$attempt" -ge "$MIRROR_RETRIES" ] && break
              attempt=$((attempt + 1))
              echo "… $tag not yet consistent on GitHub (attempt $attempt/$MIRROR_RETRIES) — waiting ${MIRROR_INTERVAL}s for mirror"
              sleep "$MIRROR_INTERVAL"
            done

            if [ -n "$reason" ]; then
              echo "::error title=${reason%%::*}::${reason#*::} (still failing after $MIRROR_RETRIES retries)"
              case "$reason" in
                "Asset mismatch"*)
                  echo "  Gitea : $gt"
                  echo "  GitHub: $gh" ;;
              esac
              fail=1; continue
            fi
            echo "✓ $tag — assets match on Gitea and GitHub ($(echo "$gt" | tr ',' '\n' | grep -c . ) files)"
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::Release integrity check FAILED — a release is missing, unmirrored, or asset-incomplete. Releases must go through the pipeline and land on both Gitea and GitHub."
            exit 1
          fi
          echo "All checked release tags are intact on both registries."

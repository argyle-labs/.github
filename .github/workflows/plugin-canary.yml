name: Canary

# ─────────────────────────────────────────────────────────────────────────────
# On-demand check that a plugin still builds and tests against orca `main`.
# The PR gate is plugin-ci.yml, which pins stable orca.
#
# Every plugin repo drops a thin caller so any owner can run it by hand:
#
#   name: Canary (orca main)
#   on:
#     workflow_dispatch:
#   jobs:
#     canary:
#       uses: argyle-labs/.github/.github/workflows/plugin-canary.yml@main
#       secrets: inherit
#
# fleet-canary.yml runs the same check across every plugin nightly, so callers
# need no cron.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain to install (rustup channel)."
        required: false
        type: string
        default: "stable"

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: canary-orca-main

      - name: Drop local-dev cargo patch
        run: rm -f .cargo/config.toml

      # orca's github mirror is public; runners reach github.com directly, so no
      # auth rewrite is needed. (Fetch via git CLI: CARGO_NET_GIT_FETCH_WITH_CLI.)

      - name: Sync orca dep to main tip
        run: cargo update -p plugin-toolkit || cargo generate-lockfile

      - name: Lint (clippy) against orca main
        run: cargo clippy --all-targets -- -D warnings

      - name: Release build against orca main
        run: cargo build --release --locked || cargo build --release

      - name: Test against orca main
        run: cargo nextest run --no-fail-fast

name: CI

# PR gate for docker-compose plugins: every compose file must be well-formed
# YAML and a valid compose spec.
#
# Caller:
#
#   name: CI
#   on:
#     pull_request: { branches: [main] }
#     push:         { branches: [main] }
#   jobs:
#     ci:
#       uses: argyle-labs/.github/.github/workflows/compose-ci.yml@v1
#       secrets: inherit
#
# The caller needs no `permissions:` block; this workflow neither tags nor
# publishes.

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          Newline- or space-separated glob(s) of compose files to validate.
          Default: the repo-root compose files. Override for repos that keep
          stacks in subdirectories.
        required: false
        type: string
        default: "compose.yml compose.yaml docker-compose.yml docker-compose.yaml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Compose validate
        uses: argyle-labs/.github/.github/actions/job-compose-validate@v1
        with:
          paths: ${{ inputs.paths }}

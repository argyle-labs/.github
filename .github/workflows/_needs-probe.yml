name: _needs-probe

# THROWAWAY: when one build variant is if-skipped, does a downstream job that
# `needs` it still run, or hang forever? Decides whether parallel+sequential
# build variants can coexist in ONE pipeline (toggled by input) or must be two
# separate workflows. Delete after the design is settled.
on:
  workflow_dispatch:

jobs:
  build-parallel:
    if: ${{ true }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "parallel ran"

  build-sequential:
    if: ${{ false }}     # simulates the inactive variant
    runs-on: ubuntu-latest
    steps:
      - run: echo "sequential ran"

  publish:
    needs: [build-parallel, build-sequential]
    runs-on: ubuntu-latest
    steps:
      - run: echo "PUBLISH RAN — downstream proceeds past a skipped needs"

name: shellcheck

# shellcheck over every tracked *.sh (or `files`).

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label; a crate over the default runners' memory cap can request `ci-large`.
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: >-
          Directory the tool runs in.
        required: false
        type: string
        default: '.'
      files:
        description: >-
          Space-separated files; empty means every tracked *.sh.
        required: false
        type: string
        default: ''
    secrets:
      CI_REGISTRY_USER:
        required: false
      CI_REGISTRY_TOKEN:
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # CI-only: link the image's system OpenSSL instead of compiling openssl-src.
  # Release builds do not set this, so shipped binaries keep vendoring it.
  OPENSSL_NO_VENDOR: "1"

jobs:
  shellcheck:
    runs-on: ${{ inputs.runs-on }}
    # The ci-rust image bakes in the toolchain, sccache and Node (act needs node
    # in the job container for JS actions). Its tag tracks
    # orca/rust-toolchain.toml; bump both together.
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    # Gitea runs `run:` in a custom container with sh (dash); force bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: command -v shellcheck || { apt-get update -qq && apt-get install -y -qq --no-install-recommends shellcheck; }

      - name: shellcheck
        working-directory: ${{ inputs.working-directory }}
        env:
          FILES: ${{ inputs.files }}
        run: |
          export t0=$SECONDS; trap 'echo "shellcheck|$((SECONDS - t0))|$?" >> /tmp/ci-phases' EXIT
          if [ -n "$FILES" ]; then
            read -ra files <<< "$FILES"
            shellcheck "${files[@]}"
          else
            git ls-files -z '*.sh' | xargs -0 -r shellcheck
          fi

      - uses: argyle-labs/.github/.github/actions/ci-summary@main
        if: ${{ !cancelled() }}

name: _container-probe
# THROWAWAY: does a STATIC object matrix drive job-level `container:` per-job on
# this act? Each job should run INSIDE its rust image (cargo present, distro
# differs). Both SUCCESS = the native-distro-via-container: design is valid.
on:
  workflow_dispatch:
jobs:
  incontainer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: gnu
            image: rust:1-bookworm
          - target: musl
            image: rust:1-alpine
    container: ${{ matrix.image }}
    steps:
      - name: prove we are inside ${{ matrix.image }}
        run: |
          echo "target=${{ matrix.target }}"
          cargo --version
          (. /etc/os-release; echo "distro=$PRETTY_NAME")

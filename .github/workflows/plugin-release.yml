name: Plugin release (reusable)

# ─────────────────────────────────────────────────────────────────────────────
# Reusable release workflow for orca dynamic (subprocess) plugins.
#
# Every retired plugin now ships as a Rust `[[bin]]` orca spawns and speaks the
# UDS wire protocol to — NOT a dlopened `cdylib`. So the artifact is the release
# executable `target/<triple>/release/<bin>`, plus a `.sha256`. This is the fix
# for the fleet-wide RC failure where the old workflows looked for a
# `lib<name>.so` that retired (rlib + [[bin]]) crates no longer emit.
#
# One caller per plugin repo does:
#
#   permissions:
#     contents: write            # REQUIRED — see note below.
#   jobs:
#     release:
#       uses: argyle-labs/.github/.github/workflows/plugin-release.yml@main
#       secrets: inherit
#       with:
#         channel: ${{ inputs.channel }}
#         bump:    ${{ inputs.bump }}
#
# ⚠ Caller `permissions:` is mandatory. The `release` job below requests
# `contents: write` (to create the GitHub Release). A reusable workflow can only
# be granted permissions the CALLER's GITHUB_TOKEN already holds — GitHub
# validates this when it builds the run graph, BEFORE any job starts. The org
# (and every plugin repo) defaults `default_workflow_permissions` to `read`, so
# a caller with no `permissions:` block hands this workflow a read-only token.
# The requested `contents: write` then exceeds the grant and GitHub aborts the
# whole run with `startup_failure` — no jobs, no logs, no annotations. Granting
# `contents: write` on the caller (as above) is what makes the graph valid.
# `secrets: inherit` does NOT carry permissions; only secrets.
#
# Version math (mirrors orca's compute_rc_version, one logic across all repos):
#   • base = highest `vX.Y.Z` stable tag (v0.0.0 if none), bumped by `bump`
#     (patch | minor | major).
#   • channel=rc     → `v<base>-rc.<n>`, n = next free rc index for that base
#     (prerelease).
#   • channel=stable → `v<base>` (full release).
# The computed version is written into Cargo.toml at build time so each binary
# embeds the right CARGO_PKG_VERSION; the git tag is the source of truth, so the
# committed Cargo.toml version is never hand-managed.
#
# Multi-target: `targets` is a JSON array of Rust triples (default: one glibc
# x86_64 job). Repos that ship for multiple hosts (glibc + musl) pass both; each
# builds in its own parallel matrix job (cross-compiled with cargo-zigbuild for
# non-host targets) and uploads its asset, then one release gathers them all.
#
# Multi-bin workspaces (e.g. `arr`, which builds one plugin per *arr app): pass
# `bins` as a JSON array of bin names. Single-package repos leave it empty and
# the bin name is derived from `cargo metadata` (the crate's sole bin target).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      channel:
        description: "Release channel: rc (prerelease) or stable"
        required: true
        type: string
      bump:
        description: "Version bump from latest stable tag: patch | minor | major"
        required: true
        type: string
      targets:
        description: >-
          JSON array of Rust target triples to build. Default: the six
          first-party release triples — linux glibc (x86_64 + aarch64), linux
          musl (x86_64 + aarch64, built static so one binary runs on both musl
          and glibc hosts), and apple darwin (x86_64 + aarch64). Every non-host
          target cross-compiles with cargo-zigbuild. Keep this list in sync with
          orca core's TARGET_TRIPLES single source of truth
          (projects/system/src/release_targets.rs) — the two are asserted equal
          by an orca test; do not diverge them by hand.
        required: false
        type: string
        default: >-
          ["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","aarch64-apple-darwin","x86_64-apple-darwin"]
      bins:
        description: 'JSON array of bin names to build+publish. Empty ([]) = derive the crate''s sole bin from cargo metadata.'
        required: false
        type: string
        default: "[]"
      notes:
        description: "Extra release notes (optional)"
        required: false
        type: string
        default: ""
      size_budget_mib:
        description: "Thinness budget (MiB). Over this, the build emits a warning (soft gate)."
        required: false
        type: number
        default: 20

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # ── Compute the version/tag once, shared by every build job + the release. ──
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version from tags
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true
          latest_stable=$(git tag -l 'v[0-9]*' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -1)
          latest_stable=${latest_stable:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest_stable#v}"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
            *) echo "::error::bump must be patch|minor|major (got '${{ inputs.bump }}')"; exit 1 ;;
          esac
          base="${major}.${minor}.${patch}"
          case "${{ inputs.channel }}" in
            stable)
              version="$base"; tag="v$base"; prerelease=false ;;
            rc)
              latest_rc=$(git tag -l "v${base}-rc.*" | sort -V | tail -1)
              if [ -z "$latest_rc" ]; then n=1; else n=${latest_rc##*rc.}; n=$((n+1)); fi
              version="${base}-rc.${n}"; tag="v${version}"; prerelease=true ;;
            *)
              echo "::error::channel must be rc|stable (got '${{ inputs.channel }}')"; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "→ ${{ inputs.channel }} (${{ inputs.bump }}) from ${latest_stable}: $tag"

  # ── Derive the build matrix from the caller-passed `targets`. ───────────────
  # Callers still pass a flat JSON array of triples (backward-compatible — their
  # `with.targets` input is untouched). This job maps each triple → the runner it
  # must build on and the build method, so the darwin legs run NATIVELY on
  # GitHub-hosted macOS runners (real macOS SDK → the Security/CoreFoundation
  # frameworks rustls-platform-verifier links against exist) instead of
  # cross-compiling on ubuntu with cargo-zigbuild (no macOS SDK there → link fails).
  # GitHub-hosted macOS runners are FREE for public repos (all plugin repos are
  # public), match each target's native arch, and parallelize — replacing the
  # self-hosted mint runner's serialization + flakiness.
  #
  # Mapping (keep in sync with orca release_targets):
  #   aarch64-apple-darwin → runner "macos-14" (Apple Silicon, native arm64 host),
  #                          method "native" (plain `cargo build --target`).
  #   x86_64-apple-darwin  → runner "macos-13" (Intel, native x86_64 host),
  #                          method "native" (plain `cargo build --target`).
  #                          Each hosted runner matches its target's native arch,
  #                          so `--target` resolves and the Apple SDK/frameworks
  #                          are present — real frameworks, no zig.
  #   *-linux-*            → runner ubuntu-latest, method "zig" (x86_64-gnu is the
  #                          host so plain `cargo build`; every other linux triple
  #                          keeps cargo-zigbuild + static musl — UNCHANGED).
  #
  # Runner value shape: darwin legs emit a JSON-encoded STRING ("\"macos-14\""),
  # so `fromJSON(matrix.runner)` yields the plain string `macos-14` (a valid
  # runs-on). Linux legs emit a JSON array string ("[\"ubuntu-latest\"]") →
  # `["ubuntu-latest"]`. Both are valid runs-on values.
  matrix:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - name: Build target→runner→method matrix
        id: gen
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          include=$(echo "$TARGETS" | jq -c '[ .[] | {
            target: .,
            runner: (if . == "aarch64-apple-darwin" then "\"macos-14\""
                     elif . == "x86_64-apple-darwin" then "\"macos-13\""
                     else "[\"ubuntu-latest\"]" end),
            method: (if endswith("-apple-darwin") then "native" else "zig" end)
          } ]')
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "$include" | jq .

  # ── One parallel job per (target). Each builds every requested bin and
  #    uploads its asset(s). Bin list is resolved once here from cargo metadata
  #    when the caller passes bins=[].                                        ──
  build:
    needs: [version, matrix]
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Drop local-dev cargo patch
        run: rm -f .cargo/config.toml

      - name: Authenticate private orca git dependency
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.ORCA_FETCH_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Write computed version into Cargo.toml
        run: |
          set -euo pipefail
          # Matches both `[package].version` and `[workspace.package].version`
          # (both are `version = "…"` at column 0 in these repos).
          # perl -i behaves identically on GNU (ubuntu) and BSD (macOS/self-hosted)
          # runners; `sed -i` is not portable — BSD sed treats the file as the
          # command arg without a backup suffix and fails ("invalid command code").
          perl -i -pe 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - name: Resolve bin list
        id: bins
        run: |
          set -euo pipefail
          requested='${{ inputs.bins }}'
          if [ "$(echo "$requested" | tr -d '[:space:]')" != "[]" ]; then
            # Caller supplied an explicit bin list (JSON array) — use it verbatim.
            bins=$(echo "$requested" | jq -r '.[]')
          else
            # Derive the crate's bin target(s) from cargo metadata. For a single
            # subprocess plugin this is exactly one bin (name == crate name).
            bins=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[].targets[] | select(.kind[] == "bin") | .name')
          fi
          if [ -z "$bins" ]; then
            echo "::error::no bin targets found — is this a [[bin]] plugin crate?"; exit 1
          fi
          {
            echo "list<<EOF"
            echo "$bins"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "bins: $(echo "$bins" | paste -sd, -)"

      - name: Install cross toolchain (zig + cargo-zigbuild)
        if: matrix.method == 'zig' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          python3 -m pip install --user cargo-zigbuild ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Add rust target
        # Install std for the matrix triple on EVERY leg. On the GitHub-hosted
        # macOS runners each darwin triple is the HOST arch (aarch64 on macos-14,
        # x86_64 on macos-13), so `rustup target add` is a no-op there — but it is
        # kept unconditional so the explicit per-triple --target below always has
        # matching std and pins the artifact to the single, matrix-derived output
        # path (target/<triple>/release) the staging step reads. On linux legs it
        # installs std for the cross musl/gnu triples as before.
        run: rustup target add "${{ matrix.target }}"

      - name: Build release binaries
        env:
          # musl: build FULLY STATIC (crt-static is already the musl default in
          # rustc; we assert it explicitly). A static musl binary carries its own
          # libc and so runs on BOTH musl (Alpine) and glibc hosts — that is the
          # whole reason we ship musl at all, and it lets orca's linux asset
          # resolver prefer the musl-static asset with a gnu fallback (see orca
          # core release_targets::linux_asset_preference). Now that plugins are
          # spawned as subprocesses (not dlopened into the daemon), the old
          # "disable crt-static so the daemon can dlopen it" rule no longer
          # applies — a static executable spawns fine.
          RUSTFLAGS: ${{ contains(matrix.target, '-musl') && '-C target-feature=+crt-static' || '' }}
        run: |
          set -euo pipefail
          # Build method comes from the derived matrix:
          #   native → real toolchain (darwin on GitHub-hosted macOS runners; the
          #            Apple SDK is present so the Security/CoreFoundation frameworks
          #            link). Each hosted runner is its target's native arch, so the
          #            build uses plain cargo with --target.
          #   zig    → linux legs (UNCHANGED): host x86_64-gnu uses plain cargo,
          #            every other linux triple uses cargo-zigbuild (+ static musl).
          if [ "${{ matrix.method }}" = "native" ] \
             || [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            builder="cargo build"
          else
            builder="cargo zigbuild"
          fi
          # Build every requested bin (`--bin` per name keeps it explicit and lets
          # multi-bin workspaces like `arr` build one plugin per *arr app).
          bin_flags=""
          while IFS= read -r b; do
            [ -n "$b" ] && bin_flags="$bin_flags --bin $b"
          done <<< '${{ steps.bins.outputs.list }}'
          # `--target` is LOAD-BEARING for the output path. With it, cargo (and
          # cargo-zigbuild) always emit to `target/<triple>/release/<bin>` — even
          # when <triple> equals the host — which is exactly where the staging
          # step below reads. Drop it and a host build lands in `target/release/`
          # instead and staging fails with "binary not found". We ALSO export
          # CARGO_BUILD_TARGET as belt-and-suspenders so a stray host-default
          # can't redirect the output dir; the
          # explicit flag and the env agree, so every leg (native + zig) resolves
          # to the same target/<triple>/release path.
          export CARGO_BUILD_TARGET="${{ matrix.target }}"
          echo "→ $builder --release --target ${{ matrix.target }}$bin_flags"
          # shellcheck disable=SC2086
          $builder --release --target "${{ matrix.target }}" $bin_flags

      - name: Stage artifacts (+ thinness report)
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          budget="${{ inputs.size_budget_mib }}"
          while IFS= read -r bin; do
            [ -z "$bin" ] && continue
            path="target/${{ matrix.target }}/release/${bin}"
            if [ ! -f "$path" ]; then
              echo "::error::binary not found at $path"
              echo "── expected (target-triple) dir ──"
              ls -la "target/${{ matrix.target }}/release" || echo "  (missing)"
              # If a build ever dropped --target the artifact would land here.
              # Surface it so the failure names the exact mismatch instead of
              # leaving the next re-cut to guess.
              echo "── host (no-triple) dir — should NOT contain the bin ──"
              ls -la "target/release" || echo "  (missing)"
              exit 1
            fi
            asset="${bin}-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
            cp "$path" "dist/$asset"
            # shasum -a 256 is present on both ubuntu and macOS runners with
            # identical `<hash>  <file>` output; sha256sum is GNU-only (absent
            # on macOS) and broke the darwin legs.
            ( cd dist && shasum -a 256 "$asset" > "${asset}.sha256" )

            # ── Thinness gate (soft) ──────────────────────────────────────────
            # A plugin should be logic + generated types + serde, delegating heavy
            # capabilities to orca — not bundling the runtime. Report every release
            # and warn (don't fail) over budget so bloat stays visible per build.
            # wc -c is POSIX/portable; `stat -c%s` is GNU-only (macOS uses -f%z).
            bytes=$(wc -c < "dist/$asset" | tr -d '[:space:]')
            mib=$(( bytes / 1048576 ))
            echo "### 📦 ${asset}: ${mib} MiB (${bytes} bytes)" >> "$GITHUB_STEP_SUMMARY"
            echo "plugin binary ${asset} = ${mib} MiB"
            if [ "$mib" -gt "$budget" ]; then
              echo "::warning title=Plugin over size budget::${asset} is ${mib} MiB (budget ${budget} MiB). Delegate more to orca / shed bundled deps to slim it."
            fi
          done <<< '${{ steps.bins.outputs.list }}'

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: dist/*
          retention-days: 3

  # ── Gather every target's artifacts and publish one (pre)release. ──
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.channel }}-${{ inputs.bump }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: plugin-*
          merge-multiple: true

      - name: Create GitHub Release (pipeline-tagged)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          flags=""
          [ "${{ needs.version.outputs.prerelease }}" = "true" ] && flags="--prerelease"
          notes="${{ inputs.notes }}"
          [ -z "$notes" ] && notes="Automated ${{ inputs.channel }} release of \`${{ github.repository }}\`, built against orca \`main\`. Plugin binary + sha256 per host target."
          ls -la dist
          gh release create "${{ needs.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --notes "$notes" \
            $flags \
            dist/*

name: Plugin release (reusable)

# Reusable release for orca subprocess plugins. Artifact = target/<triple>/
# release/<bin> + .sha256. Reached only via a caller workflow_dispatch
# (channel=rc, then stable) — that operator trigger is the approval gate;
# building happens here, post-approval (plugin-ci.yml is test+lint only).
#
# COMPOSABLE TARGETS: one build-<triple> job per requested target, guarded by
# `if: contains(fromJSON(inputs.targets), '<triple>')`. A skipped job is never
# dispatched to a runner, so publishing a subset limits runner usage.
# NATIVE ROUTING: inputs.runs_on maps a triple → runner label; the shared
# plugin-build action auto-detects native (cargo build) vs cross (cargo
# zigbuild). Default routes aarch64-apple-darwin to the macos runner.
#
# Caller MUST set `permissions: contents: write` (secrets: inherit does not
# carry permissions); the release job creates the release.

on:
  workflow_call:
    inputs:
      channel:
        description: "Release channel: rc (prerelease) or stable"
        required: true
        type: string
      bump:
        description: "Version bump from latest stable tag: patch | minor | major"
        required: true
        type: string
      targets:
        description: JSON array of target triples to build+publish (unrequested = skipped, no runner).
        required: false
        type: string
        default: >-
          ["x86_64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-apple-darwin"]
      runs_on:
        description: JSON map triple → runs-on label. Unlisted → ubuntu-latest (zig-cross).
        required: false
        type: string
        default: >-
          {"x86_64-unknown-linux-gnu":"ubuntu-latest","aarch64-unknown-linux-gnu":"ubuntu-latest","x86_64-unknown-linux-musl":"ubuntu-latest","aarch64-unknown-linux-musl":"ubuntu-latest","aarch64-apple-darwin":"macos","x86_64-apple-darwin":"ubuntu-latest"}
      bins:
        description: JSON array of bin names. Empty ([]) = derive from cargo metadata.
        required: false
        type: string
        default: "[]"
      notes:
        description: "Extra release notes (optional)"
        required: false
        type: string
        default: ""
      size_budget_mib:
        description: "Thinness budget (MiB). Over this, the build emits a warning (soft gate)."
        required: false
        type: number
        default: 20

jobs:
  # ── Compute the version/tag once, shared by every build job + the release. ──
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version from tags
        id: ver
        # Same rule as the publish step: caller inputs reach the shell through the
        # environment. These are `choice` in each repo's thin caller, but this is a
        # reusable workflow — a caller may pass any string via `with:`, and the
        # `case` validation below runs AFTER interpolation would already have
        # executed it.
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true
          latest_stable=$(git tag -l 'v[0-9]*' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -1)
          latest_stable=${latest_stable:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest_stable#v}"
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
            *) echo "::error::bump must be patch|minor|major (got '$BUMP')"; exit 1 ;;
          esac
          base="${major}.${minor}.${patch}"
          case "$CHANNEL" in
            stable)
              version="$base"; tag="v$base"; prerelease=false ;;
            rc)
              latest_rc=$(git tag -l "v${base}-rc.*" | sort -V | tail -1)
              if [ -z "$latest_rc" ]; then n=1; else n=${latest_rc##*rc.}; n=$((n+1)); fi
              version="${base}-rc.${n}"; tag="v${version}"; prerelease=true ;;
            *)
              echo "::error::channel must be rc|stable (got '$CHANNEL')"; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "→ $CHANNEL ($BUMP) from ${latest_stable}: $tag"

  # ── Build the frontend ONCE for UI plugins (e.g. peacock: a SvelteKit app in
  #    ui/). ui/dist is what rust-embed bakes into the binary, but it is
  #    gitignored (only a placeholder index.html is tracked) — so without this a
  #    released binary embeds the placeholder, not the app. Build it once in the
  #    ci-rust container (has Node/npm) and publish ui/dist as an artifact; every
  #    target build job below downloads it before cargo build, so a single UI
  #    build serves all targets (incl. macOS, which then needs no Node). Gated on
  #    ui/package.json via the has_ui output; Rust-only plugins produce nothing. ──
  ui-build:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    outputs:
      has_ui: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect UI
        id: detect
        run: |
          if [ -f ui/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no ui/package.json — no frontend to build"
          fi
      - name: Build frontend (npm ci → vite build → ui/dist)
        if: steps.detect.outputs.present == 'true'
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Publish ui/dist artifact
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  # ── One build job per supported triple (guard-skipped unless requested). Each
  #    builds via the shared plugin-build action (write version → native/cross
  #    build → stage binary+sha256 → upload artifact) for the release to gather. ──
  build-x86_64-linux-gnu:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'x86_64-unknown-linux-gnu')
    runs-on: ${{ fromJSON(inputs.runs_on)['x86_64-unknown-linux-gnu'] || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch prebuilt UI (real frontend for UI plugins; skipped otherwise)
        if: needs.ui-build.outputs.has_ui == 'true'
        uses: actions/download-artifact@v3
        with:
          name: ui-dist
          path: ui/dist
      - uses: argyle-labs/.github/.github/actions/plugin-build@main
        with:
          target: x86_64-unknown-linux-gnu
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

  build-aarch64-linux-gnu:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'aarch64-unknown-linux-gnu')
    runs-on: ${{ fromJSON(inputs.runs_on)['aarch64-unknown-linux-gnu'] || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch prebuilt UI (real frontend for UI plugins; skipped otherwise)
        if: needs.ui-build.outputs.has_ui == 'true'
        uses: actions/download-artifact@v3
        with:
          name: ui-dist
          path: ui/dist
      - uses: argyle-labs/.github/.github/actions/plugin-build@main
        with:
          target: aarch64-unknown-linux-gnu
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

  build-x86_64-linux-musl:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'x86_64-unknown-linux-musl')
    runs-on: ${{ fromJSON(inputs.runs_on)['x86_64-unknown-linux-musl'] || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch prebuilt UI (real frontend for UI plugins; skipped otherwise)
        if: needs.ui-build.outputs.has_ui == 'true'
        uses: actions/download-artifact@v3
        with:
          name: ui-dist
          path: ui/dist
      - uses: argyle-labs/.github/.github/actions/plugin-build@main
        with:
          target: x86_64-unknown-linux-musl
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

  build-aarch64-linux-musl:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'aarch64-unknown-linux-musl')
    runs-on: ${{ fromJSON(inputs.runs_on)['aarch64-unknown-linux-musl'] || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch prebuilt UI (real frontend for UI plugins; skipped otherwise)
        if: needs.ui-build.outputs.has_ui == 'true'
        uses: actions/download-artifact@v3
        with:
          name: ui-dist
          path: ui/dist
      - uses: argyle-labs/.github/.github/actions/plugin-build@main
        with:
          target: aarch64-unknown-linux-musl
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

  build-aarch64-darwin:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'aarch64-apple-darwin')
    runs-on: ${{ fromJSON(inputs.runs_on)['aarch64-apple-darwin'] || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch prebuilt UI (real frontend for UI plugins; skipped otherwise)
        if: needs.ui-build.outputs.has_ui == 'true'
        uses: actions/download-artifact@v3
        with:
          name: ui-dist
          path: ui/dist
      - uses: argyle-labs/.github/.github/actions/plugin-build@main
        with:
          target: aarch64-apple-darwin
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

  build-x86_64-darwin:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'x86_64-apple-darwin')
    runs-on: ${{ fromJSON(inputs.runs_on)['x86_64-apple-darwin'] || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch prebuilt UI (real frontend for UI plugins; skipped otherwise)
        if: needs.ui-build.outputs.has_ui == 'true'
        uses: actions/download-artifact@v3
        with:
          name: ui-dist
          path: ui/dist
      - uses: argyle-labs/.github/.github/actions/plugin-build@main
        with:
          target: x86_64-apple-darwin
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

  # ── Gather every requested target's artifacts and publish one (pre)release. ──
  release:
    needs:
      - version
      - ui-build
      - build-x86_64-linux-gnu
      - build-aarch64-linux-gnu
      - build-x86_64-linux-musl
      - build-aarch64-linux-musl
      - build-aarch64-darwin
      - build-x86_64-darwin
    if: ${{ always() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.channel }}-${{ inputs.bump }}
      cancel-in-progress: false
    steps:
      - name: Verify no requested build failed
        run: |
          set -euo pipefail
          fail=0
          for r in \
            "ui-build:${{ needs.ui-build.result }}" \
            "gnu-x86:${{ needs.build-x86_64-linux-gnu.result }}" \
            "gnu-arm:${{ needs.build-aarch64-linux-gnu.result }}" \
            "musl-x86:${{ needs.build-x86_64-linux-musl.result }}" \
            "musl-arm:${{ needs.build-aarch64-linux-musl.result }}" \
            "darwin-arm:${{ needs.build-aarch64-darwin.result }}" \
            "darwin-x86:${{ needs.build-x86_64-darwin.result }}"; do
            name=${r%%:*}; res=${r#*:}
            echo "  $name = $res"
            case "$res" in success|skipped) ;; *) echo "::error::$name = $res"; fail=1 ;; esac
          done
          exit $fail

      - uses: actions/checkout@v4

      - name: Download all target artifacts
        uses: actions/download-artifact@v3
        with:
          path: dist
      - name: Flatten downloaded artifacts
        run: |
          set -euo pipefail
          find dist -mindepth 2 -type f | while IFS= read -r f; do mv -f "$f" dist/; done
          find dist -mindepth 1 -type d -empty -delete

      - name: Create Gitea Release (pipeline-tagged)
        # Publish to GITEA — the canonical forge ([[gitea-canonical-github-mirror-only]]).
        # GitHub is an OUTBOUND-ONLY mirror; nothing here writes to api.github.com.
        env:
          GITEA_TOKEN: ${{ secrets.ORCA_RELEASE_TOKEN || github.token }}
          # Operator-supplied free text. It MUST arrive through the environment,
          # never via `${{ }}` inside the script: expression interpolation happens
          # before the shell parses, so backticks or $(…) in release notes would be
          # executed — with contents:write and inherited secrets in scope. Release
          # notes for a *software* project contain backticks routinely, and when
          # they did, publish died with `missing: command not found` (exit 127)
          # AFTER every build went green, producing no release at all.
          # Double-quoting alone does NOT fix this: `…` still substitutes inside "…".
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${{ needs.version.outputs.tag }}"
          api="${{ github.api_url }}"
          server="${{ github.server_url }}"
          hdr_auth="Authorization: token ${GITEA_TOKEN}"
          accept="Accept: application/json"
          notes="$NOTES"
          [ -z "$notes" ] && notes="Automated ${{ inputs.channel }} release of \`${repo}\`, built against orca \`main\`. Plugin binary + sha256 per host target."
          ls -la dist

          payload=$(jq -n \
            --arg tag "$tag" \
            --arg sha "${{ github.sha }}" \
            --arg name "$tag" \
            --arg body "$notes" \
            --argjson pre ${{ needs.version.outputs.prerelease }} \
            '{tag_name:$tag, target_commitish:$sha, name:$name, body:$body, prerelease:$pre, draft:false}')
          resp=$(curl -fsSL -X POST -H "$hdr_auth" -H "$accept" -H "Content-Type: application/json" \
            "$api/repos/$repo/releases" -d "$payload" 2>/dev/null || true)
          rid=$(printf '%s' "$resp" | jq -r '.id // empty')
          if [ -z "$rid" ]; then
            echo "→ create did not return an id; looking up existing release for $tag"
            rid=$(curl -fsSL -H "$hdr_auth" -H "$accept" \
              "$api/repos/$repo/releases/tags/$tag" | jq -r '.id // empty')
          fi
          if [ -z "$rid" ]; then
            echo "::error::could not create or find release $tag"; echo "$resp"; exit 1
          fi
          echo "release id: $rid"

          for f in dist/*; do
            name=$(basename "$f")
            echo "→ uploading $name"
            code=$(curl -sS -X POST -H "$hdr_auth" \
              -F "attachment=@${f};filename=${name}" \
              -o /tmp/upload_resp.json -w '%{http_code}' \
              "$api/repos/$repo/releases/$rid/assets?name=$name")
            if [ "$code" -ge 300 ]; then
              echo "::error::asset upload failed for $name (HTTP $code)"; cat /tmp/upload_resp.json || true; exit 1
            fi
          done
          set -- dist/*
          echo "published $tag with $# files → ${server}/$repo/releases/tag/$tag"

name: Plugin release (reusable)

# ─────────────────────────────────────────────────────────────────────────────
# Reusable release workflow for orca dynamic (subprocess) plugins.
#
# Every retired plugin now ships as a Rust `[[bin]]` orca spawns and speaks the
# UDS wire protocol to — NOT a dlopened `cdylib`. So the artifact is the release
# executable `target/<triple>/release/<bin>`, plus a `.sha256`. This is the fix
# for the fleet-wide RC failure where the old workflows looked for a
# `lib<name>.so` that retired (rlib + [[bin]]) crates no longer emit.
#
# One caller per plugin repo does:
#
#   permissions:
#     contents: write            # REQUIRED — see note below.
#   jobs:
#     release:
#       uses: argyle-labs/.github/.github/workflows/plugin-release.yml@main
#       secrets: inherit
#       with:
#         channel: ${{ inputs.channel }}
#         bump:    ${{ inputs.bump }}
#
# ⚠ Caller `permissions:` is mandatory. The `release` job below requests
# `contents: write` (to create the GitHub Release). A reusable workflow can only
# be granted permissions the CALLER's GITHUB_TOKEN already holds — GitHub
# validates this when it builds the run graph, BEFORE any job starts. The org
# (and every plugin repo) defaults `default_workflow_permissions` to `read`, so
# a caller with no `permissions:` block hands this workflow a read-only token.
# The requested `contents: write` then exceeds the grant and GitHub aborts the
# whole run with `startup_failure` — no jobs, no logs, no annotations. Granting
# `contents: write` on the caller (as above) is what makes the graph valid.
# `secrets: inherit` does NOT carry permissions; only secrets.
#
# Version math (mirrors orca's compute_rc_version, one logic across all repos):
#   • base = highest `vX.Y.Z` stable tag (v0.0.0 if none), bumped by `bump`
#     (patch | minor | major).
#   • channel=rc     → `v<base>-rc.<n>`, n = next free rc index for that base
#     (prerelease).
#   • channel=stable → `v<base>` (full release).
# The computed version is written into Cargo.toml at build time so each binary
# embeds the right CARGO_PKG_VERSION; the git tag is the source of truth, so the
# committed Cargo.toml version is never hand-managed.
#
# Multi-target: `targets` is a JSON array of Rust triples (default: one glibc
# x86_64 job). Repos that ship for multiple hosts (glibc + musl) pass both; each
# builds in its own parallel matrix job (cross-compiled with cargo-zigbuild for
# non-host targets) and uploads its asset, then one release gathers them all.
#
# Multi-bin workspaces (e.g. `arr`, which builds one plugin per *arr app): pass
# `bins` as a JSON array of bin names. Single-package repos leave it empty and
# the bin name is derived from `cargo metadata` (the crate's sole bin target).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      channel:
        description: "Release channel: rc (prerelease) or stable"
        required: true
        type: string
      bump:
        description: "Version bump from latest stable tag: patch | minor | major"
        required: true
        type: string
      targets:
        description: >-
          JSON array of Rust target triples to build. Default: the six
          first-party release triples — linux glibc (x86_64 + aarch64), linux
          musl (x86_64 + aarch64, built static so one binary runs on both musl
          and glibc hosts), and apple darwin (x86_64 + aarch64). Every non-host
          target cross-compiles with cargo-zigbuild. Keep this list in sync with
          orca core's TARGET_TRIPLES single source of truth
          (projects/system/src/release_targets.rs) — the two are asserted equal
          by an orca test; do not diverge them by hand.
        required: false
        type: string
        default: >-
          ["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","aarch64-apple-darwin","x86_64-apple-darwin"]
      bins:
        description: 'JSON array of bin names to build+publish. Empty ([]) = derive the crate''s sole bin from cargo metadata.'
        required: false
        type: string
        default: "[]"
      notes:
        description: "Extra release notes (optional)"
        required: false
        type: string
        default: ""
      size_budget_mib:
        description: "Thinness budget (MiB). Over this, the build emits a warning (soft gate)."
        required: false
        type: number
        default: 20

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # ── Compute the version/tag once, shared by every build job + the release. ──
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version from tags
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true
          latest_stable=$(git tag -l 'v[0-9]*' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -1)
          latest_stable=${latest_stable:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest_stable#v}"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
            *) echo "::error::bump must be patch|minor|major (got '${{ inputs.bump }}')"; exit 1 ;;
          esac
          base="${major}.${minor}.${patch}"
          case "${{ inputs.channel }}" in
            stable)
              version="$base"; tag="v$base"; prerelease=false ;;
            rc)
              latest_rc=$(git tag -l "v${base}-rc.*" | sort -V | tail -1)
              if [ -z "$latest_rc" ]; then n=1; else n=${latest_rc##*rc.}; n=$((n+1)); fi
              version="${base}-rc.${n}"; tag="v${version}"; prerelease=true ;;
            *)
              echo "::error::channel must be rc|stable (got '${{ inputs.channel }}')"; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "→ ${{ inputs.channel }} (${{ inputs.bump }}) from ${latest_stable}: $tag"

  # ── One parallel job per target triple. Each builds every requested bin and
  #    uploads its asset(s). Bin list is resolved once here from cargo metadata
  #    when the caller passes bins=[].                                        ──
  #
  # The matrix is the caller-passed `targets` array directly — a flat list of
  # Rust triples. There is NO separate matrix-derivation job and NO dynamic
  # `strategy.matrix.include`. Gitea's (act) workflow parser PANICS when
  # `matrix.include` is an expression (`${{ fromJSON(...) }}`) instead of a
  # literal list of maps — it aborted every release run on Gitea. A plain
  # `matrix.target: ${{ fromJSON(inputs.targets) }}` is the portable single-key
  # matrix pattern that runs identically on GitHub and Gitea.
  #
  # EVERY target builds on a single Linux runner (ubuntu-latest) via
  # cargo-zigbuild — including the apple-darwin triples, which zig
  # cross-compiles from Linux. This is deliberate:
  #   • Gitea's act runs an entire matrix on the ONE runner that claimed the
  #     job; it does NOT honour a per-leg `runs-on` expression to fan darwin
  #     legs onto a macOS runner (unlike GitHub). A matrix that mixes
  #     ubuntu-latest and macos-14 therefore runs every leg on whichever runner
  #     grabbed it — darwin legs land on Linux and native `cargo build` fails.
  #   • Cross-compiling all targets on Linux with zig means the release needs
  #     NO self-hosted macOS runner at all — nothing has to run on a laptop.
  # Build method DERIVED from the triple inline: the host x86_64-gnu builds with
  # plain `cargo build`; every other triple (linux musl/aarch64 AND both darwin)
  # uses `cargo zigbuild`. musl stays static (crt-static) as before.
  build:
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Drop local-dev cargo patch
        run: rm -f .cargo/config.toml

      - name: Authenticate private orca git dependency (Gitea)
        run: |
          # orca (plugin-toolkit) is fetched from Gitea — the canonical forge
          # ([[gitea-canonical-github-mirror-only]]). Cargo.toml still spells the
          # dep as github.com/argyle-labs/orca; this insteadOf rewrites only the
          # HOST to Gitea (identical org/repo path) and injects the token, so the
          # build has NO internal dependency on GitHub. It does not affect the
          # public actions/SDK curls (those are not git operations).
          # NOTE: ORCA_FETCH_TOKEN must now be a GITEA token with read access to
          # argyle-labs/orca (it was a GitHub PAT before this cutover). The
          # auto per-repo Actions token cannot read a second repo, so a PAT-style
          # secret is still required for the cross-repo dep fetch.
          git config --global \
            url."https://x-access-token:${{ secrets.ORCA_FETCH_TOKEN }}@gitea.scottkey.me/".insteadOf \
            "https://github.com/"

      - name: Write computed version into Cargo.toml
        run: |
          set -euo pipefail
          # Matches both `[package].version` and `[workspace.package].version`
          # (both are `version = "…"` at column 0 in these repos).
          # perl -i behaves identically on GNU (ubuntu) and BSD (macOS/self-hosted)
          # runners; `sed -i` is not portable — BSD sed treats the file as the
          # command arg without a backup suffix and fails ("invalid command code").
          perl -i -pe 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - name: Resolve bin list
        id: bins
        run: |
          set -euo pipefail
          requested='${{ inputs.bins }}'
          if [ "$(echo "$requested" | tr -d '[:space:]')" != "[]" ]; then
            # Caller supplied an explicit bin list (JSON array) — use it verbatim.
            bins=$(echo "$requested" | jq -r '.[]')
          else
            # Derive the crate's bin target(s) from cargo metadata. For a single
            # subprocess plugin this is exactly one bin (name == crate name).
            bins=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[].targets[] | select(.kind[] == "bin") | .name')
          fi
          if [ -z "$bins" ]; then
            echo "::error::no bin targets found — is this a [[bin]] plugin crate?"; exit 1
          fi
          {
            echo "list<<EOF"
            echo "$bins"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "bins: $(echo "$bins" | paste -sd, -)"

      - name: Install cross toolchain (zig + cargo-zigbuild)
        # Needed for every non-host target — all linux cross triples AND both
        # apple-darwin triples (zig cross-compiles darwin from Linux).
        if: ${{ matrix.target != 'x86_64-unknown-linux-gnu' }}
        run: |
          set -euo pipefail
          # --break-system-packages: Gitea's runner image is Debian 12, whose
          # system Python enforces PEP 668 (externally-managed-environment) and
          # rejects a plain `pip install --user`. The flag makes the install
          # proceed in the ephemeral CI container; on GitHub's ubuntu-latest
          # (not externally-managed) it is an accepted no-op, so this runs on
          # both forges.
          python3 -m pip install --user --break-system-packages cargo-zigbuild ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Provision macOS SDK (darwin framework linking)
        # The apple-darwin legs cross-compile on Linux via zig, but the dep tree
        # links Apple frameworks (Security + CoreFoundation, pulled by
        # rustls-platform-verifier via reqwest 0.13) that zig cannot satisfy
        # without a real macOS SDK. Fetch one and point cargo-zigbuild at it via
        # SDKROOT so `-framework Security/CoreFoundation` resolves — no macOS
        # runner required. Pinned SDK version; bump deliberately.
        if: ${{ endsWith(matrix.target, '-apple-darwin') }}
        env:
          MACOS_SDK_VERSION: "14.5"
        run: |
          set -euo pipefail
          url="https://github.com/joseluisq/macosx-sdks/releases/download/${MACOS_SDK_VERSION}/MacOSX${MACOS_SDK_VERSION}.sdk.tar.xz"
          dest="$HOME/macos-sdk"
          mkdir -p "$dest"
          echo "→ fetching macOS SDK ${MACOS_SDK_VERSION}"
          curl -fsSL --retry 5 --retry-connrefused "$url" | tar -xJ -C "$dest"
          sdkroot="$dest/MacOSX${MACOS_SDK_VERSION}.sdk"
          test -d "$sdkroot/System/Library/Frameworks/Security.framework" \
            || { echo "::error::macOS SDK missing Security.framework at $sdkroot"; exit 1; }
          echo "SDKROOT=$sdkroot" >> "$GITHUB_ENV"
          echo "provisioned $sdkroot"

      - name: Add rust target
        # Install std for the matrix triple on EVERY leg. The host
        # x86_64-unknown-linux-gnu is a no-op add; every cross triple (linux
        # musl/aarch64 and both apple-darwin) needs its std for the zig
        # cross-compile. Keeping it unconditional also pins the artifact to the
        # single matrix-derived output path (target/<triple>/release) the
        # staging step reads.
        run: rustup target add "${{ matrix.target }}"

      - name: Build release binaries
        env:
          # musl: build FULLY STATIC (crt-static is already the musl default in
          # rustc; we assert it explicitly). A static musl binary carries its own
          # libc and so runs on BOTH musl (Alpine) and glibc hosts — that is the
          # whole reason we ship musl at all, and it lets orca's linux asset
          # resolver prefer the musl-static asset with a gnu fallback (see orca
          # core release_targets::linux_asset_preference). Now that plugins are
          # spawned as subprocesses (not dlopened into the daemon), the old
          # "disable crt-static so the daemon can dlopen it" rule no longer
          # applies — a static executable spawns fine.
          RUSTFLAGS: ${{ contains(matrix.target, '-musl') && '-C target-feature=+crt-static' || '' }}
        run: |
          set -euo pipefail
          # Build method derived from the target triple (no matrix field):
          #   plain cargo build → ONLY the host x86_64-unknown-linux-gnu leg.
          #   cargo zigbuild    → every other triple: linux musl/aarch64 AND both
          #                       apple-darwin (zig cross-compiles darwin from
          #                       Linux, so no macOS runner is required).
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) builder="cargo build" ;;
            *)                        builder="cargo zigbuild" ;;
          esac
          # Build every requested bin (`--bin` per name keeps it explicit and lets
          # multi-bin workspaces like `arr` build one plugin per *arr app).
          bin_flags=""
          while IFS= read -r b; do
            [ -n "$b" ] && bin_flags="$bin_flags --bin $b"
          done <<< '${{ steps.bins.outputs.list }}'
          # `--target` is LOAD-BEARING for the output path. With it, cargo (and
          # cargo-zigbuild) always emit to `target/<triple>/release/<bin>` — even
          # when <triple> equals the host — which is exactly where the staging
          # step below reads. Drop it and a host build lands in `target/release/`
          # instead and staging fails with "binary not found". We ALSO export
          # CARGO_BUILD_TARGET as belt-and-suspenders so a stray host-default
          # can't redirect the output dir; the
          # explicit flag and the env agree, so every leg resolves to the same
          # target/<triple>/release path.
          export CARGO_BUILD_TARGET="${{ matrix.target }}"
          echo "→ $builder --release --target ${{ matrix.target }}$bin_flags"
          # shellcheck disable=SC2086
          $builder --release --target "${{ matrix.target }}" $bin_flags

      - name: Stage artifacts (+ thinness report)
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          budget="${{ inputs.size_budget_mib }}"
          while IFS= read -r bin; do
            [ -z "$bin" ] && continue
            path="target/${{ matrix.target }}/release/${bin}"
            if [ ! -f "$path" ]; then
              echo "::error::binary not found at $path"
              echo "── expected (target-triple) dir ──"
              ls -la "target/${{ matrix.target }}/release" || echo "  (missing)"
              # If a build ever dropped --target the artifact would land here.
              # Surface it so the failure names the exact mismatch instead of
              # leaving the next re-cut to guess.
              echo "── host (no-triple) dir — should NOT contain the bin ──"
              ls -la "target/release" || echo "  (missing)"
              exit 1
            fi
            asset="${bin}-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
            cp "$path" "dist/$asset"
            # shasum -a 256 is present on both ubuntu and macOS runners with
            # identical `<hash>  <file>` output; sha256sum is GNU-only (absent
            # on macOS) and broke the darwin legs.
            ( cd dist && shasum -a 256 "$asset" > "${asset}.sha256" )

            # ── Thinness gate (soft) ──────────────────────────────────────────
            # A plugin should be logic + generated types + serde, delegating heavy
            # capabilities to orca — not bundling the runtime. Report every release
            # and warn (don't fail) over budget so bloat stays visible per build.
            # wc -c is POSIX/portable; `stat -c%s` is GNU-only (macOS uses -f%z).
            bytes=$(wc -c < "dist/$asset" | tr -d '[:space:]')
            mib=$(( bytes / 1048576 ))
            echo "### 📦 ${asset}: ${mib} MiB (${bytes} bytes)" >> "$GITHUB_STEP_SUMMARY"
            echo "plugin binary ${asset} = ${mib} MiB"
            if [ "$mib" -gt "$budget" ]; then
              echo "::warning title=Plugin over size budget::${asset} is ${mib} MiB (budget ${budget} MiB). Delegate more to orca / shed bundled deps to slim it."
            fi
          done <<< '${{ steps.bins.outputs.list }}'

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: dist/*
          retention-days: 3

  # ── Gather every target's artifacts and publish one (pre)release. ──
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    # ── Approval gate = the manual `workflow_dispatch` trigger. ──
    # This release workflow is only ever reached via a caller's
    # `workflow_dispatch` (an operator deliberately picking channel=rc or
    # channel=stable and clicking Run). That deliberate human trigger IS the
    # approval gate for the RC and for the stable cut.
    #
    # We do NOT use a GitHub `environment:` protection rule here. Gitea (act) —
    # our canonical CI, see [[gitea-canonical-github-mirror-only]] — has no
    # environments/deployment-protection feature at all (the environments API
    # 404s on Gitea 1.27). A job carrying `environment:` on Gitea never becomes
    # runnable, so the whole build would go green while this `release` job is
    # silently skipped and NOTHING publishes — exactly the failure that produced
    # a successful run with no tag and no release. Removing it makes the publish
    # actually run; the workflow_dispatch trigger is the portable gate that works
    # identically on Gitea and GitHub.
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.channel }}-${{ inputs.bump }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: plugin-*
          merge-multiple: true

      - name: Create Gitea Release (pipeline-tagged)
        # Publish to GITEA — the canonical forge ([[gitea-canonical-github-mirror-only]])
        # — via the Gitea REST API using curl + jq, NOT the `gh` CLI (absent on
        # the Gitea runner image; both curl and jq are present). GitHub is now an
        # OUTBOUND-ONLY mirror: nothing here writes to api.github.com. The mirror
        # replicates tags/releases outward separately.
        #
        # Endpoints resolve from the Actions context so this is forge-portable:
        #   github.api_url    → Gitea's API base (https://gitea.scottkey.me/api/v1)
        #   github.server_url → https://gitea.scottkey.me
        # Auth uses the auto per-repo token act_runner injects (github.token),
        # minted with the `contents: write` this job declares — enough to create
        # a release and upload assets on THIS repo. ORCA_RELEASE_TOKEN overrides
        # it if an org-wide release identity is preferred.
        #
        # Gitea asset upload differs from GitHub: it takes a multipart form field
        # `attachment` (not a raw octet-stream body to a separate uploads host).
        env:
          GITEA_TOKEN: ${{ secrets.ORCA_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${{ needs.version.outputs.tag }}"
          api="${{ github.api_url }}"
          server="${{ github.server_url }}"
          hdr_auth="Authorization: token ${GITEA_TOKEN}"
          accept="Accept: application/json"
          notes="${{ inputs.notes }}"
          [ -z "$notes" ] && notes="Automated ${{ inputs.channel }} release of \`${repo}\`, built against orca \`main\`. Plugin binary + sha256 per host target."
          ls -la dist

          # Create the release. Idempotent: if the tag already has a release
          # (e.g. a re-run of the same stable cut) reuse it instead of failing.
          payload=$(jq -n \
            --arg tag "$tag" \
            --arg sha "${{ github.sha }}" \
            --arg name "$tag" \
            --arg body "$notes" \
            --argjson pre ${{ needs.version.outputs.prerelease }} \
            '{tag_name:$tag, target_commitish:$sha, name:$name, body:$body, prerelease:$pre, draft:false}')
          resp=$(curl -fsSL -X POST -H "$hdr_auth" -H "$accept" -H "Content-Type: application/json" \
            "$api/repos/$repo/releases" -d "$payload" 2>/dev/null || true)
          rid=$(printf '%s' "$resp" | jq -r '.id // empty')
          if [ -z "$rid" ]; then
            echo "→ create did not return an id; looking up existing release for $tag"
            rid=$(curl -fsSL -H "$hdr_auth" -H "$accept" \
              "$api/repos/$repo/releases/tags/$tag" | jq -r '.id // empty')
          fi
          if [ -z "$rid" ]; then
            echo "::error::could not create or find release $tag"
            echo "$resp"
            exit 1
          fi
          echo "release id: $rid"

          # Upload every staged asset (binary + .sha256) to the release. Gitea's
          # asset endpoint takes a multipart `attachment` field; name= sets the
          # stored filename.
          for f in dist/*; do
            name=$(basename "$f")
            echo "→ uploading $name"
            code=$(curl -sS -X POST -H "$hdr_auth" \
              -F "attachment=@${f};filename=${name}" \
              -o /tmp/upload_resp.json -w '%{http_code}' \
              "$api/repos/$repo/releases/$rid/assets?name=$name")
            if [ "$code" -ge 300 ]; then
              echo "::error::asset upload failed for $name (HTTP $code)"
              cat /tmp/upload_resp.json || true
              exit 1
            fi
          done
          set -- dist/*
          echo "published $tag with $# files → ${server}/$repo/releases/tag/$tag"

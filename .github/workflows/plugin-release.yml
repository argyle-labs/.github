name: Release

# Release for orca subprocess plugins. Artifact = target/<triple>/
# release/<bin> + .sha256 + .minisig. Reached only via a caller workflow_dispatch
# (channel=rc, then stable) — that operator trigger is the approval gate;
# building happens here, post-approval (plugin-ci.yml is test+lint only).
#
# COMPOSABLE TARGETS: one build-<triple> job per requested target, guarded by
# `if: contains(fromJSON(inputs.targets), '<triple>')`. A skipped job is never
# dispatched to a runner, so publishing a subset limits runner usage.
# NATIVE ROUTING: inputs.runs_on maps a triple → runner label; the shared
# plugin-build action auto-detects native (cargo build) vs cross (cargo
# zigbuild). Default routes aarch64-apple-darwin to the macos runner.
# Linux legs run in the prebaked ci-rust container (toolchain, zig,
# cargo-zigbuild, sccache); darwin legs run on the host.
#
# Caller MUST set `permissions: contents: write` (secrets: inherit does not
# carry permissions); the release job creates the release.

on:
  workflow_call:
    inputs:
      channel:
        description: "Release channel: rc (prerelease) or stable"
        required: true
        type: string
      bump:
        description: "Version bump from latest stable tag: patch | minor | major"
        required: true
        type: string
      targets:
        description: >-
          JSON array of target triples to build+publish (unrequested = skipped,
          no runner). aarch64 Linux is opt-in via targets; Linux hosts fetch
          musl first, then gnu.
        required: false
        type: string
        default: >-
          ["x86_64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-apple-darwin"]
      runs_on:
        description: >-
          JSON map triple → runs-on label. Unlisted → ubuntu-latest (zig-cross).
          Linux triples build inside the x86_64 ci-rust container, so route
          them only to x86_64 Linux runners.
        required: false
        type: string
        default: >-
          {"x86_64-unknown-linux-gnu":"ubuntu-latest","aarch64-unknown-linux-gnu":"ubuntu-latest","x86_64-unknown-linux-musl":"ubuntu-latest","aarch64-unknown-linux-musl":"ubuntu-latest","aarch64-apple-darwin":"macos","x86_64-apple-darwin":"ubuntu-latest"}
      bins:
        description: JSON array of bin names. Empty ([]) = derive from cargo metadata.
        required: false
        type: string
        default: "[]"
      notes:
        description: "Extra release notes (optional)"
        required: false
        type: string
        default: ""
      size_budget_mib:
        description: "Thinness budget (MiB). Over this, the build fails."
        required: false
        type: number
        default: 20
      image_name:
        description: >-
          Container image to promote, e.g. argyle-labs/<repo>. Empty = no image.
          The Image workflow must push :tree-<sha> for the release commit.
        required: false
        type: string
        default: ""
      image_public:
        description: >-
          Mirror the release tags (version + latest/rc, never tree-*) to
          ghcr.io/<image_name> after promote. Ignored when image_name is empty.
        required: false
        type: boolean
        default: true
      image_wait_minutes:
        description: "Minutes to wait for :tree-<sha> of the release commit before failing."
        required: false
        type: number
        default: 15

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Version
        id: v
        uses: argyle-labs/.github/.github/actions/job-plugin-release-version@main
        with:
          channel: ${{ inputs.channel }}
          bump: ${{ inputs.bump }}

  ui-build:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    outputs:
      has_ui: ${{ steps.ui.outputs.has-ui }}
    steps:
      - name: UI build
        id: ui
        uses: argyle-labs/.github/.github/actions/job-plugin-release-ui-build@main

  build-x86_64-linux-gnu:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'x86_64-unknown-linux-gnu')
    runs-on: ${{ fromJSON(inputs.runs_on)['x86_64-unknown-linux-gnu'] || 'ubuntu-latest' }}
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    outputs:
      orca-source: ${{ steps.build.outputs.orca-source }}
    steps:
      - name: Build x86_64-unknown-linux-gnu
        id: build
        uses: argyle-labs/.github/.github/actions/job-plugin-release-build@main
        with:
          target: x86_64-unknown-linux-gnu
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          has-ui: ${{ needs.ui-build.outputs.has_ui }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}

  build-aarch64-linux-gnu:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'aarch64-unknown-linux-gnu')
    runs-on: ${{ fromJSON(inputs.runs_on)['aarch64-unknown-linux-gnu'] || 'ubuntu-latest' }}
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    outputs:
      orca-source: ${{ steps.build.outputs.orca-source }}
    steps:
      - name: Build aarch64-unknown-linux-gnu
        id: build
        uses: argyle-labs/.github/.github/actions/job-plugin-release-build@main
        with:
          target: aarch64-unknown-linux-gnu
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          has-ui: ${{ needs.ui-build.outputs.has_ui }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}

  build-x86_64-linux-musl:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'x86_64-unknown-linux-musl')
    runs-on: ${{ fromJSON(inputs.runs_on)['x86_64-unknown-linux-musl'] || 'ubuntu-latest' }}
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    outputs:
      orca-source: ${{ steps.build.outputs.orca-source }}
    steps:
      - name: Build x86_64-unknown-linux-musl
        id: build
        uses: argyle-labs/.github/.github/actions/job-plugin-release-build@main
        with:
          target: x86_64-unknown-linux-musl
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          has-ui: ${{ needs.ui-build.outputs.has_ui }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}

  build-aarch64-linux-musl:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'aarch64-unknown-linux-musl')
    runs-on: ${{ fromJSON(inputs.runs_on)['aarch64-unknown-linux-musl'] || 'ubuntu-latest' }}
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    outputs:
      orca-source: ${{ steps.build.outputs.orca-source }}
    steps:
      - name: Build aarch64-unknown-linux-musl
        id: build
        uses: argyle-labs/.github/.github/actions/job-plugin-release-build@main
        with:
          target: aarch64-unknown-linux-musl
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          has-ui: ${{ needs.ui-build.outputs.has_ui }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}

  build-aarch64-darwin:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'aarch64-apple-darwin')
    runs-on: ${{ fromJSON(inputs.runs_on)['aarch64-apple-darwin'] || 'ubuntu-latest' }}
    outputs:
      orca-source: ${{ steps.build.outputs.orca-source }}
    steps:
      - name: Build aarch64-apple-darwin
        id: build
        uses: argyle-labs/.github/.github/actions/job-plugin-release-build@main
        with:
          target: aarch64-apple-darwin
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          has-ui: ${{ needs.ui-build.outputs.has_ui }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}

  build-x86_64-darwin:
    needs: [version, ui-build]
    if: contains(fromJSON(inputs.targets), 'x86_64-apple-darwin')
    runs-on: ${{ fromJSON(inputs.runs_on)['x86_64-apple-darwin'] || 'ubuntu-latest' }}
    outputs:
      orca-source: ${{ steps.build.outputs.orca-source }}
    steps:
      - name: Build x86_64-apple-darwin
        id: build
        uses: argyle-labs/.github/.github/actions/job-plugin-release-build@main
        with:
          target: x86_64-apple-darwin
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          has-ui: ${{ needs.ui-build.outputs.has_ui }}
          bins: ${{ inputs.bins }}
          size-budget-mib: ${{ inputs.size_budget_mib }}
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}

  release:
    needs:
      - version
      - ui-build
      - build-x86_64-linux-gnu
      - build-aarch64-linux-gnu
      - build-x86_64-linux-musl
      - build-aarch64-linux-musl
      - build-aarch64-darwin
      - build-x86_64-darwin
    if: ${{ always() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.channel }}-${{ inputs.bump }}
      cancel-in-progress: false
    steps:
      - name: Publish
        uses: argyle-labs/.github/.github/actions/job-plugin-release-publish@main
        with:
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          channel: ${{ inputs.channel }}
          targets: ${{ inputs.targets }}
          notes: ${{ inputs.notes }}
          orca-source: >-
            ${{ needs.build-x86_64-linux-musl.outputs.orca-source
            || needs.build-x86_64-linux-gnu.outputs.orca-source
            || needs.build-aarch64-darwin.outputs.orca-source
            || needs.build-aarch64-linux-musl.outputs.orca-source
            || needs.build-aarch64-linux-gnu.outputs.orca-source
            || needs.build-x86_64-darwin.outputs.orca-source }}
          build-results: |
            ui-build:${{ needs.ui-build.result }}
            gnu-x86:${{ needs.build-x86_64-linux-gnu.result }}
            gnu-arm:${{ needs.build-aarch64-linux-gnu.result }}
            musl-x86:${{ needs.build-x86_64-linux-musl.result }}
            musl-arm:${{ needs.build-aarch64-linux-musl.result }}
            darwin-arm:${{ needs.build-aarch64-darwin.result }}
            darwin-x86:${{ needs.build-x86_64-darwin.result }}
          create: "true"
          signing-key: ${{ secrets.PLUGIN_SIGNING_KEY }}
          release-token: ${{ secrets.ORCA_RELEASE_TOKEN }}
          image-name: ${{ inputs.image_name }}
          image-public: ${{ inputs.image_public && 'true' || 'false' }}
          image-wait-minutes: ${{ inputs.image_wait_minutes }}
          registry: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}
          registry-http: ${{ vars.CI_REGISTRY_HTTP || 'false' }}
          registry-user: ${{ secrets.CI_REGISTRY_USER }}
          registry-token: ${{ secrets.CI_REGISTRY_TOKEN }}
          github-token: ${{ secrets.GH_TOKEN }}

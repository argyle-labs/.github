name: CI job — rust build
description: >
  The whole `build` job: every test binary compiled once, coverage-instrumented,
  into the `nextest-archive` artifact that job-rust-test runs, then the
  doctests against that same compiled tree. Skipped when this source hash
  already passed both `build` and `test`. Run in the `ci-rust`
  container; checks out the repo itself.

inputs:
  image-tag:
    description: 'ci-rust image tag the job runs in; hashed into the source hash.'
    required: false
    default: "1.95.0"
  workflow-file:
    description: 'Calling workflow file (repo-root relative); hashed into the source hash.'
    required: false
    default: .github/workflows/ci.yml
  ui:
    description: 'The crate embeds ui/dist: hash `ui/` and place the `vite-dist` artifact before compiling (the job `needs:` build-ui).'
    required: false
    default: "false"
  packages:
    description: 'Cargo package selection, split on whitespace; `--all-features` is appended.'
    required: false
    default: "--workspace"
  build-jobs:
    description: 'CARGO_BUILD_JOBS. Empty keeps cargo''s default parallelism.'
    required: false
    default: ""
  debuginfo:
    description: 'CARGO_PROFILE_{DEV,TEST}_DEBUG. Empty keeps the profile default.'
    required: false
    default: "0"
  test-partitions:
    description: 'Shard count n of the test job''s `partition` matrix; the skip then needs every `test-<k>-of-<n>` marker. Empty or 1 needs the single `test` marker.'
    required: false
    default: ""
  doctests:
    description: 'Run `cargo test --doc` after the archive build, reusing its compiled crates.'
    required: false
    default: "true"
  size-check:
    description: 'Run plugin-size-check: release-profile bin size vs the latest release asset, dependency count vs the PR base; one PR comment.'
    required: false
    default: "true"
  sccache-endpoint:
    description: 'S3 cache host:port for sccache and the pass cache (pass `vars.SCCACHE_ENDPOINT`).'
    required: false
    default: ""
  sccache-access-key:
    description: 'S3 cache access key (pass `secrets.SCCACHE_S3_ACCESS_KEY`); composites cannot read secrets.'
    required: false
    default: ""
  sccache-secret-key:
    description: 'S3 cache secret key (pass `secrets.SCCACHE_S3_SECRET_KEY`).'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Source hash
      id: src
      uses: argyle-labs/.github/.github/actions/source-hash@main
      with:
        actions: job-rust-build job-rust-test
        image: ci-rust:${{ inputs.image-tag }}
        workflow-file: ${{ inputs.workflow-file }}
        extra-paths: ${{ inputs.ui == 'true' && 'ui' || '' }}
    - name: Test pass markers
      id: shards
      shell: bash
      env:
        N: ${{ inputs.test-partitions }}
      run: |
        if [ -z "$N" ] || [ "$N" = 1 ]; then
          echo "jobs=test" >> "$GITHUB_OUTPUT"
        elif [[ "$N" =~ ^[1-9][0-9]*$ ]]; then
          echo "jobs=$(for k in $(seq 1 "$N"); do printf 'test-%s-of-%s ' "$k" "$N"; done)" >> "$GITHUB_OUTPUT"
        else
          echo "::error title=test-partitions::'$N' is not a positive integer"
          exit 1
        fi
    - name: Check pass cache
      id: pass
      uses: argyle-labs/.github/.github/actions/ci-pass-cache@main
      with:
        mode: check
        job: build
        also-require: ${{ steps.shards.outputs.jobs }}
        hash: ${{ steps.src.outputs.hash }}
        force: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
        endpoint: ${{ inputs.sccache-endpoint }}
        access-key: ${{ inputs.sccache-access-key }}
        secret-key: ${{ inputs.sccache-secret-key }}
    - name: Reuse unchanged pass
      if: ${{ steps.pass.outputs.hit == 'true' }}
      shell: bash
      env:
        PASS_SHA: ${{ steps.pass.outputs.sha }}
      run: echo "Unchanged source — reusing pass from ${PASS_SHA:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Set up Rust (toolchain, sccache)
      if: ${{ steps.pass.outputs.hit != 'true' }}
      uses: argyle-labs/.github/.github/actions/rust-setup@main
      with:
        wrap-cc: 'true'
        build-jobs: ${{ inputs.build-jobs }}
        debuginfo: ${{ inputs.debuginfo }}
        sccache-endpoint: ${{ inputs.sccache-endpoint }}
        sccache-access-key: ${{ inputs.sccache-access-key }}
        sccache-secret-key: ${{ inputs.sccache-secret-key }}
        # CI-only: link the image's system OpenSSL instead of compiling
        # openssl-src; release builds keep vendoring it.
        env: |
          CARGO_TERM_COLOR=always
          CARGO_NET_GIT_FETCH_WITH_CLI=true
          OPENSSL_NO_VENDOR=1
    - name: Build test archive (cargo llvm-cov nextest-archive)
      if: ${{ steps.pass.outputs.hit != 'true' }}
      uses: argyle-labs/.github/.github/actions/cargo-build@main
      with:
        artifacts: ${{ inputs.ui == 'true' && 'vite-dist:ui/dist' || '' }}
        args: ${{ inputs.packages }} --all-features
    - name: Release profile for size check
      if: ${{ steps.pass.outputs.hit != 'true' && inputs.size-check == 'true' }}
      uses: argyle-labs/.github/.github/actions/rust-release-profile@main
      with:
        strip: symbols
        lto: "true"
        codegen-units: "1"
        opt-level: z
    - name: Build release bins for size check
      id: size-bins
      if: ${{ steps.pass.outputs.hit != 'true' && inputs.size-check == 'true' }}
      shell: bash
      env:
        OPENSSL_NO_VENDOR: "0"
      run: |
        set -euo pipefail
        bins=$(cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name' | sort -u)
        if [ -z "$bins" ]; then
          echo "no bin targets; size check counts dependencies only"
          exit 0
        fi
        target=$(rustc -vV | sed -n 's/^host: //p')
        args=()
        while IFS= read -r b; do args+=(--bin "$b"); done <<< "$bins"
        cargo build --release --locked "${args[@]}"
        dist="${RUNNER_TEMP:-/tmp}/size-dist"
        rm -rf "$dist" && mkdir -p "$dist"
        while IFS= read -r b; do cp "target/release/$b" "$dist/${b}-pr-${target}"; done <<< "$bins"
        {
          echo "dist=$dist"
          echo "target=$target"
          echo "bins<<EOF_BINS"
          echo "$bins"
          echo "EOF_BINS"
        } >> "$GITHUB_OUTPUT"
    # nextest cannot run doctests. With cargo-llvm-cov's environment and target
    # dir, cargo finds the archive build's crates fresh and only rustdoc compiles.
    - name: Doctests (cargo test --doc)
      if: ${{ steps.pass.outputs.hit != 'true' && inputs.doctests == 'true' }}
      shell: bash
      env:
        ARGS: ${{ inputs.packages }} --all-features
      run: |
        export t0=$SECONDS; trap 'echo "doctest|$((SECONDS - t0))|$?" >> /tmp/ci-phases' EXIT
        read -ra args <<< "$ARGS"
        has=$(/bin/bash "$GITHUB_ACTION_PATH/../cargo-test/has-doctests.sh" "${args[@]}")
        if [ "$has" != true ]; then
          echo "::notice::No doc-comment code blocks in the selected library targets; skipping doctests" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        target=$(cargo metadata --locked --format-version 1 --no-deps | jq -r .target_directory)
        cov_env=$(cargo llvm-cov show-env --export-prefix)
        eval "$cov_env"
        export CARGO_TARGET_DIR="$target/llvm-cov-target"
        export LLVM_PROFILE_FILE="${RUNNER_TEMP:-/tmp}/doctest-%p-%m.profraw"
        cargo test --locked "${args[@]}" --doc
    - name: Plugin size check
      if: ${{ steps.pass.outputs.hit != 'true' && inputs.size-check == 'true' }}
      uses: argyle-labs/.github/.github/actions/plugin-size-check@main
      with:
        base-ref: ${{ github.event.pull_request.base.sha }}
        pr-number: ${{ github.event.pull_request.number }}
        dist-dir: ${{ steps.size-bins.outputs.dist }}
        bins: ${{ steps.size-bins.outputs.bins }}
        target: ${{ steps.size-bins.outputs.target }}
    - name: Record pass
      if: ${{ success() && steps.pass.outputs.hit != 'true' }}
      uses: argyle-labs/.github/.github/actions/ci-pass-cache@main
      with:
        mode: record
        job: build
        hash: ${{ steps.src.outputs.hash }}
        endpoint: ${{ inputs.sccache-endpoint }}
        access-key: ${{ inputs.sccache-access-key }}
        secret-key: ${{ inputs.sccache-secret-key }}
    - name: CI summary
      if: ${{ !cancelled() }}
      uses: argyle-labs/.github/.github/actions/ci-summary@main

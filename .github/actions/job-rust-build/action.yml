name: CI job — rust build
description: >
  The whole `build` job: the test binaries of every crate without a `build` and
  `test` pass for its crate hash (crate-select: changed crates plus their
  reverse dependents) compiled once, coverage-instrumented, into the
  `nextest-archive` artifact that job-rust-test runs, plus the `crate-selection`
  artifact naming those crates and the `crate-hashes` artifact the test job selects against; then those crates' doctests against the same
  compiled tree. Skipped when no crate is selected. Run in the `ci-rust`
  container; checks out the repo itself.

inputs:
  image-tag:
    description: 'ci-rust image tag the job runs in; hashed into the source hash.'
    required: false
    default: "1.95.0"
  workflow-file:
    description: 'Calling workflow file (repo-root relative); hashed into the source hash.'
    required: false
    default: .github/workflows/ci.yml
  ui:
    description: 'The crate embeds ui/dist: hash `ui/` and place the `vite-dist` artifact before compiling (the job `needs:` build-ui).'
    required: false
    default: "false"
  extra-paths:
    description: 'crate-hashes `extra-paths`: lines of `crate: path [path...]` hashed as that crate''s own files, `*` for every crate.'
    required: false
    default: ""
  features:
    description: 'Cargo feature arguments appended to the package selection.'
    required: false
    default: "--all-features"
  force:
    description: '`true` builds every crate regardless of recorded passes (also set by a `force` workflow_dispatch input).'
    required: false
    default: "false"
  drop-cargo-config:
    description: 'rust-setup `drop-cargo-config`.'
    required: false
    default: "true"
  version-env:
    description: 'Variable set to `<root Cargo.toml version>-dev+gci` before building, for build scripts that otherwise derive a version from git (a fixed value keeps them cached). Empty sets nothing.'
    required: false
    default: ""
  build-jobs:
    description: 'CARGO_BUILD_JOBS. Empty keeps cargo''s default parallelism.'
    required: false
    default: ""
  debuginfo:
    description: 'CARGO_PROFILE_{DEV,TEST}_DEBUG. Empty keeps the profile default.'
    required: false
    default: "0"
  test-partitions:
    description: 'Shard count n of the test job''s `partition` matrix; the skip then needs every `test-<k>-of-<n>` marker. Empty or 1 needs the single `test` marker.'
    required: false
    default: ""
  doctests:
    description: 'Run `cargo test --doc` after the archive build, reusing its compiled crates.'
    required: false
    default: "true"
  size-check:
    description: 'Run plugin-size-check: release-profile bin size vs the latest release asset, dependency count vs the PR base; one PR comment.'
    required: false
    default: "true"
  sccache-endpoint:
    description: 'S3 cache host:port for sccache and the pass cache (pass `vars.SCCACHE_ENDPOINT`).'
    required: false
    default: ""
  sccache-access-key:
    description: 'S3 cache access key (pass `secrets.SCCACHE_S3_ACCESS_KEY`); composites cannot read secrets.'
    required: false
    default: ""
  sccache-secret-key:
    description: 'S3 cache secret key (pass `secrets.SCCACHE_S3_SECRET_KEY`).'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Use latest released orca-plugin-toolkit
      id: toolkit
      uses: argyle-labs/.github/.github/actions/plugin-toolkit-latest@main
    - name: Test pass markers
      id: shards
      shell: bash
      env:
        N: ${{ inputs.test-partitions }}
      run: |
        if [ -z "$N" ] || [ "$N" = 1 ]; then
          echo "jobs=test" >> "$GITHUB_OUTPUT"
        elif [[ "$N" =~ ^[1-9][0-9]*$ ]]; then
          echo "jobs=$(for k in $(seq 1 "$N"); do printf 'test-%s-of-%s ' "$k" "$N"; done)" >> "$GITHUB_OUTPUT"
        else
          echo "::error title=test-partitions::'$N' is not a positive integer"
          exit 1
        fi
    - name: Select crates
      id: sel
      uses: argyle-labs/.github/.github/actions/crate-select@main
      with:
        job: build
        also-require: ${{ steps.shards.outputs.jobs }}
        image: ci-rust:${{ inputs.image-tag }}${{ steps.toolkit.outputs.version && format(' orca-plugin-toolkit={0}', steps.toolkit.outputs.version) || '' }}
        workflow-file: ${{ inputs.workflow-file }}
        extra-paths: |
          ${{ inputs.extra-paths }}
          ${{ inputs.ui == 'true' && '*: ui' || '' }}
        force: ${{ (inputs.force == 'true' || github.event.inputs.force == 'true') && 'true' || 'false' }}
        endpoint: ${{ inputs.sccache-endpoint }}
        access-key: ${{ inputs.sccache-access-key }}
        secret-key: ${{ inputs.sccache-secret-key }}
    - name: Write crate hashes
      shell: bash
      env:
        HASHES: ${{ steps.sel.outputs.hashes }}
      run: printf '%s\n' "$HASHES" > crate-hashes.json
    - name: Upload crate hashes artifact
      uses: actions/upload-artifact@v4
      with:
        name: crate-hashes
        path: crate-hashes.json
        retention-days: 1
    - name: Reuse recorded passes
      if: ${{ steps.sel.outputs.selection == '' }}
      shell: bash
      run: echo "Unchanged — reusing build + test pass for every crate" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Set up Rust (toolchain, sccache)
      if: ${{ steps.sel.outputs.selection != '' }}
      uses: argyle-labs/.github/.github/actions/rust-setup@main
      with:
        drop-cargo-config: ${{ inputs.drop-cargo-config }}
        fast-linker: 'true'
        wrap-cc: 'true'
        build-jobs: ${{ inputs.build-jobs }}
        debuginfo: ${{ inputs.debuginfo }}
        sccache-endpoint: ${{ inputs.sccache-endpoint }}
        sccache-access-key: ${{ inputs.sccache-access-key }}
        sccache-secret-key: ${{ inputs.sccache-secret-key }}
        # CI-only: link the image's system OpenSSL instead of compiling
        # openssl-src; release builds keep vendoring it.
        env: |
          CARGO_TERM_COLOR=always
          CARGO_NET_GIT_FETCH_WITH_CLI=true
          OPENSSL_NO_VENDOR=1
    - name: Pin workspace version
      if: ${{ steps.sel.outputs.selection != '' && inputs.version-env != '' }}
      shell: bash
      env:
        VAR: ${{ inputs.version-env }}
      run: |
        set -euo pipefail
        v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
        [ -n "$v" ]
        echo "$VAR=${v}-dev+gci" >> "$GITHUB_ENV"
    - name: Build test archive (cargo llvm-cov nextest-archive)
      if: ${{ steps.sel.outputs.selection != '' }}
      uses: argyle-labs/.github/.github/actions/cargo-build@main
      with:
        artifacts: ${{ inputs.ui == 'true' && 'vite-dist:ui/dist' || '' }}
        args: ${{ steps.sel.outputs.packages }} ${{ inputs.features }}
    - name: Write crate selection
      if: ${{ steps.sel.outputs.selection != '' }}
      shell: bash
      env:
        MISSING: ${{ steps.sel.outputs.missing }}
      run: printf '%s\n' "$MISSING" > crate-selection.json
    - name: Upload crate selection artifact
      if: ${{ steps.sel.outputs.selection != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: crate-selection
        path: crate-selection.json
        retention-days: 1
    - name: Release profile for size check
      if: ${{ steps.sel.outputs.selection != '' && inputs.size-check == 'true' }}
      uses: argyle-labs/.github/.github/actions/rust-release-profile@main
      with:
        strip: symbols
        lto: "true"
        codegen-units: "1"
        opt-level: z
    - name: Build release bins for size check
      id: size-bins
      if: ${{ steps.sel.outputs.selection != '' && inputs.size-check == 'true' }}
      shell: bash
      env:
        OPENSSL_NO_VENDOR: "0"
      run: |
        set -euo pipefail
        bins=$(cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name' | sort -u)
        if [ -z "$bins" ]; then
          echo "no bin targets; size check counts dependencies only"
          exit 0
        fi
        target=$(rustc -vV | sed -n 's/^host: //p')
        args=()
        while IFS= read -r b; do args+=(--bin "$b"); done <<< "$bins"
        cargo build --release --locked ${args[@]+"${args[@]}"}
        dist="${RUNNER_TEMP:-/tmp}/size-dist"
        rm -rf "$dist" && mkdir -p "$dist"
        while IFS= read -r b; do cp "target/release/$b" "$dist/${b}-pr-${target}"; done <<< "$bins"
        {
          echo "dist=$dist"
          echo "target=$target"
          echo "bins<<EOF_BINS"
          echo "$bins"
          echo "EOF_BINS"
        } >> "$GITHUB_OUTPUT"
    # nextest cannot run doctests. With cargo-llvm-cov's environment and target
    # dir, cargo finds the archive build's crates fresh and only rustdoc compiles.
    - name: Doctests (cargo test --doc)
      if: ${{ steps.sel.outputs.selection != '' && inputs.doctests == 'true' }}
      shell: bash
      env:
        ARGS: ${{ steps.sel.outputs.packages }} ${{ inputs.features }}
      run: |
        export t0=$SECONDS; trap 'echo "doctest|$((SECONDS - t0))|$?" >> /tmp/ci-phases' EXIT
        read -ra args <<< "$ARGS"
        has=$(/bin/bash "$GITHUB_ACTION_PATH/../cargo-test/has-doctests.sh" ${args[@]+"${args[@]}"})
        if [ "$has" != true ]; then
          echo "::notice::No doc-comment code blocks in the selected library targets; skipping doctests" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        target=$(cargo metadata --locked --format-version 1 --no-deps | jq -r .target_directory)
        cov_env=$(cargo llvm-cov show-env --export-prefix)
        eval "$cov_env"
        export CARGO_TARGET_DIR="$target/llvm-cov-target"
        export LLVM_PROFILE_FILE="${RUNNER_TEMP:-/tmp}/doctest-%p-%m.profraw"
        cargo test --locked ${args[@]+"${args[@]}"} --doc
    - name: Plugin size check
      if: ${{ steps.sel.outputs.selection != '' && inputs.size-check == 'true' }}
      uses: argyle-labs/.github/.github/actions/plugin-size-check@main
      with:
        base-ref: ${{ github.event.pull_request.base.sha }}
        pr-number: ${{ github.event.pull_request.number }}
        dist-dir: ${{ steps.size-bins.outputs.dist }}
        bins: ${{ steps.size-bins.outputs.bins }}
        target: ${{ steps.size-bins.outputs.target }}
    - name: Record pass
      if: ${{ success() && steps.sel.outputs.selection != '' }}
      uses: argyle-labs/.github/.github/actions/ci-pass-cache@main
      with:
        mode: record-batch
        job: build
        hashes: ${{ steps.sel.outputs.hashes }}
        crates: ${{ steps.sel.outputs.missing }}
        endpoint: ${{ inputs.sccache-endpoint }}
        access-key: ${{ inputs.sccache-access-key }}
        secret-key: ${{ inputs.sccache-secret-key }}
    - name: CI summary
      if: ${{ !cancelled() }}
      uses: argyle-labs/.github/.github/actions/ci-summary@main

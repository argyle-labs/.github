name: Image promote
description: >
  Retag `<registry>/<name>:src-<hash>` (pushed by image-build in CI) to each
  release tag, registry-side, so every platform in the manifest list is kept.
  Fails when the source image is missing; never builds.

inputs:
  name:
    description: 'Image name without registry, e.g. `argyle-labs/<repo>`.'
    required: true
  hash:
    description: 'source-hash of the release commit, computed exactly as CI did.'
    required: true
  tags:
    description: 'Tags to apply, one per line (e.g. version and channel).'
    required: true
  registry:
    required: false
    default: gitea.scottkey.me
  registry-http:
    description: "'true' when the registry is a plain-HTTP endpoint (vars.CI_REGISTRY_HTTP)."
    required: false
    default: "false"
  username:
    required: true
  password:
    required: true

runs:
  using: composite
  steps:
    - name: Buildkit registry config (only for a plain-HTTP endpoint)
      id: buildkit
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_HTTP: ${{ inputs.registry-http }}
      run: |
        if [ "${REGISTRY_HTTP:-false}" = "true" ]; then
          {
            printf '[registry."%s"]\n' "$REGISTRY"
            printf '  http = true\n'
            printf '  insecure = true\n'
          } > "${RUNNER_TEMP}/buildkitd.toml"
          echo "config=${RUNNER_TEMP}/buildkitd.toml" >> "$GITHUB_OUTPUT"
        else
          echo "config=" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: network=host
        buildkitd-config: ${{ steps.buildkit.outputs.config }}

    - name: Log in to the registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Retag source image
      shell: bash
      env:
        REPO: ${{ inputs.registry }}/${{ inputs.name }}
        HASH: ${{ inputs.hash }}
        TAGS: ${{ inputs.tags }}
      run: |
        set -euo pipefail
        src="$REPO:src-$HASH"
        if ! docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
          echo "::error title=image-promote::$src not found; CI's image job must pass on this commit first (release never rebuilds)"
          exit 1
        fi
        args=()
        while IFS= read -r t; do
          t=${t//[[:space:]]/}
          [ -n "$t" ] && args+=(--tag "$REPO:$t")
        done <<< "$TAGS"
        [ ${#args[@]} -gt 0 ] || { echo "::error title=image-promote::no tags given"; exit 1; }
        docker buildx imagetools create "${args[@]}" "$src"
        printf 'Promoted %s →%s\n' "$src" "$(printf ' %s' "${args[@]}" | sed 's/ --tag//g')" | tee -a "$GITHUB_STEP_SUMMARY"

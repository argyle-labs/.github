name: Crate hashes
description: >
  Per-crate input hash for a Cargo workspace: each member's tracked files
  (`git ls-files -s` blob ids), the own-file hashes of every workspace crate it
  depends on (normal, dev and build, transitively), and the workspace-wide
  inputs (Cargo.lock, root Cargo.toml, rust-toolchain*, .cargo/config.toml,
  the calling workflow file, this repo's actions and workflows, image tag,
  `rustc -vV`). Pin every argyle-labs/.github action to the same ref: nested
  actions are pulled `@v1`. The closure is resolved
  with all features enabled. Feeds ci-pass-cache's batch modes.

inputs:
  image:
    description: 'CI image reference (e.g. `ci-rust:1.95.0`); a toolchain bump changes every hash.'
    required: false
    default: ""
  extra-paths:
    description: >
      Out-of-crate inputs, one `crate: path [path...]` per line, hashed as that
      crate's own files (so its dependents inherit them). `*: path` applies to
      every crate. Literal include_str!/include_bytes!/#[folder] targets outside
      a crate are added automatically.
    required: false
    default: ""
  workflow-file:
    description: >
      Calling workflow path relative to the repo root (not working-directory),
      e.g. `.github/workflows/ci.yml`. Falls back to GITHUB_WORKFLOW_REF when
      empty.
    required: false
    default: ""
  working-directory:
    required: false
    default: "."

outputs:
  hashes:
    description: 'JSON object mapping crate name to sha256 hex.'
    value: ${{ steps.hash.outputs.hashes }}

runs:
  using: composite
  steps:
    - name: Compute crate hashes
      id: hash
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMAGE: ${{ inputs.image }}
        EXTRA_PATHS: ${{ inputs.extra-paths }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        CARGO_HTTP_MULTIPLEXING: "false"
        CARGO_NET_RETRY: "10"
        CARGO_HTTP_TIMEOUT: "60"
      run: |
        set -euo pipefail
        hashes=$("$GITHUB_ACTION_PATH/hashes.sh")
        echo "hashes=$(jq -c . <<< "$hashes")" >> "$GITHUB_OUTPUT"
        jq -r 'to_entries[] | "\(.key) \(.value)"' <<< "$hashes"

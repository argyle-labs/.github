name: CI job — rust test
description: >
  The whole `test` job: runs job-rust-build's `nextest-archive` once under
  cargo-llvm-cov (results plus lcov and summary; coverage is report-only) and
  compiles nothing. Skipped when this source hash already passed `test`. The
  job `needs: build`.

inputs:
  image-tag:
    description: 'ci-rust image tag the job runs in; hashed into the source hash.'
    required: false
    default: "1.95.0"
  workflow-file:
    description: 'Calling workflow file (repo-root relative); hashed into the source hash.'
    required: false
    default: .github/workflows/ci.yml
  ui:
    description: 'The crate embeds ui/dist: hash `ui/` and place the `vite-dist` artifact, matching job-rust-build.'
    required: false
    default: "false"
  packages:
    description: 'Cargo package selection, split on whitespace; `--all-features` is appended.'
    required: false
    default: "--workspace"
  partition:
    description: 'nextest shard `<k>/<n>` for a matrix of n test jobs; each shard keeps its own `test-<k>-of-<n>` pass marker and `lcov-<k>-of-<n>` artifact. job-rust-build''s `test-partitions` must be n.'
    required: false
    default: ""
  build-jobs:
    description: 'CARGO_BUILD_JOBS. Empty keeps cargo''s default parallelism.'
    required: false
    default: ""
  debuginfo:
    description: 'CARGO_PROFILE_{DEV,TEST}_DEBUG. Empty keeps the profile default.'
    required: false
    default: "0"
  sccache-endpoint:
    description: 'S3 cache host:port for sccache and the pass cache (pass `vars.SCCACHE_ENDPOINT`).'
    required: false
    default: ""
  sccache-access-key:
    description: 'S3 cache access key (pass `secrets.SCCACHE_S3_ACCESS_KEY`); composites cannot read secrets.'
    required: false
    default: ""
  sccache-secret-key:
    description: 'S3 cache secret key (pass `secrets.SCCACHE_S3_SECRET_KEY`).'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Source hash
      id: src
      uses: argyle-labs/.github/.github/actions/source-hash@main
      with:
        actions: job-rust-build job-rust-test
        image: ci-rust:${{ inputs.image-tag }}
        workflow-file: ${{ inputs.workflow-file }}
        extra-paths: ${{ inputs.ui == 'true' && 'ui' || '' }}
    - name: Pass marker key
      id: key
      shell: bash
      env:
        PARTITION: ${{ inputs.partition }}
      run: |
        if [ -z "$PARTITION" ]; then
          echo "job=test" >> "$GITHUB_OUTPUT"
        elif [[ "$PARTITION" =~ ^([1-9][0-9]*)/([1-9][0-9]*)$ ]] && [ "${BASH_REMATCH[1]}" -le "${BASH_REMATCH[2]}" ]; then
          echo "job=test-${BASH_REMATCH[1]}-of-${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
        else
          echo "::error title=partition::'$PARTITION' is not <k>/<n> with 1 <= k <= n"
          exit 1
        fi
    - name: Check pass cache
      id: pass
      uses: argyle-labs/.github/.github/actions/ci-pass-cache@main
      with:
        mode: check
        job: ${{ steps.key.outputs.job }}
        hash: ${{ steps.src.outputs.hash }}
        force: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
        endpoint: ${{ inputs.sccache-endpoint }}
        access-key: ${{ inputs.sccache-access-key }}
        secret-key: ${{ inputs.sccache-secret-key }}
    - name: Reuse unchanged pass
      if: ${{ steps.pass.outputs.hit == 'true' }}
      shell: bash
      env:
        PASS_SHA: ${{ steps.pass.outputs.sha }}
      run: echo "Unchanged source — reusing pass from ${PASS_SHA:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Set up Rust (toolchain, sccache)
      if: ${{ steps.pass.outputs.hit != 'true' }}
      uses: argyle-labs/.github/.github/actions/rust-setup@main
      with:
        wrap-cc: 'true'
        build-jobs: ${{ inputs.build-jobs }}
        debuginfo: ${{ inputs.debuginfo }}
        sccache-endpoint: ${{ inputs.sccache-endpoint }}
        sccache-access-key: ${{ inputs.sccache-access-key }}
        sccache-secret-key: ${{ inputs.sccache-secret-key }}
        # CI-only: link the image's system OpenSSL instead of compiling
        # openssl-src; release builds keep vendoring it.
        env: |
          CARGO_TERM_COLOR=always
          CARGO_NET_GIT_FETCH_WITH_CLI=true
          OPENSSL_NO_VENDOR=1
    - name: Test + coverage (cargo nextest)
      if: ${{ steps.pass.outputs.hit != 'true' }}
      uses: argyle-labs/.github/.github/actions/cargo-test@main
      with:
        artifacts: ${{ inputs.ui == 'true' && 'vite-dist:ui/dist' || '' }}
        args: ${{ inputs.packages }} --all-features
        doctests: 'false'
        nextest-args: --no-fail-fast
        partition: ${{ inputs.partition }}
    - name: Record pass
      if: ${{ success() && steps.pass.outputs.hit != 'true' }}
      uses: argyle-labs/.github/.github/actions/ci-pass-cache@main
      with:
        mode: record
        job: ${{ steps.key.outputs.job }}
        hash: ${{ steps.src.outputs.hash }}
        endpoint: ${{ inputs.sccache-endpoint }}
        access-key: ${{ inputs.sccache-access-key }}
        secret-key: ${{ inputs.sccache-secret-key }}
    - name: CI summary
      if: ${{ !cancelled() }}
      uses: argyle-labs/.github/.github/actions/ci-summary@main

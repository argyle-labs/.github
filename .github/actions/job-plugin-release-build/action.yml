name: Plugin release job — build one target
description: >
  One plugin `build-<target>` job, Linux or darwin: checks out full history,
  fetches the prebuilt `ui-dist` when the repo has ui/package.json, then runs
  plugin-build (artifact `plugin-<target>`: <bin>-<tag>-<target> + .sha256).
  Linux targets run in the ci-rust container; darwin targets on the host,
  and only for stable tags (an RC darwin job succeeds without building).
  -rc. tags build with thin LTO, 16 codegen units and opt-level s, and skip
  the absolute size budget; the profile-* inputs apply to stable tags.

inputs:
  target:
    description: Rust target triple.
    required: true
  tag:
    description: Release tag. Empty = env.TAG.
    required: false
    default: ""
  version:
    description: Release version. Empty = derived from the tag.
    required: false
    default: ""
  has-ui:
    description: '"true" downloads ui-dist into ui/dist. Empty = when ui/package.json exists.'
    required: false
    default: ""
  bins:
    description: JSON array of bin names. Empty ([]) = derive from cargo metadata.
    required: false
    default: "[]"
  size-budget-mib:
    description: Absolute binary size budget (MiB) for plugin-size-check; over it fails.
    required: false
    default: "20"
  orca-fetch-token:
    description: 'Empty = env.ORCA_FETCH_TOKEN.'
    required: false
    default: ""
  sccache-endpoint:
    description: 'Empty = env.SCCACHE_ENDPOINT.'
    required: false
    default: ""
  sccache-region:
    description: 'Empty = env.SCCACHE_REGION, then garage.'
    required: false
    default: ""
  sccache-access-key:
    description: 'Empty = env.SCCACHE_S3_ACCESS_KEY.'
    required: false
    default: ""
  sccache-secret-key:
    description: 'Empty = env.SCCACHE_S3_SECRET_KEY.'
    required: false
    default: ""
  profile-strip:
    description: CARGO_PROFILE_RELEASE_STRIP. Empty = Cargo.toml profile.
    required: false
    default: symbols
  profile-lto:
    description: CARGO_PROFILE_RELEASE_LTO for stable tags. Empty = Cargo.toml profile.
    required: false
    default: "true"
  profile-codegen-units:
    description: CARGO_PROFILE_RELEASE_CODEGEN_UNITS for stable tags. Empty = Cargo.toml profile.
    required: false
    default: "1"
  profile-opt-level:
    description: CARGO_PROFILE_RELEASE_OPT_LEVEL for stable tags. Empty = Cargo.toml profile.
    required: false
    default: z

outputs:
  orca-source:
    description: Cargo.lock source of plugin-toolkit as resolved by this build.
    value: ${{ steps.build.outputs.orca-source }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Release tag
      id: rel
      uses: argyle-labs/.github/.github/actions/release-tag@main
      with:
        tag: ${{ inputs.tag || env.TAG }}
    - name: Skip darwin on release candidates
      if: ${{ steps.rel.outputs.prerelease == 'true' && endsWith(inputs.target, '-apple-darwin') }}
      shell: bash
      run: echo "::notice::darwin builds ship on stable tags only; skipping for ${{ steps.rel.outputs.tag }}"
    - name: Fetch prebuilt UI (real frontend for UI plugins; skipped otherwise)
      if: ${{ (steps.rel.outputs.prerelease != 'true' || !endsWith(inputs.target, '-apple-darwin')) && (inputs.has-ui == 'true' || (inputs.has-ui == '' && hashFiles('ui/package.json') != '')) }}
      uses: actions/download-artifact@v4
      with:
        name: ui-dist
        path: ui/dist
    - id: build
      if: ${{ steps.rel.outputs.prerelease != 'true' || !endsWith(inputs.target, '-apple-darwin') }}
      uses: argyle-labs/.github/.github/actions/plugin-build@main
      with:
        target: ${{ inputs.target }}
        version: ${{ inputs.version || steps.rel.outputs.version }}
        tag: ${{ steps.rel.outputs.tag }}
        bins: ${{ inputs.bins }}
        size-budget-mib: ${{ steps.rel.outputs.prerelease != 'true' && inputs.size-budget-mib || '' }}
        orca-fetch-token: ${{ inputs.orca-fetch-token || env.ORCA_FETCH_TOKEN }}
        sccache-access-key: ${{ inputs.sccache-access-key || env.SCCACHE_S3_ACCESS_KEY }}
        sccache-secret-key: ${{ inputs.sccache-secret-key || env.SCCACHE_S3_SECRET_KEY }}
        sccache-endpoint: ${{ inputs.sccache-endpoint || env.SCCACHE_ENDPOINT }}
        sccache-region: ${{ inputs.sccache-region }}
        profile-strip: ${{ inputs.profile-strip }}
        profile-lto: ${{ steps.rel.outputs.prerelease == 'true' && 'thin' || inputs.profile-lto }}
        profile-codegen-units: ${{ steps.rel.outputs.prerelease == 'true' && '16' || inputs.profile-codegen-units }}
        profile-opt-level: ${{ steps.rel.outputs.prerelease == 'true' && 's' || inputs.profile-opt-level }}

name: Build OS packages (orca full profile)
description: >
  Produce orca's OS packages (deb/rpm/PKGBUILD/homebrew/plg) on a Linux
  runner by REUSING orca's tested `build_os_packages` seam from
  scripts/release-lib.sh (explicitly designed to be sourced by Gitea pipelines).
  Expects the per-target `orca-<triple>` binaries already staged in
  ./dist-release. The macOS `.pkg` is NOT built here (needs Apple `pkgbuild`,
  macOS-only) — that leg runs best-effort on the mint macOS runner. Only used
  by the orca 'full' asset profile; plugins never call this.

runs:
  using: composite
  steps:
    - name: Install packaging tooling
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        # dpkg-dev → dpkg-deb (deb); rpm → rpmbuild (rpm). apk/pkgbuild-file/
        # homebrew/plg need no external tool; darwin .pkg (pkgbuild) is skipped.
        sudo apt-get install -y --no-install-recommends dpkg-dev rpm

    - name: Build OS packages
      shell: bash
      run: |
        set -euo pipefail
        # dpkg-deb rejects a group/world-writable control dir.
        umask 0022
        test -d dist-release || { echo "::error::dist-release/ missing — stage orca-<triple> binaries first"; exit 1; }
        # release-lib.sh is Bash-3.2 clean and side-effect-free on source
        # (sets REPO_ROOT/DIST_DIR). build_os_packages self-skips any format
        # whose tool is absent (so darwin .pkg skips cleanly on Linux).
        source scripts/release-lib.sh
        if declare -F build_os_packages >/dev/null; then build_os_packages; else build_native_packages; fi
        echo "── dist-release after packaging ──"
        ls -la dist-release

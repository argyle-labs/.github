name: Release job — draft stable
description: >
  After an RC is published: replaces any unpublished draft stable with a draft
  `<repo> v<base version>` at the RC's commit. Publishing it promotes to
  stable. Its body carries the RC's Size section against the previous stable. No-op unless `prerelease` is "true".

inputs:
  tag:
    description: 'Release tag (github.event.release.tag_name || inputs.version).'
    required: true
  release-token:
    description: 'Pass `secrets.ORCA_RELEASE_TOKEN`.'
    required: true

runs:
  using: composite
  steps:
    - name: Release tag
      id: rel
      uses: argyle-labs/.github/.github/actions/release-tag@main
      with:
        tag: ${{ inputs.tag }}
    - name: Base version
      id: base
      if: ${{ steps.rel.outputs.prerelease == 'true' }}
      shell: bash
      env:
        VERSION: ${{ steps.rel.outputs.version }}
      run: echo "tag=v${VERSION%-rc.*}" >> "$GITHUB_OUTPUT"
    - name: Replace draft stable
      if: ${{ steps.rel.outputs.prerelease == 'true' }}
      uses: argyle-labs/.github/.github/actions/release-draft@main
      with:
        release-token: ${{ inputs.release-token }}
        tag: ${{ steps.base.outputs.tag }}
        target-commitish: ${{ github.sha }}
        prerelease: "false"
    - name: Size section on draft stable
      if: ${{ steps.rel.outputs.prerelease == 'true' }}
      shell: bash
      env:
        GITEA_TOKEN: ${{ inputs.release-token }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        TAG: ${{ steps.rel.outputs.tag }}
        BODY_TAG: ${{ steps.base.outputs.tag }}
      run: bash "$GITHUB_ACTION_PATH/../plugin-size-check/release-size.sh"

name: Write release version
description: >
  Write a release version into the workspace Cargo.toml: the first
  `version = "..."` line plus every internal path-dep `=<old>` pin, then
  refresh the member entries of Cargo.lock, failing if any non-member entry
  moves. Exports ORCA_RELEASE_VERSION. The one place release version bumps live.

inputs:
  version:
    description: Release version, no v prefix.
    required: true
  working-directory:
    description: Workspace root.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Write release version into Cargo.toml
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        old="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/' || true)"
        # Replace the first workspace `version = "..."` — don't match the old
        # value (avoids escaping pre-release strings). Portable sed (Linux CI).
        sed -i 's/^version = ".*"/version = "'"$REL_VERSION"'"/' Cargo.toml
        # Internal path deps pin `=<workspace version>`; bump only those, so a
        # member with its own frozen version (e.g. plugin-abi =0.1.0) is left alone.
        if [ -n "$old" ]; then
          old_re="$(printf '%s' "$old" | sed 's/[][\\.*^$/]/\\&/g')"
          sed -i '/path = "/s/version = "='"$old_re"'"/version = "='"$REL_VERSION"'"/' Cargo.toml
        fi
        echo "workspace version → $(grep '^version' Cargo.toml | head -1)"
        # Refresh the lock for the new version. MUST be --workspace (members are
        # version.workspace=true).
        # Snapshot every sourced (non-member) lock entry, refresh only the member
        # versions, and fail if any sourced entry moved: `cargo update --workspace`
        # silently re-resolves a drifted lock, which would make `--locked` prove nothing.
        snap() { awk '/^\[/{if(s)print n,v,s;n=v=s=""} /^name = /{n=$3} /^version = /{v=$3} /^source = /{s=$3} END{if(s)print n,v,s}' Cargo.lock; }
        before=$(snap)
        cargo update --workspace
        after=$(snap)
        [ "$before" = "$after" ] || { echo "::error::cargo update --workspace changed non-member lock entries (stale/drifted Cargo.lock) — regenerate with no .cargo/config.toml and commit"; diff <(echo "$before") <(echo "$after"); exit 1; }
        cargo metadata --locked --format-version=1 >/dev/null \
          || { echo "::error::Cargo.lock out of sync after version write"; exit 1; }
        # orca's build.rs bakes this verbatim; harmless for plugins.
        echo "ORCA_RELEASE_VERSION=$REL_VERSION" >> "$GITHUB_ENV"

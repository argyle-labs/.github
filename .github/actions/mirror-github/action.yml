name: Mirror release to GitHub
description: >
  Mirror a release + its assets OUTWARD to GitHub Releases (the read-only
  public mirror; Gitea is canonical). Ports the proven plugin-release curl+jq
  pattern against api.github.com (the Gitea runner image lacks `gh`).
  Idempotent — reuses an existing GitHub release for the tag. The GitHub tag
  is pushed at the exact object Gitea's tag points at; a GitHub tag that
  already exists at a different commit fails the step (never force-moved).

inputs:
  github-token:
    description: >
      GitHub token with contents:write AND workflow scope on the mirror repo
      (workflow: GitHub rejects pushing a tag whose new history touches
      .github/workflows without it).
    required: true
  gitea-token:
    description: Gitea token with read on the repo (resolves the canonical tag).
    required: true
  tag:
    description: Tag name (e.g. v0.1.8-rc.9).
    required: true
  name:
    description: Release title.
    required: true
  body:
    description: Release notes (markdown).
    required: false
    default: ""
  prerelease:
    description: "true = prerelease (RC); false = stable."
    required: false
    default: "true"
  assets-dir:
    description: Directory whose files are uploaded as release assets.
    required: true

runs:
  using: composite
  steps:
    - name: Mirror to GitHub
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITEA_TOKEN: ${{ inputs.gitea-token }}
        REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        REL_NAME: ${{ inputs.name }}
        REL_BODY: ${{ inputs.body }}
        PRERELEASE: ${{ inputs.prerelease }}
        ASSETS_DIR: ${{ inputs.assets-dir }}
      run: |
        set -euo pipefail
        api="https://api.github.com"
        up="https://uploads.github.com"
        auth=(-H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
        rel_api="${api}/repos/${REPO}/releases"
        if [ -n "$GH_TOKEN" ]; then echo "::add-mask::$GH_TOKEN"; fi
        if [ -n "$GITEA_TOKEN" ]; then echo "::add-mask::$GITEA_TOKEN"; fi

        gitea_base="${GITHUB_SERVER_URL:-https://gitea.scottkey.me}"
        gitea_url="${gitea_base/:\/\//://x-access-token:${GITEA_TOKEN}@}/${REPO}.git"
        gh_url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
        git_dir=$(mktemp -d); trap 'rm -rf "$git_dir"' EXIT
        git init --quiet --bare "$git_dir"
        # GitHub may lack the version-bump commit; fetch full history so the push can supply it.
        git -C "$git_dir" -c credential.helper= fetch --quiet --no-tags "$gitea_url" "refs/tags/${TAG}:refs/tags/${TAG}"
        sha=$(git -C "$git_dir" rev-parse "refs/tags/${TAG}^{commit}")
        echo "→ Gitea tag ${TAG} → ${sha}"

        # Peeled commit of the GitHub tag (empty if absent).
        gh_tag_commit() {
          git -c credential.helper= ls-remote "$gh_url" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            | awk -v t="refs/tags/${TAG}" '$2==t"^{}"{p=$1} $2==t{l=$1} END{print (p!=""?p:l)}'
        }
        gh_sha=$(gh_tag_commit)
        if [ -z "$gh_sha" ]; then
          echo "→ pushing tag ${TAG} to GitHub"
          if ! git -C "$git_dir" -c credential.helper= push --quiet "$gh_url" "refs/tags/${TAG}:refs/tags/${TAG}"; then
            echo "::error::GitHub rejected the ${TAG} tag push; if history touches .github/workflows, the github-token input may lack the workflow scope"
            exit 1
          fi
        elif [ "$gh_sha" != "$sha" ]; then
          echo "::error::GitHub tag ${TAG} is at ${gh_sha}, Gitea's at ${sha} — refusing to move a published tag; reconcile by hand"
          exit 1
        fi

        existing=$(curl -fsS "${auth[@]}" "${rel_api}/tags/${TAG}" 2>/dev/null || echo "")
        rel_id=$(echo "$existing" | jq -r '.id // empty' 2>/dev/null || true)

        body_json=$(jq -n \
          --arg tag "$TAG" --arg name "$REL_NAME" --arg body "$REL_BODY" \
          --argjson pre "$PRERELEASE" \
          --arg target "$sha" \
          '{tag_name:$tag, target_commitish:$target, name:$name, body:$body, prerelease:$pre}')

        if [ -n "$rel_id" ]; then
          echo "→ updating existing GitHub release id=$rel_id ($TAG)"
          curl -fsS "${auth[@]}" -X PATCH -d "$body_json" "${rel_api}/${rel_id}" >/dev/null
          for aid in $(echo "$existing" | jq -r '.assets[]?.id // empty'); do
            curl -fsS "${auth[@]}" -X DELETE "${rel_api}/assets/${aid}" >/dev/null || true
          done
        else
          echo "→ creating GitHub release ($TAG)"
          created=$(curl -fsS "${auth[@]}" -X POST -d "$body_json" "$rel_api")
          rel_id=$(echo "$created" | jq -r '.id')
        fi
        [ -n "$rel_id" ] && [ "$rel_id" != "null" ] || { echo "::error::no GitHub release id"; exit 1; }

        shopt -s nullglob
        count=0
        for f in "$ASSETS_DIR"/*; do
          [ -f "$f" ] || continue
          name=$(basename "$f")
          echo "  ↑ $name"
          curl -fsS "${auth[@]}" -H "Content-Type: application/octet-stream" \
            --data-binary "@${f}" \
            "${up}/repos/${REPO}/releases/${rel_id}/assets?name=${name}" >/dev/null
          count=$((count+1))
        done
        echo "→ mirrored $count asset(s) to GitHub release $TAG (id=$rel_id)"

        gh_sha=$(gh_tag_commit)
        [ "$gh_sha" = "$sha" ] || { echo "::error::GitHub tag ${TAG} resolves to '${gh_sha}', expected ${sha}"; exit 1; }
        echo "→ GitHub tag ${TAG} matches Gitea (${sha})"

name: Source hash
description: >
  Hash of every tracked input that can change a Rust build or test result, from
  `git ls-files -s` blob ids (no file contents are read). CI-only and doc-only
  changes leave it unchanged, except the calling workflow file and this repo's
  shared actions and workflows. Callers must pin every argyle-labs/.github
  action to the same ref: nested actions are pulled `@main`, so only then is
  the hashed tree the one that runs. Keyed per job by ci-pass-cache, so the hash itself is
  job-independent.

inputs:
  image:
    description: 'CI image reference (e.g. `ci-rust:1.95.0`); a toolchain bump changes the hash.'
    required: false
    default: ""
  extra-paths:
    description: >
      Extra pathspecs, one per line, that feed the build or tests: frontend
      sources, data dirs reached by include_str!/include_bytes! through a
      non-literal path (concat!/env!), or anything else the defaults miss.
    required: false
    default: ""
  workflow-file:
    description: >
      Calling workflow path relative to the repo root (not working-directory),
      e.g. `.github/workflows/ci.yml`. Falls back to GITHUB_WORKFLOW_REF when
      empty.
    required: false
    default: ""
  working-directory:
    required: false
    default: "."

outputs:
  hash:
    description: 'sha256 hex of the inputs.'
    value: ${{ steps.hash.outputs.hash }}

runs:
  using: composite
  steps:
    - name: Compute source hash
      id: hash
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMAGE: ${{ inputs.image }}
        EXTRA_PATHS: ${{ inputs.extra-paths }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
      run: |
        set -euo pipefail
        workflow=$WORKFLOW_FILE
        # GITHUB_WORKFLOW_REF is `owner/repo/<path>@<ref>`, <path> relative to
        # the repo root.
        if [ -z "$workflow" ] && [ -n "${GITHUB_WORKFLOW_REF:-}" ]; then
          workflow=${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY:-}/"}
          workflow=${workflow%%@*}
        fi
        if [ -z "$workflow" ] || ! git ls-files --error-unmatch -- ":(top)$workflow" >/dev/null 2>&1; then
          echo "::error title=source-hash::calling workflow file '$workflow' not tracked (workflow-file / GITHUB_WORKFLOW_REF)"
          exit 1
        fi
        extras=()
        while IFS= read -r line; do
          read -ra ps <<< "$line"
          for p in "${ps[@]}"; do
            if [ -z "$(git ls-files -- "$p")" ]; then
              echo "::error title=source-hash::extra-paths entry '$p' matches no tracked files"
              exit 1
            fi
            extras+=("$p")
          done
        done <<< "$EXTRA_PATHS"
        # This repo's actions and workflows, as checked out for this action.
        actions=$(cd "$GITHUB_ACTION_PATH/../.." && find actions workflows -type f | LC_ALL=C sort | xargs -d '\n' sha256sum | sha256sum | cut -d' ' -f1)
        specs=(
          ':(glob)**/*.rs'
          ':(glob)**/Cargo.toml'
          ':(glob)**/Cargo.lock'
          ':(glob)**/build.rs'
          ':(glob)**/rust-toolchain*'
          ':(glob)**/.cargo/config.toml'
          ':(glob)**/tests/**'
          ":(top)$workflow"
          "${extras[@]}"
        )
        # Literal include_str!/include_bytes! targets: hash the directory each
        # one lives in, resolved relative to the including file.
        while IFS=: read -r file arg; do
          [ -n "$file" ] || continue
          path=$(sed -E 's/^include_(str|bytes)!\("([^"]+)"\)$/\2/' <<< "$arg")
          dir=$(realpath -m --relative-to=. "$(dirname "$file")/$(dirname "$path")")
          case "$dir" in
            ..|../*)
              echo "::error title=source-hash::$file includes '$path', outside working-directory; move it in or widen working-directory"
              exit 1 ;;
          esac
          if [ -z "$(git ls-files -- "$dir")" ]; then
            echo "::error title=source-hash::$file includes '$path' but '$dir' has no tracked files"
            exit 1
          fi
          specs+=("$dir")
        done < <(git grep -oE 'include_(str|bytes)!\("[^"]+"\)' -- '*.rs' || true)
        hash=$(
          {
            echo "image=$IMAGE"
            echo "actions=$actions"
            rustc -vV 2>/dev/null || true
            printf '%s\n' "${specs[@]}" | sort -u | xargs -d '\n' git ls-files -s --
          } | sha256sum | cut -d' ' -f1
        )
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
        echo "source hash: $hash"

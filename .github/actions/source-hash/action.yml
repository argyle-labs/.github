name: Source hash
description: >
  Hash of every tracked input that can change a Rust build or test result, from
  `git ls-files -s` blob ids (no file contents are read). CI-only and doc-only
  changes leave it unchanged, except the calling workflow file and the shared
  actions named in `actions` plus every shared action they reach. Callers must pin every argyle-labs/.github
  action to the same ref: nested actions are pulled `@main`, so only then is
  the hashed tree the one that runs. Keyed per job by ci-pass-cache, so the hash itself is
  job-independent.

inputs:
  image:
    description: 'CI image reference (e.g. `ci-rust:1.95.0`); a toolchain bump changes the hash.'
    required: false
    default: ""
  extra-paths:
    description: >
      Extra pathspecs, one per line, that feed the build or tests: frontend
      sources, data dirs reached by include_str!/include_bytes! through a
      non-literal path (concat!/env!), or anything else the defaults miss. An
      include of env!("OUT_DIR") output requires the build script's inputs
      here; with none it fails.
    required: false
    default: ""
  workflow-file:
    description: >
      Calling workflow path relative to the repo root (not working-directory),
      e.g. `.github/workflows/ci.yml`. Falls back to GITHUB_WORKFLOW_REF when
      empty.
    required: false
    default: ""
  actions:
    description: >
      Shared actions the calling job runs, whitespace-separated (e.g.
      `job-rust-test`); the actions they use are followed transitively. Empty
      hashes every shared action and workflow.
    required: false
    default: ""
  working-directory:
    required: false
    default: "."

outputs:
  hash:
    description: 'sha256 hex of the inputs.'
    value: ${{ steps.hash.outputs.hash }}

runs:
  using: composite
  steps:
    - name: Compute source hash
      id: hash
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMAGE: ${{ inputs.image }}
        EXTRA_PATHS: ${{ inputs.extra-paths }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        ACTIONS: ${{ inputs.actions }}
      run: |
        set -euo pipefail
        hash=$("$GITHUB_ACTION_PATH/hash.sh")
        echo "source hash: $hash"

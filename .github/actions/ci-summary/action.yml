name: CI summary
description: >
  Render /tmp/ci-phases (`name|seconds|exit` lines appended by each timed
  step's EXIT trap) and sccache stats into the step summary.

runs:
  using: composite
  steps:
    - name: Write phase timings summary
      shell: bash
      run: |
        {
          echo "### Phase timings"
          echo "| phase | seconds | exit |"
          echo "|---|---:|---:|"
          if [ -f /tmp/ci-phases ]; then
            while IFS='|' read -r p t e; do echo "| $p | $t | $e |"; done < /tmp/ci-phases
          fi
          if command -v sccache >/dev/null; then
            echo
            echo "### sccache"
            stats=$(sccache --show-stats 2>&1) || stats="(sccache server not running)"
            echo '```'
            echo "$stats"
            echo '```'
          fi
        } | tee -a "$GITHUB_STEP_SUMMARY"
        if errs=$(grep -m 20 -iE 'error|warn|failed|panic' "${SCCACHE_ERROR_LOG:-/dev/null}" 2>/dev/null); then
          echo "::warning title=sccache errors::$(tr '\n' ' ' <<< "$errs")"
        fi
        /bin/bash "$GITHUB_ACTION_PATH/../sccache-guard/guard.sh" stats || exit 1

name: actionlint
description: "actionlint over the repo's workflows; uses .github/actionlint.yaml when present."

inputs:
  working-directory:
    description: 'Directory the tool runs in.'
    required: false
    default: "."
  version:
    description: 'actionlint release.'
    required: false
    default: "1.7.12"

runs:
  using: composite
  steps:
    - name: Install actionlint
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        v="$VERSION"
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        # sum: release tarball (actionlint_<v>_checksums.txt); bin: the extracted binary.
        case "$v/$arch" in
          1.7.12/amd64)
            sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
            bin=c872d6db8c6bf83a8eaa704fc93999f027d55dffbc63b8a6abdccb47df5f4cd4 ;;
          1.7.12/arm64)
            sum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
            bin=ac0323433c2853ec3fb978c611430c5b3dc5d43c58d1a1ec031b00ab572beb60 ;;
          *) echo "no pinned sha256 for actionlint $v/$arch" >&2; exit 1 ;;
        esac
        trusted() { [ -x "$1" ] && echo "$bin  $1" | sha256sum -c --quiet - 2>/dev/null; }
        use() { echo "ACTIONLINT=$1" >> "$GITHUB_ENV"; exit 0; }
        if p="$(command -v actionlint)" && trusted "$p"; then use "$p"; fi
        cache="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/actionlint/$v/$arch"
        if trusted "$cache/actionlint"; then use "$cache/actionlint"; fi
        tmp="$(mktemp -d "${RUNNER_TEMP:-/tmp}/actionlint.XXXXXX")"
        trap 'rm -rf "$tmp"' EXIT
        file="actionlint_${v}_linux_${arch}.tar.gz"
        tgz="$tmp/$file"
        for url in \
          "https://gitea.scottkey.me/api/packages/argyle-labs/generic/actionlint/${v}/${file}" \
          "https://github.com/rhysd/actionlint/releases/download/v${v}/${file}"; do
          if curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$tgz" "$url" \
            && echo "$sum  $tgz" | sha256sum -c --quiet - \
            && tar -xzf "$tgz" -C "$tmp" actionlint \
            && trusted "$tmp/actionlint"; then
            if { mkdir -p "$cache" && cp "$tmp/actionlint" "$cache/actionlint.$$" \
              && mv -f "$cache/actionlint.$$" "$cache/actionlint"; } 2>/dev/null \
              && trusted "$cache/actionlint"; then
              use "$cache/actionlint"
            fi
            # Cache not writable: keep a per-job copy outside $tmp, which is removed on exit.
            keep="$(mktemp -d "${RUNNER_TEMP:-/tmp}/actionlint-bin.XXXXXX")"
            cp "$tmp/actionlint" "$keep/"
            use "$keep/actionlint"
          fi
          echo "actionlint fetch/verify failed: $url" >&2
        done
        exit 1

    - name: actionlint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        export t0=$SECONDS; trap 'echo "actionlint|$((SECONDS - t0))|$?" >> /tmp/ci-phases' EXIT
        config=.github/actionlint.yaml
        if [ ! -f "$config" ]; then
          config=/tmp/actionlint-default.yaml
          printf 'self-hosted-runner:\n  labels:\n    - ci-large\n' > "$config"
        fi
        "$ACTIONLINT" -config-file "$config"

name: actionlint
description: "actionlint over the repo's workflows; uses .github/actionlint.yaml when present."

inputs:
  working-directory:
    description: 'Directory the tool runs in.'
    required: false
    default: "."
  version:
    description: 'actionlint release.'
    required: false
    default: "1.7.12"

runs:
  using: composite
  steps:
    - name: Install actionlint
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        v="$VERSION"
        if command -v actionlint >/dev/null && [ "$(actionlint -version | head -n1)" = "$v" ]; then
          ln -sf "$(command -v actionlint)" /tmp/actionlint
          exit 0
        fi
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        cache="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/actionlint/$v/$arch"
        if [ -x "$cache/actionlint" ]; then
          ln -sf "$cache/actionlint" /tmp/actionlint
          exit 0
        fi
        # From the release's actionlint_<v>_checksums.txt.
        case "$v/$arch" in
          1.7.12/amd64) sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
          1.7.12/arm64) sum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
          *) echo "no pinned sha256 for actionlint $v/$arch" >&2; exit 1 ;;
        esac
        file="actionlint_${v}_linux_${arch}.tar.gz"
        tgz="/tmp/$file"
        for url in \
          "https://gitea.scottkey.me/api/packages/argyle-labs/generic/actionlint/${v}/${file}" \
          "https://github.com/rhysd/actionlint/releases/download/v${v}/${file}"; do
          if curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$tgz" "$url" \
            && echo "$sum  $tgz" | sha256sum -c --quiet -; then
            tar -xzf "$tgz" -C /tmp actionlint
            { mkdir -p "$cache" && cp /tmp/actionlint "$cache/"; } 2>/dev/null || true
            exit 0
          fi
          echo "actionlint fetch/verify failed: $url" >&2
        done
        exit 1

    - name: actionlint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        export t0=$SECONDS; trap 'echo "actionlint|$((SECONDS - t0))|$?" >> /tmp/ci-phases' EXIT
        config=.github/actionlint.yaml
        if [ ! -f "$config" ]; then
          config=/tmp/actionlint-default.yaml
          printf 'self-hosted-runner:\n  labels:\n    - ci-large\n' > "$config"
        fi
        /tmp/actionlint -config-file "$config"

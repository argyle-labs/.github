name: cargo clippy
description: >
  `cargo clippy -D warnings`. Check-mode output cannot reuse a plain build's
  target/, so this leans on the shared sccache. Expects checkout and
  rust-setup earlier in the job.

inputs:
  working-directory:
    description: 'Directory the tool runs in.'
    required: false
    default: "."
  artifacts:
    description: 'Lines of `name:path`: artifacts from earlier jobs placed before the step runs (e.g. `vite-dist:ui/dist`).'
    required: false
    default: ""
  args:
    description: 'Cargo arguments selecting packages/features. Split on whitespace with no quoting; pass features comma-separated.'
    required: false
    default: "--workspace --all-targets --all-features"

runs:
  using: composite
  steps:
    - uses: argyle-labs/.github/.github/actions/fetch-artifacts@main
      with:
        artifacts: ${{ inputs.artifacts }}

    - name: Clippy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
      run: |
        export t0=$SECONDS; trap 'echo "clippy|$((SECONDS - t0))|$?" >> /tmp/ci-phases' EXIT
        read -ra args <<< "$ARGS"
        cargo clippy --locked "${args[@]}" -- -D warnings

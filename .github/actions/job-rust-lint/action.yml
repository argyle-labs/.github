name: CI job — rust lint
description: >
  The whole `lint` job. Always: repo `scripts` and actionlint. For crates
  without a lint pass for their crate hash (crate-select: changed crates plus
  their reverse dependents): fmt, clippy on just those crates, the cargo-hakari
  workspace-hack check, `cargo-checks`, publishable-crate packaging and
  Cargo.lock drift. Runs beside `build` (clippy's check build cannot reuse the
  archive).

inputs:
  image-tag:
    description: 'ci-rust image tag the job runs in; hashed into the source hash.'
    required: false
    default: "1.95.0"
  workflow-file:
    description: 'Calling workflow file (repo-root relative); hashed into the source hash.'
    required: false
    default: .github/workflows/ci.yml
  ui:
    description: 'The crate embeds ui/dist: place the `vite-dist` artifact before clippy (the job `needs:` build-ui).'
    required: false
    default: "false"
  extra-paths:
    description: 'crate-hashes `extra-paths`: lines of `crate: path [path...]` hashed as that crate''s own files, `*` for every crate. Root rustfmt/clippy configs are added automatically.'
    required: false
    default: ""
  features:
    description: 'Cargo feature arguments appended to the clippy package selection.'
    required: false
    default: "--all-features"
  force:
    description: '`true` lints every crate regardless of recorded passes (also set by a `force` workflow_dispatch input).'
    required: false
    default: "false"
  scripts:
    description: 'Repo commands run first on every run, one per line (e.g. a tracked-tree guard). Pass any secret they need through the job `env`.'
    required: false
    default: ""
  cargo-checks:
    description: 'Extra cargo invocations run when any crate is selected, one per line, without the leading `cargo` (e.g. `check -p foo --no-default-features`).'
    required: false
    default: ""
  package-publishable:
    description: '`true` runs `cargo package --no-verify` over every crate whose `publish` lists `package-registry`.'
    required: false
    default: "false"
  package-registry:
    description: 'Registry `package-publishable` checks against.'
    required: false
    default: gitea
  build-jobs:
    description: 'CARGO_BUILD_JOBS. Empty keeps cargo''s default parallelism.'
    required: false
    default: ""
  debuginfo:
    description: 'CARGO_PROFILE_{DEV,TEST}_DEBUG. Empty keeps the profile default.'
    required: false
    default: "0"
  drop-cargo-config:
    description: 'rust-setup `drop-cargo-config`.'
    required: false
    default: "true"
  sccache-endpoint:
    description: 'S3 cache host:port for sccache and the pass cache (pass `vars.SCCACHE_ENDPOINT`).'
    required: false
    default: ""
  sccache-access-key:
    description: 'S3 cache access key (pass `secrets.SCCACHE_S3_ACCESS_KEY`); composites cannot read secrets.'
    required: false
    default: ""
  sccache-secret-key:
    description: 'S3 cache secret key (pass `secrets.SCCACHE_S3_SECRET_KEY`).'
    required: false
    default: ""
  target-cache:
    description: 'Host-mounted cache root for a persistent incremental clippy target dir (see cargo-target-cache); a no-op when not mounted.'
    required: false
    default: /ci-target-cache
  lock-check:
    description: 'Cargo.lock drift gate: `enforce` fails the job, `warn` annotates only.'
    required: false
    default: enforce

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Repo scripts
      if: ${{ inputs.scripts != '' }}
      shell: bash
      env:
        SCRIPTS: ${{ inputs.scripts }}
      run: |
        set -euo pipefail
        while IFS= read -r cmd; do
          [ -n "${cmd//[[:space:]]/}" ] || continue
          echo "::group::$cmd"
          bash -c "$cmd"
          echo "::endgroup::"
        done <<< "$SCRIPTS"
    - name: actionlint
      if: ${{ !cancelled() }}
      uses: argyle-labs/.github/.github/actions/actionlint@v1
    - name: Lint configs
      id: cfg
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        files=$(git ls-files -- rustfmt.toml .rustfmt.toml clippy.toml .clippy.toml | tr '\n' ' ')
        echo "extra=${files:+*: $files}" >> "$GITHUB_OUTPUT"
    - name: Select crates
      id: sel
      if: ${{ !cancelled() }}
      uses: argyle-labs/.github/.github/actions/crate-select@v1
      with:
        job: lint-${{ inputs.lock-check }}
        image: ci-rust:${{ inputs.image-tag }}
        workflow-file: ${{ inputs.workflow-file }}
        extra-paths: |
          ${{ inputs.extra-paths }}
          ${{ steps.cfg.outputs.extra }}
          ${{ inputs.ui == 'true' && '*: ui' || '' }}
        force: ${{ (inputs.force == 'true' || github.event.inputs.force == 'true') && 'true' || 'false' }}
        endpoint: ${{ inputs.sccache-endpoint }}
        access-key: ${{ inputs.sccache-access-key }}
        secret-key: ${{ inputs.sccache-secret-key }}
    - name: Reuse recorded passes
      if: ${{ !cancelled() && steps.sel.outcome == 'success' && steps.sel.outputs.selection == '' }}
      shell: bash
      run: echo "Unchanged — reusing lint pass for every crate" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Set up Rust (toolchain, sccache)
      id: setup
      if: ${{ !cancelled() && steps.sel.outputs.selection != '' }}
      uses: argyle-labs/.github/.github/actions/rust-setup@v1
      with:
        drop-cargo-config: ${{ inputs.drop-cargo-config }}
        fast-linker: 'true'
        wrap-cc: 'true'
        build-jobs: ${{ inputs.build-jobs }}
        debuginfo: ${{ inputs.debuginfo }}
        sccache-endpoint: ${{ inputs.sccache-endpoint }}
        sccache-access-key: ${{ inputs.sccache-access-key }}
        sccache-secret-key: ${{ inputs.sccache-secret-key }}
        # CI-only: link the image's system OpenSSL instead of compiling
        # openssl-src; release builds keep vendoring it.
        env: |
          CARGO_TERM_COLOR=always
          CARGO_NET_GIT_FETCH_WITH_CLI=true
          OPENSSL_NO_VENDOR=1
    - name: Persistent target dir
      if: ${{ !cancelled() && steps.sel.outputs.selection != '' && steps.setup.outcome == 'success' }}
      uses: argyle-labs/.github/.github/actions/cargo-target-cache@v1
      with:
        root: ${{ inputs.target-cache }}
    - name: Format (cargo fmt)
      if: ${{ !cancelled() && steps.sel.outputs.selection != '' && steps.setup.outcome == 'success' }}
      uses: argyle-labs/.github/.github/actions/cargo-fmt@v1
    - name: Clippy
      if: ${{ !cancelled() && steps.sel.outputs.selection != '' && steps.setup.outcome == 'success' }}
      uses: argyle-labs/.github/.github/actions/cargo-clippy@v1
      with:
        artifacts: ${{ inputs.ui == 'true' && 'vite-dist:ui/dist' || '' }}
        args: ${{ steps.sel.outputs.packages }} --all-targets ${{ inputs.features }}
    - name: Workspace-hack (cargo hakari)
      if: ${{ !cancelled() && steps.sel.outputs.selection != '' && steps.setup.outcome == 'success' }}
      uses: argyle-labs/.github/.github/actions/cargo-hakari-check@v1
    - name: Extra cargo checks
      if: ${{ !cancelled() && steps.sel.outputs.selection != '' && steps.setup.outcome == 'success' && inputs.cargo-checks != '' }}
      shell: bash
      env:
        CHECKS: ${{ inputs.cargo-checks }}
      run: |
        set -euo pipefail
        while IFS= read -r line; do
          [ -n "${line//[[:space:]]/}" ] || continue
          read -ra args <<< "$line"
          echo "::group::cargo $line"
          cargo "${args[@]}"
          echo "::endgroup::"
        done <<< "$CHECKS"
    # Checks each publishable crate's manifest and file list; the full
    # build-from-tarball verify runs at release, in `cargo publish`.
    - name: Package publishable crates
      if: ${{ !cancelled() && steps.sel.outputs.selection != '' && steps.setup.outcome == 'success' && inputs.package-publishable == 'true' }}
      shell: bash
      env:
        REGISTRY: ${{ inputs.package-registry }}
      run: |
        set -o pipefail
        mapfile -t pkgs < <(cargo metadata --format-version 1 --no-deps --locked \
          | jq -r --arg r "$REGISTRY" '.packages[] | select(.publish | index($r)) | "-p", .name')
        # pipefail can't see into the process substitution; empty means it failed.
        [ "${#pkgs[@]}" -gt 0 ] || { echo "no publishable crates found" >&2; exit 1; }
        cargo package --no-verify --locked --registry "$REGISTRY" "${pkgs[@]}"
    # Last: it deletes .cargo/config.toml, which the cargo steps above need.
    - name: Lock file check
      if: ${{ !cancelled() && steps.sel.outputs.selection != '' && steps.setup.outcome == 'success' }}
      uses: argyle-labs/.github/.github/actions/cargo-lock-check@v1
      with:
        mode: ${{ inputs.lock-check }}
    - name: Record pass
      if: ${{ success() && steps.sel.outputs.selection != '' }}
      uses: argyle-labs/.github/.github/actions/ci-pass-cache@v1
      with:
        mode: record-batch
        job: lint-${{ inputs.lock-check }}
        hashes: ${{ steps.sel.outputs.hashes }}
        crates: ${{ steps.sel.outputs.missing }}
        endpoint: ${{ inputs.sccache-endpoint }}
        access-key: ${{ inputs.sccache-access-key }}
        secret-key: ${{ inputs.sccache-secret-key }}
    - name: CI summary
      if: ${{ !cancelled() }}
      uses: argyle-labs/.github/.github/actions/ci-summary@v1

name: plugin-toolkit latest
description: >
  `cargo update` orca-plugin-toolkit and orca-plugin-toolkit-build to the
  latest released version allowed by Cargo.toml, so plugins build against the
  newest toolkit instead of whatever the committed lock recorded. Packages that
  are absent from Cargo.lock or are workspace members are skipped. Outputs the
  resolved versions so callers can fold them into pass/cache keys, which hash
  committed blobs and so never see this lock update.

inputs:
  working-directory:
    description: 'Cargo workspace root.'
    required: false
    default: "."

outputs:
  versions:
    description: 'Resolved `crate@version` list (comma-separated) for the updated crates; empty when none.'
    value: ${{ steps.update.outputs.versions }}

runs:
  using: composite
  steps:
    - name: Update orca-plugin-toolkit to latest released
      id: update
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: /bin/bash "$GITHUB_ACTION_PATH/update.sh"

name: plugin-toolkit latest
description: >
  Pin orca-plugin-toolkit and orca-plugin-toolkit-build to the highest
  published version in their registry (crate-latest), for this build only: the
  working-copy requirement becomes `=<ver>` and the lock is moved with
  `cargo update --precise`. Resolving from the index rather than the `>=`
  requirement keeps advancing across patch/minor prereleases, which cargo's
  prerelease matching would not. Git-sourced copies get a plain `cargo update`;
  workspace members and absent crates are skipped. Outputs `crate@version` for
  both so callers can fold them into pass/cache keys, which hash committed blobs
  and never see this update.

inputs:
  working-directory:
    description: 'Cargo workspace root.'
    required: false
    default: "."

outputs:
  versions:
    description: 'Resolved `crate@version` list (comma-separated) for the updated crates; empty when none.'
    value: ${{ steps.update.outputs.versions }}

runs:
  using: composite
  steps:
    - name: Update orca-plugin-toolkit to latest released
      id: update
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: /bin/bash "$GITHUB_ACTION_PATH/update.sh"

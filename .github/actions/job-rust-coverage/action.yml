name: CI job — rust coverage
description: >
  The `test` job: runs job-rust-build's `nextest-archive`
  once under cargo-llvm-cov (lcov artifact plus step-summary table; coverage is
  report-only) and compiles nothing. Use in place of job-rust-test, not beside
  it. Runs only the crates without a `test` pass for their crate hash that the
  build archived; skipped when none remain. The job `needs: build`.

inputs:
  image-tag:
    description: 'ci-rust image tag the job runs in; hashed into the source hash.'
    required: false
    default: "1.95.0"
  workflow-file:
    description: 'Calling workflow file (repo-root relative); hashed into the source hash.'
    required: false
    default: .github/workflows/ci.yml
  ui:
    description: 'The crate embeds ui/dist: hash `ui/` and place the `vite-dist` artifact, matching job-rust-build.'
    required: false
    default: "false"
  partition:
    description: 'nextest shard `<k>/<n>` for a matrix of n test jobs; each shard keeps its own `test-<k>-of-<n>` pass marker and `lcov-<k>-of-<n>` artifact. job-rust-build''s `test-partitions` must be n.'
    required: false
    default: ""
  extra-paths:
    description: 'crate-hashes `extra-paths`; must match job-rust-build''s.'
    required: false
    default: ""
  force:
    description: '`true` tests every archived crate regardless of recorded passes (also set by a `force` workflow_dispatch input).'
    required: false
    default: "false"
  build-jobs:
    description: 'CARGO_BUILD_JOBS. Empty keeps cargo''s default parallelism.'
    required: false
    default: ""
  debuginfo:
    description: 'CARGO_PROFILE_{DEV,TEST}_DEBUG. Empty keeps the profile default.'
    required: false
    default: "0"
  drop-cargo-config:
    description: 'rust-setup `drop-cargo-config`.'
    required: false
    default: "true"
  sccache-endpoint:
    description: 'S3 cache host:port for sccache and the pass cache (pass `vars.SCCACHE_ENDPOINT`).'
    required: false
    default: ""
  sccache-access-key:
    description: 'S3 cache access key (pass `secrets.SCCACHE_S3_ACCESS_KEY`); composites cannot read secrets.'
    required: false
    default: ""
  sccache-secret-key:
    description: 'S3 cache secret key (pass `secrets.SCCACHE_S3_SECRET_KEY`).'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Pass marker key
      id: key
      shell: bash
      env:
        PARTITION: ${{ inputs.partition }}
      run: |
        if [ -z "$PARTITION" ]; then
          echo "job=test" >> "$GITHUB_OUTPUT"
        elif [[ "$PARTITION" =~ ^([1-9][0-9]*)/([1-9][0-9]*)$ ]] && [ "${BASH_REMATCH[1]}" -le "${BASH_REMATCH[2]}" ]; then
          echo "job=test-${BASH_REMATCH[1]}-of-${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
        else
          echo "::error title=partition::'$PARTITION' is not <k>/<n> with 1 <= k <= n"
          exit 1
        fi
    # The build's hashes, so a .github change landing mid-run cannot make this
    # job select crates the build skipped. Absent from older builds: recompute.
    - name: Download crate hashes
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: crate-hashes
    - name: Build crate hashes
      id: buildhash
      shell: bash
      run: |
        if [ -f crate-hashes.json ]; then
          echo "hashes=$(jq -c . crate-hashes.json)" >> "$GITHUB_OUTPUT"
        else
          echo "::notice title=crate-hashes missing::recomputing crate hashes"
        fi
    - name: Select crates
      id: sel
      uses: argyle-labs/.github/.github/actions/crate-select@main
      with:
        job: ${{ steps.key.outputs.job }}
        hashes: ${{ steps.buildhash.outputs.hashes }}
        image: ci-rust:${{ inputs.image-tag }}
        workflow-file: ${{ inputs.workflow-file }}
        extra-paths: |
          ${{ inputs.extra-paths }}
          ${{ inputs.ui == 'true' && '*: ui' || '' }}
        force: ${{ (inputs.force == 'true' || github.event.inputs.force == 'true') && 'true' || 'false' }}
        endpoint: ${{ inputs.sccache-endpoint }}
        access-key: ${{ inputs.sccache-access-key }}
        secret-key: ${{ inputs.sccache-secret-key }}
    - name: Download crate selection
      id: selart
      if: ${{ steps.sel.outputs.selection != '' }}
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: crate-selection
    # A build from an older action version uploads no crate-selection; derive
    # the archived crates from the archive itself instead.
    - name: Download test archive for crate list
      id: listart
      if: ${{ steps.sel.outputs.selection != '' && steps.selart.outcome != 'success' }}
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: nextest-archive
    - name: Crate list from archive
      if: ${{ steps.sel.outputs.selection != '' && steps.selart.outcome != 'success' }}
      shell: bash
      env:
        LISTED: ${{ steps.listart.outcome }}
        MISSING: ${{ steps.sel.outputs.missing }}
      run: |
        set -euo pipefail
        if [ "$LISTED" != success ]; then
          echo "::error title=crate hash mismatch::selected $(jq length <<< "$MISSING") crate(s) but the build archived none (it found recorded passes); build and test computed different crate hashes. Re-run the workflow."
          exit 1
        fi
        echo "::notice title=crate-selection missing::deriving archived crates from nextest-archive"
        cargo nextest list --archive-file nextest-archive.tar.zst --workspace-remap . \
            --list-type binaries-only --message-format json \
          | jq -c '[."rust-binaries"[]."binary-id" | split("::")[0]] | unique' > crate-selection.json
    # Only crates the build archived can run; a lookup failure here must not
    # record passes for crates the archive does not hold.
    - name: Intersect with archived crates
      id: run
      if: ${{ steps.sel.outputs.selection != '' }}
      shell: bash
      env:
        MISSING: ${{ steps.sel.outputs.missing }}
        HASHES: ${{ steps.sel.outputs.hashes }}
      run: |
        set -euo pipefail
        crates=$(jq -c --argjson m "$MISSING" '[.[] | select(. as $c | $m | index($c))]' crate-selection.json)
        n=$(jq length <<< "$crates")
        if [ "$n" -eq 0 ]; then
          filter=""
        elif [ "$n" -eq "$(jq length <<< "$HASHES")" ]; then
          filter=all
        else
          filter=$(jq -r 'map("package(=\(.))") | join("|")' <<< "$crates")
        fi
        {
          echo "crates=$crates"
          echo "filter=$filter"
        } >> "$GITHUB_OUTPUT"
        echo "Testing $n crate(s): $(jq -r 'join(" ")' <<< "$crates")" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Reuse recorded passes
      if: ${{ steps.run.outputs.filter == '' }}
      shell: bash
      run: echo "Unchanged — reusing test pass for every crate" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Set up Rust (toolchain, sccache)
      if: ${{ steps.run.outputs.filter != '' }}
      uses: argyle-labs/.github/.github/actions/rust-setup@main
      with:
        drop-cargo-config: ${{ inputs.drop-cargo-config }}
        fast-linker: 'true'
        wrap-cc: 'true'
        build-jobs: ${{ inputs.build-jobs }}
        debuginfo: ${{ inputs.debuginfo }}
        sccache-endpoint: ${{ inputs.sccache-endpoint }}
        sccache-access-key: ${{ inputs.sccache-access-key }}
        sccache-secret-key: ${{ inputs.sccache-secret-key }}
        env: |
          CARGO_TERM_COLOR=always
          CARGO_NET_GIT_FETCH_WITH_CLI=true
          OPENSSL_NO_VENDOR=1
    - name: Fetch artifacts
      if: ${{ steps.run.outputs.filter != '' }}
      uses: argyle-labs/.github/.github/actions/fetch-artifacts@main
      with:
        artifacts: ${{ inputs.ui == 'true' && 'vite-dist:ui/dist' || '' }}
    - name: Download test archive
      if: ${{ steps.run.outputs.filter != '' }}
      uses: actions/download-artifact@v4
      with:
        name: nextest-archive
    - name: Coverage (cargo llvm-cov)
      if: ${{ steps.run.outputs.filter != '' }}
      uses: argyle-labs/.github/.github/actions/cargo-llvm-cov@main
      with:
        nextest-args: --no-fail-fast --no-tests=pass ${{ steps.run.outputs.filter != 'all' && format('-E {0}', steps.run.outputs.filter) || '' }}
        partition: ${{ inputs.partition }}
    - name: Record pass
      if: ${{ success() && steps.run.outputs.filter != '' }}
      uses: argyle-labs/.github/.github/actions/ci-pass-cache@main
      with:
        mode: record-batch
        job: ${{ steps.key.outputs.job }}
        hashes: ${{ steps.sel.outputs.hashes }}
        crates: ${{ steps.run.outputs.crates }}
        endpoint: ${{ inputs.sccache-endpoint }}
        access-key: ${{ inputs.sccache-access-key }}
        secret-key: ${{ inputs.sccache-secret-key }}
    - name: CI summary
      if: ${{ !cancelled() }}
      uses: argyle-labs/.github/.github/actions/ci-summary@main

name: Plugin release job — publish
description: >
  The whole plugin `publish` job: checks the build results, gathers every
  `plugin-<target>` artifact into dist/ (<bin>-<tag>-<target> + .sha256 only),
  minisign-signs each binary, promotes the :tree-<sha> image when image-name is
  set, uploads all assets to the tag's existing Gitea release (or creates it
  when `create` is "true"), writes the release Size section and
  size-history.json asset (rebuilt from the newest lower release's copy;
  a rerun replaces this tag's entries, an unreadable copy restarts it), and mirrors the image release tags to ghcr.io
  (warn-only). Run with `permissions: contents: write`.

inputs:
  tag:
    description: Release tag. Empty = env.TAG.
    required: false
    default: ""
  version:
    description: Release version. Empty = derived from the tag.
    required: false
    default: ""
  prerelease:
    description: Empty = derived from the tag.
    required: false
    default: ""
  channel:
    description: rc | stable. Empty = derived from the tag.
    required: false
    default: ""
  create:
    description: '"true" creates the release when the tag has none; otherwise it must exist.'
    required: false
    default: "false"
  targets:
    description: JSON array of target triples; each must yield a binary. Empty = no per-target check.
    required: false
    default: ""
  notes:
    description: Extra release notes. Empty = generated body.
    required: false
    default: ""
  orca-source:
    description: plugin-toolkit Cargo.lock source. Empty = read from Cargo.lock.
    required: false
    default: ""
  build-results:
    description: 'Lines of <name>:<needs.<job>.result>; anything but success|skipped fails.'
    required: false
    default: ""
  size-budget-mib:
    description: Absolute binary size budget (MiB) shown in the release Size section.
    required: false
    default: "20"
  signing-key:
    description: 'Pass `secrets.PLUGIN_SIGNING_KEY`. Empty = no release.'
    required: true
  release-token:
    description: 'Pass `secrets.ORCA_RELEASE_TOKEN`. Empty = github.token.'
    required: false
    default: ""
  image-name:
    description: Container image to promote, e.g. argyle-labs/<repo>. Empty = no image.
    required: false
    default: ""
  image-public:
    description: '"true" mirrors the image release tags to ghcr.io.'
    required: false
    default: "true"
  image-wait-minutes:
    description: Minutes to wait for :tree-<sha> of the release commit.
    required: false
    default: "15"
  registry:
    description: "Pass `vars.CI_REGISTRY || 'gitea.scottkey.me'`."
    required: false
    default: gitea.scottkey.me
  registry-http:
    description: "Pass `vars.CI_REGISTRY_HTTP || 'false'`."
    required: false
    default: "false"
  registry-user:
    description: 'Pass `secrets.CI_REGISTRY_USER`.'
    required: false
    default: ""
  registry-token:
    description: 'Pass `secrets.CI_REGISTRY_TOKEN`.'
    required: false
    default: ""
  github-token:
    description: 'Pass `secrets.GH_TOKEN` (ghcr.io mirror).'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Verify no requested build failed
      shell: bash
      env:
        RESULTS: ${{ inputs.build-results }}
      run: "$GITHUB_ACTION_PATH/verify.sh"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Release tag
      id: rel
      uses: argyle-labs/.github/.github/actions/release-tag@main
      with:
        tag: ${{ inputs.tag || env.TAG }}

    - name: Resolve release
      id: r
      shell: bash
      env:
        VERSION: ${{ inputs.version || steps.rel.outputs.version }}
        PRERELEASE: ${{ inputs.prerelease || steps.rel.outputs.prerelease }}
        CHANNEL: ${{ inputs.channel }}
        ORCA_SOURCE: ${{ inputs.orca-source }}
      run: "$GITHUB_ACTION_PATH/resolve.sh"

    - name: Download all target artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Collect release assets
      shell: bash
      env:
        TAG: ${{ steps.rel.outputs.tag }}
        TARGETS: ${{ inputs.targets }}
      run: "$GITHUB_ACTION_PATH/collect.sh"

    - name: Sign release assets (minisign)
      shell: bash
      env:
        PLUGIN_SIGNING_KEY: ${{ inputs.signing-key }}
        TAG: ${{ steps.rel.outputs.tag }}
        VERSION: ${{ steps.r.outputs.version }}
        MINISIGN_VERSION: "0.12"
        MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        PLUGIN_SIGNING_PUBKEY: RWTVrqFS7EuVqssBkmxckIHagYOZcLz4beDvFcAxtiDSqqVvl3fjobl4
      run: "$GITHUB_ACTION_PATH/sign.sh"

    - name: Promote image
      if: ${{ inputs.image-name != '' }}
      uses: argyle-labs/.github/.github/actions/image-promote@main
      with:
        name: ${{ inputs.image-name }}
        tags: |
          ${{ steps.r.outputs.version }}
          ${{ steps.r.outputs.channel-tag }}
        wait-minutes: ${{ inputs.image-wait-minutes }}
        registry: ${{ inputs.registry }}
        registry-http: ${{ inputs.registry-http }}
        username: ${{ inputs.registry-user }}
        password: ${{ inputs.registry-token }}

    - name: Publish Gitea release
      shell: bash
      env:
        GITEA_TOKEN: ${{ inputs.release-token || github.token }}
        NOTES: ${{ inputs.notes }}
        ORCA_SOURCE: ${{ steps.r.outputs.orca-source }}
        REPO: ${{ github.repository }}
        TAG: ${{ steps.rel.outputs.tag }}
        API_URL: ${{ github.api_url }}
        SERVER_URL: ${{ github.server_url }}
        CHANNEL: ${{ steps.r.outputs.channel }}
        SHA: ${{ github.sha }}
        PRERELEASE: ${{ steps.r.outputs.prerelease }}
        CREATE: ${{ inputs.create }}
      run: "$GITHUB_ACTION_PATH/gitea-release.sh"

    - name: Release size notes + history
      continue-on-error: true
      shell: bash
      env:
        GITEA_TOKEN: ${{ inputs.release-token || github.token }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        TAG: ${{ steps.rel.outputs.tag }}
        DIST_DIR: dist
        SIZES_DIR: sizes
        BUDGET_MIB: ${{ inputs.size-budget-mib }}
      run: bash "$GITHUB_ACTION_PATH/../plugin-size-check/release-size.sh"

    - name: Log in to ghcr.io (public image mirror)
      id: ghcr-login
      if: ${{ inputs.image-name != '' && inputs.image-public == 'true' }}
      continue-on-error: true
      uses: argyle-labs/.github/.github/actions/registry-login@main
      with:
        registry: ghcr.io
        setup-buildx: "false"
        username: x-access-token
        password: ${{ inputs.github-token }}

    - name: Mirror image release tags to ghcr.io
      if: ${{ inputs.image-name != '' && inputs.image-public == 'true' }}
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        NAME: ${{ inputs.image-name }}
        VERSION: ${{ steps.r.outputs.version }}
        CHANNEL_TAG: ${{ steps.r.outputs.channel-tag }}
        LOGIN_OUTCOME: ${{ steps.ghcr-login.outcome }}
      run: "$GITHUB_ACTION_PATH/mirror-image.sh"

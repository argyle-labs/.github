name: Image build
description: >
  Build a container image and push it as `<registry>/<name>:src-<hash>`, keyed
  by source-hash so plugin-release can retag it without rebuilding. Skips the
  build when that tag already exists. Needs a host docker daemon (not the
  ci-rust container).

inputs:
  context:
    description: 'Build context.'
    required: false
    default: "."
  file:
    description: 'Dockerfile path.'
    required: false
    default: Dockerfile
  name:
    description: 'Image name without registry, e.g. `argyle-labs/<repo>`.'
    required: true
  platforms:
    description: 'buildx platforms.'
    required: false
    default: linux/amd64
  hash:
    description: 'source-hash output; the pushed tag is `src-<hash>`.'
    required: true
  registry:
    description: 'Registry host (callers pass `vars.CI_REGISTRY || gitea.scottkey.me`).'
    required: false
    default: gitea.scottkey.me
  registry-http:
    description: "'true' when the registry is a plain-HTTP endpoint (vars.CI_REGISTRY_HTTP)."
    required: false
    default: "false"
  username:
    required: true
  password:
    required: true

outputs:
  ref:
    description: 'Pushed (or already present) image reference.'
    value: ${{ steps.check.outputs.ref }}
  built:
    description: "'true' when this run built and pushed the image."
    value: ${{ steps.check.outputs.exists == 'true' && 'false' || 'true' }}

runs:
  using: composite
  steps:
    # BuildKit runs in its own container and does not inherit the host daemon's
    # insecure-registries; see ci-image.yml.
    - name: Buildkit registry config (only for a plain-HTTP endpoint)
      id: buildkit
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_HTTP: ${{ inputs.registry-http }}
      run: |
        if [ "${REGISTRY_HTTP:-false}" = "true" ]; then
          {
            printf '[registry."%s"]\n' "$REGISTRY"
            printf '  http = true\n'
            printf '  insecure = true\n'
          } > "${RUNNER_TEMP}/buildkitd.toml"
          echo "config=${RUNNER_TEMP}/buildkitd.toml" >> "$GITHUB_OUTPUT"
        else
          echo "config=" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: network=host
        buildkitd-config: ${{ steps.buildkit.outputs.config }}

    - name: Log in to the registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Check for an existing image
      id: check
      shell: bash
      env:
        REF: ${{ inputs.registry }}/${{ inputs.name }}:src-${{ inputs.hash }}
      run: |
        set -euo pipefail
        echo "ref=$REF" >> "$GITHUB_OUTPUT"
        if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Image $REF already exists; skipping build" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push
      if: ${{ steps.check.outputs.exists != 'true' }}
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.check.outputs.ref }}
        cache-from: type=registry,ref=${{ inputs.registry }}/${{ inputs.name }}:buildcache
        cache-to: type=registry,ref=${{ inputs.registry }}/${{ inputs.name }}:buildcache,mode=max

    - name: Summary
      if: ${{ steps.check.outputs.exists != 'true' }}
      shell: bash
      env:
        REF: ${{ steps.check.outputs.ref }}
      run: echo "Published $REF" >> "$GITHUB_STEP_SUMMARY"

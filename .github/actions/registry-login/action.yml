name: Registry login
description: >
  Set up Buildx (with a plain-HTTP registry config when needed) and log in to
  the image registry. Needs a host docker daemon.

inputs:
  registry:
    description: 'Registry host.'
    required: false
    default: gitea.scottkey.me
  registry-http:
    description: "'true' when the registry is a plain-HTTP endpoint (vars.CI_REGISTRY_HTTP)."
    required: false
    default: "false"
  username:
    required: true
  password:
    required: true
  setup-buildx:
    description: "'false' to only log in, reusing a Buildx set up by an earlier login (a second registry)."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # BuildKit runs in its own container and does not inherit the host daemon's
    # insecure-registries; see ci-image.yml.
    - name: Buildkit registry config (only for a plain-HTTP endpoint)
      id: buildkit
      if: ${{ inputs.setup-buildx == 'true' }}
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_HTTP: ${{ inputs.registry-http }}
      run: |
        if [ "${REGISTRY_HTTP:-false}" = "true" ]; then
          {
            printf '[registry."%s"]\n' "$REGISTRY"
            printf '  http = true\n'
            printf '  insecure = true\n'
          } > "${RUNNER_TEMP}/buildkitd.toml"
          echo "config=${RUNNER_TEMP}/buildkitd.toml" >> "$GITHUB_OUTPUT"
        else
          echo "config=" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Buildx
      if: ${{ inputs.setup-buildx == 'true' }}
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: network=host
        buildkitd-config: ${{ steps.buildkit.outputs.config }}

    - name: Log in to the registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

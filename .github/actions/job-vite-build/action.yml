name: CI job — vite build
description: >
  The whole `build-ui` job: `vite build`, uploaded as `vite-dist` for the Rust
  jobs run with `ui: 'true'`.

inputs:
  working-directory:
    description: 'Frontend directory.'
    required: false
    default: ui
  command:
    description: 'Build command, run in working-directory (e.g. `npm run build` for an npm-workspaces root).'
    required: false
    default: "npx vite build"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Vite build
      uses: argyle-labs/.github/.github/actions/vite-build@v1
      with:
        working-directory: ${{ inputs.working-directory }}
        command: ${{ inputs.command }}
    - name: CI summary
      if: ${{ !cancelled() }}
      uses: argyle-labs/.github/.github/actions/ci-summary@v1

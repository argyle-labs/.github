name: Rust setup (shared)
description: >
  The ONE home for the org's Rust CI/build environment: toolchain, the caching
  strategy (sccache on the shared S3 bucket or local disk + Swatinem rust-cache), the private orca git-dep
  auth (github.com→Gitea host rewrite), and the compile-memory controls that
  keep heavy generated crates under the runner's memory cap. Every CI and
  release job composes this so caching + toolchain are defined in exactly one
  place (see [[unified-cicd-pipeline-architecture]]).

inputs:
  components:
    description: 'Extra rustup components, comma-separated (e.g. "clippy, rustfmt"). Empty for build-only jobs.'
    required: false
    default: ""
  cache-key:
    description: 'Swatinem/rust-cache shared key — distinct per job/target so caches do not collide. Empty skips rust-cache (sccache only).'
    required: false
    default: ""
  orca-fetch-token:
    description: >
      Gitea token with read on argyle-labs/orca, for the private git dep.
      Composites cannot read secrets, so the caller passes it in. Empty skips
      the rewrite (e.g. the orca repo itself, which IS the dep).
    required: false
    default: ""
  sccache-endpoint:
    description: >
      S3 host:port for the shared sccache bucket (pass vars.SCCACHE_ENDPOINT).
      With the access/secret keys set, sccache uses S3; otherwise a local
      disk cache.
    required: false
    default: ""
  build-jobs:
    description: 'CARGO_BUILD_JOBS. Empty keeps cargo default parallelism.'
    required: false
    default: ""
  debuginfo:
    description: 'CARGO_PROFILE_DEV_DEBUG / CARGO_PROFILE_TEST_DEBUG. Empty keeps the profile default.'
    required: false
    default: "0"
  wrap-cc:
    description: 'Also route CC/CXX through sccache (caches C deps built by cc-rs). Leave off for cross builds.'
    required: false
    default: "false"
  env:
    description: >
      Extra KEY=VALUE lines appended verbatim to GITHUB_ENV for the rest of the
      job. Trusted input: it can set any variable (RUSTC_WRAPPER, LD_PRELOAD, ...),
      so it must come from the calling repo's own workflow file, never from
      PR titles, branch names or other event data.
    required: false
    default: ""
  working-directory:
    description: 'Cargo workspace root (where a local-dev .cargo/config.toml is dropped).'
    required: false
    default: "."
  drop-cargo-config:
    description: >
      'true' deletes .cargo/config.toml (plugins keep a local-dev path patch
      there). 'false' keeps it, for repos that commit build config in it
      (orca: LIBSQLITE3_FLAGS).
    required: false
    default: "true"
  sccache-bucket:
    required: false
    default: "sccache"
  sccache-region:
    description: 'SigV4 region the S3 backend expects (Garage s3_region); falls back to env SCCACHE_REGION, then garage.'
    required: false
    default: ""
  sccache-access-key:
    required: false
    default: ""
  sccache-secret-key:
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The ci-rust container bakes the pinned toolchain (+ clippy/rustfmt), zig,
    # cargo-zigbuild and sccache; there every bootstrap below is skipped.
    - name: Detect prebaked toolchain
      id: env
      shell: bash
      run: |
        prebaked=false
        if [ "$(uname -s)" = Linux ] && command -v rustup >/dev/null && command -v cargo-zigbuild >/dev/null \
           && command -v zig >/dev/null && command -v sccache >/dev/null; then
          prebaked=true
        fi
        echo "prebaked=$prebaked" >> "$GITHUB_OUTPUT"
        echo "prebaked toolchain: $prebaked"

    # `dtolnay/rust-toolchain` bootstraps rustup via a single no-retry
    # rustup-init download; the runner's egress to static.rust-lang.org
    # intermittently resets, failing the whole job. Ensure rustup is present
    # first with a retrying curl so dtolnay's next step is a no-op fast path.
    - name: Ensure rustup (resilient bootstrap)
      if: ${{ steps.env.outputs.prebaked != 'true' }}
      shell: bash
      run: |
        command -v rustup >/dev/null 2>&1 && { echo "rustup already present"; exit 0; }
        n=0
        until curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
                --retry-delay 5 https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain none; do
          n=$((n + 1))
          [ "$n" -ge 4 ] && { echo "::error::rustup bootstrap failed after $n attempts"; exit 1; }
          echo "rustup bootstrap attempt $n failed; retrying in $((n * 10))s"; sleep $((n * 10))
        done
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    # Host-mutating steps (toolchain install, ~/.cargo pruning, a Linux binary
    # into /usr/local/bin) run only on Linux, never on a persistent macOS host.
    - name: Install Rust toolchain
      if: ${{ steps.env.outputs.prebaked != 'true' && runner.os == 'Linux' }}
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    # sccache caches individual rustc invocations — INCLUDING workspace members,
    # which rust-cache deliberately skips. That is what makes the giant generated
    # proxmox crate stop recompiling from scratch each run. Backend is chosen in
    # the configure step below.
    # Install sccache directly from its public release tarball — best-effort.
    # mozilla-actions/sccache-action queries the GitHub *API* to resolve the
    # release, which needs a token that Gitea's act does not populate in a
    # composite ("Input required and not supplied: token"), failing the build.
    # A direct download of a pinned version needs no API and no token; if it
    # fails for any reason we skip the wrapper rather than break the build.
    - name: Set up sccache (best-effort, no GitHub API)
      if: ${{ steps.env.outputs.prebaked != 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail
        if command -v sccache >/dev/null 2>&1; then echo "sccache already present"; exit 0; fi
        ver=0.8.2
        url="https://github.com/mozilla/sccache/releases/download/v${ver}/sccache-v${ver}-x86_64-unknown-linux-musl.tar.gz"
        if curl -fsSL "$url" -o /tmp/sccache.tgz && tar -xzf /tmp/sccache.tgz -C /tmp; then
          install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache \
            2>/dev/null || sudo install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          echo "sccache $(sccache --version 2>/dev/null || echo '?') installed"
        else
          echo "::warning::sccache download failed — building without compiler cache"
        fi

    - name: Cache cargo registry + dep builds
      if: ${{ runner.os == 'Linux' && inputs.cache-key != '' }}
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}

    - name: Configure shared cargo/sccache environment
      shell: bash
      env:
        S3_ENDPOINT: ${{ inputs.sccache-endpoint }}
        S3_BUCKET: ${{ inputs.sccache-bucket }}
        S3_REGION: ${{ inputs.sccache-region || env.SCCACHE_REGION || 'garage' }}
        S3_ACCESS_KEY: ${{ inputs.sccache-access-key }}
        S3_SECRET_KEY: ${{ inputs.sccache-secret-key }}
        BUILD_JOBS: ${{ inputs.build-jobs }}
        DEBUGINFO: ${{ inputs.debuginfo }}
        WRAP_CC: ${{ inputs.wrap-cc }}
        EXTRA_ENV: ${{ inputs.env }}
      run: |
        set -uo pipefail
        err_log="${RUNNER_TEMP:-/tmp}/sccache-error.log"
        backend=none
        if command -v sccache >/dev/null 2>&1; then
          if [ -n "$S3_ENDPOINT" ] && [ -n "$S3_ACCESS_KEY" ]; then
            # Shared S3 bucket: jobs in an ephemeral container have no disk
            # that outlives them, so a local SCCACHE_DIR would always be cold.
            export SCCACHE_BUCKET="$S3_BUCKET" SCCACHE_ENDPOINT="$S3_ENDPOINT" \
              SCCACHE_S3_USE_SSL=false SCCACHE_REGION="$S3_REGION" \
              AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY"
            backend=s3
          else
            # No S3 configured: local disk, which only helps on a runner
            # whose filesystem outlives the job.
            export SCCACHE_DIR=/root/.cache/sccache SCCACHE_CACHE_SIZE=20G
            backend=disk
          fi
          # The idle timer only resets on new requests, so a single rustc
          # running past the 600s default made the server shut down under it.
          # A server that still dies degrades to a local compile.
          export SCCACHE_IDLE_TIMEOUT=0 SCCACHE_IGNORE_SERVER_IO_ERROR=1 SCCACHE_ERROR_LOG="$err_log"
          # Starting up front runs the storage check, so a dead backend falls
          # back to an uncached build in seconds instead of mid-compile.
          # A failed write check leaves sccache up but READ-ONLY, reported only in this append-only log.
          : > "$err_log" 2>/dev/null || true
          if ! timeout 60 sccache --start-server; then
            echo "::warning title=sccache unavailable::sccache ($backend) did not start; building UNCACHED. $(tail -n 5 "$err_log" 2>/dev/null | tr '\n' ' ')"
            backend=none
          elif ! /bin/bash "$GITHUB_ACTION_PATH/../sccache-guard/guard.sh" errlog "$err_log"; then
            exit 1
          fi
        fi
        echo "sccache backend: $backend"
        {
          if [ "$backend" != none ]; then
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_IDLE_TIMEOUT=0"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
            echo "SCCACHE_ERROR_LOG=$err_log"
            if [ "$WRAP_CC" = true ]; then echo "CC=sccache cc"; echo "CXX=sccache c++"; fi
          fi
          if [ "$backend" = s3 ]; then
            echo "SCCACHE_BUCKET=$SCCACHE_BUCKET"
            echo "SCCACHE_ENDPOINT=$SCCACHE_ENDPOINT"
            echo "SCCACHE_S3_USE_SSL=false"
            echo "SCCACHE_REGION=$SCCACHE_REGION"
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
          elif [ "$backend" = disk ]; then
            echo "SCCACHE_DIR=$SCCACHE_DIR"
            echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
          fi
          # sccache and cargo incremental are mutually exclusive.
          echo "CARGO_INCREMENTAL=0"
          # The runner's egress to static.crates.io drops HTTP/2 streams
          # ("HTTP2 framing layer", then "[55] Broken pipe"); HTTP/1.1 plus
          # more retries rides that out. Git CLI fetch handles the orca git dep.
          echo "CARGO_NET_RETRY=10"
          echo "CARGO_HTTP_MULTIPLEXING=false"
          echo "CARGO_HTTP_TIMEOUT=60"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          # ── compile-memory controls ──
          # The proxmox build.rs generates 1261 JsonSchema types; clippy's
          # `lib test` variant at default debuginfo=2 OOM-killed the memory-capped
          # runner. CI never debugs binaries, so `debuginfo` defaults to 0 here
          # and in every cargo-* block; an explicit empty value keeps the profile.
          if [ -n "$DEBUGINFO" ]; then
            echo "CARGO_PROFILE_DEV_DEBUG=$DEBUGINFO"
            echo "CARGO_PROFILE_TEST_DEBUG=$DEBUGINFO"
          fi
          if [ -n "$BUILD_JOBS" ]; then echo "CARGO_BUILD_JOBS=$BUILD_JOBS"; fi
          if [ -n "$EXTRA_ENV" ]; then printf '%s\n' "$EXTRA_ENV"; fi
        } >> "$GITHUB_ENV"

    - name: Drop local-dev cargo patch
      if: ${{ inputs.drop-cargo-config == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: rm -f .cargo/config.toml

    - name: Define gitea cargo registry
      shell: bash
      # orca declares sibling deps with `registry = "gitea"`; a caller-set index wins.
      run: '[ -n "${CARGO_REGISTRIES_GITEA_INDEX:-}" ] || echo "CARGO_REGISTRIES_GITEA_INDEX=sparse+https://gitea.scottkey.me/api/packages/argyle-labs/cargo/" >> "$GITHUB_ENV"'

    - name: Authenticate private orca git dependency (Gitea)
      if: ${{ inputs.orca-fetch-token != '' }}
      shell: bash
      env:
        ORCA_FETCH_TOKEN: ${{ inputs.orca-fetch-token }}
      run: |
        # orca is spelled as a github.com dep but fetched from Gitea via a host
        # rewrite. Target THIS runner's own Gitea via GITHUB_SERVER_URL: internal
        # act_runners see the LAN http://<ip>:3000 (resolves), whereas the external
        # hostname gitea.scottkey.me does NOT resolve on them. ORCA_FETCH_TOKEN
        # must be a Gitea token with read on argyle-labs/orca.
        # See [[gitea-canonical-github-mirror-only]].
        base="${GITHUB_SERVER_URL:-https://gitea.scottkey.me}"
        auth="${base/:\/\//://x-access-token:${ORCA_FETCH_TOKEN}@}"
        if [ -n "$ORCA_FETCH_TOKEN" ]; then echo "::add-mask::$ORCA_FETCH_TOKEN"; fi
        # Job-scoped via GIT_CONFIG_* env, not `git config --global`: on a host
        # runner (mint) --global is the operator's real ~/.gitconfig. Needs git >= 2.31.
        # The argyle-labs/ prefix is longer than a global `https://github.com/` rewrite,
        # so it wins, and the token is never sent for third-party github deps.
        v=$(git --version | awk '{print $3}'); major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}
        if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 31 ]; }; then
          echo "::error::git $v lacks GIT_CONFIG_COUNT support (needs >= 2.31)"; exit 1
        fi
        n="${GIT_CONFIG_COUNT:-0}"
        {
          echo "GIT_CONFIG_KEY_${n}=url.${auth}/argyle-labs/.insteadOf"
          echo "GIT_CONFIG_VALUE_${n}=https://github.com/argyle-labs/"
          echo "GIT_CONFIG_COUNT=$((n + 1))"
        } >> "$GITHUB_ENV"

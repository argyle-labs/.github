name: cargo build
description: >
  The build: test binaries compiled once into a nextest archive, uploaded as
  `nextest-archive<name-suffix>` so cargo-test runs exactly these binaries.
  With `coverage` the binaries are coverage-instrumented, so the one test run
  also yields coverage.
  Expects checkout and rust-setup earlier in the job.

inputs:
  working-directory:
    description: 'Directory the tool runs in.'
    required: false
    default: "."
  artifacts:
    description: 'Lines of `name:path`: artifacts from earlier jobs placed before the step runs (e.g. `vite-dist:ui/dist`).'
    required: false
    default: ""
  args:
    description: '`cargo nextest archive` arguments selecting packages/features. Split on whitespace with no quoting; pass features comma-separated.'
    required: false
    default: "--workspace --all-features"
  coverage:
    description: "Build coverage-instrumented binaries via `cargo llvm-cov nextest-archive` ('true' or 'false'). Must match cargo-test's `coverage`."
    required: false
    default: "true"
  name-suffix:
    description: 'Appended to the `nextest-archive` artifact name. Give cargo-build and its cargo-test the same unique suffix when a repo builds more than once per run.'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Fetch artifacts
      uses: argyle-labs/.github/.github/actions/fetch-artifacts@main
      with:
        artifacts: ${{ inputs.artifacts }}

    - name: Fetch dependencies
      uses: argyle-labs/.github/.github/actions/cargo-fetch@main
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Build (nextest archive)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
        COVERAGE: ${{ inputs.coverage }}
      run: |
        export t0=$SECONDS; trap 'echo "build|$((SECONDS - t0))|$?" >> /tmp/ci-phases' EXIT
        read -ra args <<< "$ARGS"
        if [ "$COVERAGE" = true ]; then
          cargo llvm-cov nextest-archive --locked "${args[@]}" --archive-file nextest-archive.tar.zst
        else
          cargo nextest archive --locked "${args[@]}" --archive-file nextest-archive.tar.zst
        fi

    - name: Upload test archive
      uses: actions/upload-artifact@v4
      with:
        name: nextest-archive${{ inputs.name-suffix }}
        path: ${{ inputs.working-directory }}/nextest-archive.tar.zst
        retention-days: 3

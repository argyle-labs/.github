name: Node install
description: '`npm ci` with the npm download cache keyed on package-lock.json.'

inputs:
  working-directory:
    description: 'Directory holding package.json / package-lock.json.'
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: npm-${{ runner.os }}-

    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --prefer-offline --no-audit --no-fund

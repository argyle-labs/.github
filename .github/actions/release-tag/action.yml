name: Release tag
description: >
  Validates a release tag (vX.Y.Z-rc.N prerelease or vX.Y.Z stable, matching
  the published release's prerelease flag when there is one) and derives the
  version, rel-name and prerelease flag from it.

inputs:
  tag:
    description: 'github.event.release.tag_name || inputs.version'
    required: true

outputs:
  version:
    description: Release version, no v prefix.
    value: ${{ steps.pick.outputs.version }}
  tag:
    description: Release tag.
    value: ${{ steps.pick.outputs.tag }}
  rel-name:
    description: Release title.
    value: ${{ steps.pick.outputs.rel-name }}
  prerelease:
    description: '"true" for vX.Y.Z-rc.N.'
    value: ${{ steps.pick.outputs.prerelease }}

runs:
  using: composite
  steps:
    - name: Parse tag
      id: pick
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
        REPO: ${{ github.repository }}
      run: "$GITHUB_ACTION_PATH/tag.sh"

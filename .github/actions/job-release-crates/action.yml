name: Release job — publish crates
description: >
  The `crates` job: checks out the release tag (the branch tip carries the
  version commit; the tag pins what was released) and runs
  scripts/publish-crates.sh against the Gitea cargo registry. Run in the
  `ci-rust` container after `publish`.

inputs:
  registry-token:
    description: 'Gitea cargo registry token (pass `secrets.CI_REGISTRY_TOKEN`).'
    required: true

runs:
  using: composite
  steps:
    - name: Check out release branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
    - name: Check out release tag
      shell: bash
      run: |
        set -euo pipefail
        git config --global --add safe.directory '*'
        version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
        tag="v$version"
        [ -n "$version" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
        git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "::error::tag $tag not found"; exit 1; }
        git checkout -q "$tag"
        [ "$(git rev-parse HEAD)" = "$(git rev-parse "$tag^{commit}")" ] || { echo "::error::HEAD is not $tag"; exit 1; }
        echo "Publishing from $tag ($(git rev-parse HEAD))"
    - name: Fetch dependencies (cargo fetch)
      shell: bash
      run: cargo fetch --locked
    - name: Publish crates in dependency order (publish-crates.sh)
      shell: bash
      env:
        CARGO_REGISTRIES_GITEA_TOKEN: Bearer ${{ inputs.registry-token }}
      run: scripts/publish-crates.sh

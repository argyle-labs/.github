name: Release job — publish crates
description: >
  The `crates` job: checks out the release tag (the branch tip carries the
  version commit; the tag pins what was released) and runs
  scripts/publish-crates.sh against the Gitea cargo registry. Run in the
  `ci-rust` container after `publish`.

inputs:
  tag:
    description: 'Release tag (github.event.release.tag_name || inputs.version).'
    required: true
  registry-token:
    description: 'Gitea cargo registry token (pass `secrets.CI_REGISTRY_TOKEN`).'
    required: true

runs:
  using: composite
  steps:
    - name: Release tag
      id: rel
      uses: argyle-labs/.github/.github/actions/release-tag@main
      with:
        tag: ${{ inputs.tag }}
    - name: Check out release branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
    - name: Check out release tag
      shell: bash
      env:
        TAG: ${{ steps.rel.outputs.tag }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory '*'
        git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::tag $TAG not found"; exit 1; }
        git checkout -q "$TAG"
        [ "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")" ] || { echo "::error::HEAD is not $TAG"; exit 1; }
        echo "Publishing from $TAG ($(git rev-parse HEAD))"
    - name: Write release version (write-release-version)
      uses: argyle-labs/.github/.github/actions/write-release-version@main
      with:
        version: ${{ steps.rel.outputs.version }}
    - name: Commit release version locally
      shell: bash
      env:
        TAG: ${{ steps.rel.outputs.tag }}
      run: |
        set -euo pipefail
        git diff --quiet && exit 0
        git -c user.name=orca-release -c user.email=orca-release@localhost -c commit.gpgsign=false \
          commit -q -am "release $TAG"
    - name: Fetch dependencies (cargo fetch)
      uses: argyle-labs/.github/.github/actions/cargo-fetch@main
    - name: Publish crates in dependency order (publish-crates.sh)
      shell: bash
      env:
        CARGO_REGISTRIES_GITEA_TOKEN: Bearer ${{ inputs.registry-token }}
      run: scripts/publish-crates.sh
    - name: Collect published crate names
      id: crates
      shell: bash
      run: |
        set -euo pipefail
        names="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '
          .workspace_members as $m
          | .packages[] | select(.id as $id | $m | index($id))
          | select(.publish | index("gitea")) | .name' | tr '\n' ' ')" \
          || { echo "::warning title=link-packages::cargo metadata failed; skipping package links"; names=""; }
        echo "names=$names" >> "$GITHUB_OUTPUT"
    - name: Link crates to repository (link-packages)
      if: ${{ steps.crates.outputs.names != '' && inputs.registry-token != '' }}
      uses: argyle-labs/.github/.github/actions/link-packages@main
      with:
        token: ${{ inputs.registry-token }}
        type: cargo
        names: ${{ steps.crates.outputs.names }}

name: CI pass cache
description: >
  Records and looks up "this job passed for this source hash" markers at
  s3://<bucket>/ci-pass/<repo>/<job>/<hash> on the sccache MinIO (SigV4 via
  curl). `check` reports a hit only when every required marker exists; any
  backend error is a miss with a warning, never a false hit. `record` writes
  the marker (body = commit sha); call it only after the job succeeded.
  `check-batch` / `record-batch` do the same per crate, at
  s3://<bucket>/ci-pass/<repo>/<job>/crate/<name>/<hash>, from crate-hashes.

inputs:
  mode:
    description: '`check`, `record`, `check-batch` or `record-batch`.'
    required: true
  job:
    description: 'Job kind the marker belongs to (e.g. `build`, `test`).'
    required: true
  hash:
    description: 'check/record: output of source-hash.'
    required: false
    default: ""
  hashes:
    description: 'check-batch/record-batch: output of crate-hashes (JSON crate -> hash).'
    required: false
    default: ""
  crates:
    description: 'record-batch: JSON list of crates that ran and passed.'
    required: false
    default: "[]"
  also-require:
    description: 'check: other job kinds (space-separated) whose markers must ALSO exist for a hit.'
    required: false
    default: ""
  force:
    description: 'check: `true` always reports a miss (forced full run).'
    required: false
    default: "false"
  endpoint:
    description: 'MinIO host:port (vars.SCCACHE_ENDPOINT); http:// is assumed when no scheme is given.'
    required: false
    default: ""
  region:
    description: 'SigV4 region the S3 backend expects; falls back to env SCCACHE_REGION, then garage.'
    required: false
    default: ""
  bucket:
    required: false
    default: "sccache"
  access-key:
    required: false
    default: ""
  secret-key:
    required: false
    default: ""

outputs:
  hit:
    description: '`true` when every required marker exists.'
    value: ${{ steps.run.outputs.hit }}
  sha:
    description: 'Commit sha stored in this job''s marker on a hit.'
    value: ${{ steps.run.outputs.sha }}
  missing:
    description: 'check-batch: JSON list of crates needing work (all of them on any backend failure).'
    value: ${{ steps.batch.outputs.missing }}
  packages:
    description: 'check-batch: the same crates as `-p a -p b`.'
    value: ${{ steps.batch.outputs.packages }}

runs:
  using: composite
  steps:
    - name: CI pass cache (${{ inputs.mode }})
      id: run
      if: ${{ inputs.mode == 'check' || inputs.mode == 'record' }}
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        JOB: ${{ inputs.job }}
        HASH: ${{ inputs.hash }}
        ALSO: ${{ inputs.also-require }}
        FORCE: ${{ inputs.force }}
        ENDPOINT: ${{ inputs.endpoint }}
        BUCKET: ${{ inputs.bucket }}
        S3_REGION: ${{ inputs.region || env.SCCACHE_REGION || 'garage' }}
        S3_ACCESS_KEY: ${{ inputs.access-key }}
        S3_SECRET_KEY: ${{ inputs.secret-key }}
      run: |
        set -uo pipefail
        echo "hit=false" >> "$GITHUB_OUTPUT"
        if [ -z "$ENDPOINT" ] || [ -z "$S3_ACCESS_KEY" ] || [ -z "$HASH" ]; then
          echo "::warning title=ci-pass cache unavailable::no endpoint/credentials/hash; running in full"
          exit 0
        fi
        case "$ENDPOINT" in *://*) base="$ENDPOINT" ;; *) base="http://$ENDPOINT" ;; esac
        url() { echo "$base/$BUCKET/ci-pass/$GITHUB_REPOSITORY/$1/$HASH"; }
        # Credentials go to curl via a mode-600 config file, never argv.
        cfg=$(umask 077 && mktemp "${RUNNER_TEMP:-/tmp}/ci-pass-curl.XXXXXX")
        trap 'rm -f "$cfg"' EXIT
        esc() { local v=${1//\\/\\\\}; printf '%s' "${v//\"/\\\"}"; }
        printf 'user = "%s:%s"\n' "$(esc "$S3_ACCESS_KEY")" "$(esc "$S3_SECRET_KEY")" > "$cfg"
        s3() { curl -sS --max-time 20 --aws-sigv4 "aws:amz:$S3_REGION:s3" --config "$cfg" "$@"; }
        body="${RUNNER_TEMP:-/tmp}/ci-pass-$JOB"

        if [ "$MODE" = record ]; then
          code=$(s3 -o /dev/null -w '%{http_code}' -X PUT --data-binary "$GITHUB_SHA" "$(url "$JOB")") || code=err
          if [ "$code" = 200 ]; then
            echo "recorded $JOB pass for $HASH"
          else
            echo "::warning title=ci-pass record failed::$JOB marker not written (HTTP $code); the next run with this source runs in full"
          fi
          exit 0
        fi

        if [ "$FORCE" = true ]; then
          echo "forced full run"
          exit 0
        fi
        sha=""
        for j in $JOB $ALSO; do
          code=$(s3 -o "$body" -w '%{http_code}' "$(url "$j")") || code=err
          case "$code" in
            200) [ "$j" = "$JOB" ] && sha=$(head -c 64 "$body" | tr -cd '0-9a-f') ;;
            404) echo "no $j pass for $HASH"; exit 0 ;;
            *) echo "::warning title=ci-pass cache error::$j lookup failed (HTTP $code); running in full"; exit 0 ;;
          esac
        done
        echo "hit=true" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "pass cache hit for $JOB${ALSO:+ (+ $ALSO)} at $HASH from ${sha:-unknown}"

    - name: CI pass cache per crate (${{ inputs.mode }})
      id: batch
      if: ${{ inputs.mode == 'check-batch' || inputs.mode == 'record-batch' }}
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        JOB: ${{ inputs.job }}
        HASHES: ${{ inputs.hashes }}
        CRATES: ${{ inputs.crates }}
        ALSO: ${{ inputs.also-require }}
        FORCE: ${{ inputs.force }}
        ENDPOINT: ${{ inputs.endpoint }}
        BUCKET: ${{ inputs.bucket }}
        S3_REGION: ${{ inputs.region || env.SCCACHE_REGION || 'garage' }}
        S3_ACCESS_KEY: ${{ inputs.access-key }}
        S3_SECRET_KEY: ${{ inputs.secret-key }}
      run: |
        "$GITHUB_ACTION_PATH/batch.sh"

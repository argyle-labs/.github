# Skeleton plugin used only to warm CARGO_HOME in the ci-rust image. `full`
# (default) + socketio + delegated-http enables every plugin-facing optional
# dependency, so its lock is the union any plugin profile can pull. Bump the
# version here together with TOOLKIT_VERSION in the Dockerfile, then regenerate
# the lock with `cargo generate-lockfile`.
[package]
name = "ci-warm"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
plugin-toolkit = { version = "=0.2.1-rc.47", registry = "gitea", package = "orca-plugin-toolkit", features = ["socketio", "delegated-http"] }

[build-dependencies]
plugin-toolkit-build = { version = "=0.2.1-rc.47", registry = "gitea", package = "orca-plugin-toolkit-build" }

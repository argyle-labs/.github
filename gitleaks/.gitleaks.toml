# argyle-labs shared secret/PII scan config (single source of truth).
# Consumed by .github/workflows/gitleaks-reusable.yml and by each repo's
# local pre-commit hook. Extends gitleaks' built-in credential rules.
[extend]
useDefault = true

# ---- Org-specific PII / infra rules (not covered by gitleaks defaults) ----

[[rules]]
id = "argyle-lan-ipv4"
# Covers all of 10/8 so this public config does not name the real fleet
# subnet; the 10.0.x.x placeholder block is allowlisted below.
description = "Internal RFC1918 LAN address (10.0.0.0/8 outside the 10.0.x.x placeholder block)"
regex = '''\b10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b'''
tags = ["pii", "infra"]

[[rules]]
id = "argyle-personal-email"
description = "Personal / non-org email address"
regex = '''\b(scottdkey@gmail\.com|scott\.key@(gmail\.com|rebuyengine\.com))\b'''
tags = ["pii"]

[[rules]]
id = "argyle-db-key-material"
description = "SQLCipher raw key material (hex applied via PRAGMA key)"
regex = '''PRAGMA\s+key\s*=\s*["']x'[0-9a-fA-F]{16,}'["']'''
tags = ["secret"]

# NOTES on rules deliberately NOT included (evaluated, dropped as high-noise /
# low-value — non-routable and no real leak present in any repo):
#   - fleet-hostname (hemlock/bragi/baldur/…): matches common words thor/loki/maple.
#   - tailscale CGNAT (100.64.0.0/10): the codebase uses synthetic CGNAT IPs
#     (100.64.0.x) heavily in tests; the range is non-routable and no real
#     fleet Tailscale address appears in any repo. Re-add per-repo if needed.

# ---- Allowlist: known-safe occurrences ----
[allowlist]
description = "Global allowlist for known false positives"
paths = [
  '''(.*/)?CHANGELOG\.md''',
  '''(.*/)?go\.sum''',
  '''(.*/)?Cargo\.lock''',
  '''(.*/)?package-lock\.json''',
  '''(.*/)?pnpm-lock\.yaml''',
]
regexes = [
  # RFC5737 documentation/example ranges are safe in tests & docs
  '''192\.0\.2\.\d{1,3}''',
  '''198\.51\.100\.\d{1,3}''',
  '''203\.0\.113\.\d{1,3}''',
  # 10.0.x.x is the org-wide placeholder range for examples and tests
  '''\b10\.0\.\d{1,3}\.\d{1,3}\b''',
  # *.example are documentation placeholders
  '''\b\w+\.example\b''',
]

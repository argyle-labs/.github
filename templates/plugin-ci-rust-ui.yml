# ci.yml for a plugin whose crate embeds a Vite frontend from ui/dist: `build`
# runs vite-build first (same job, so ui/dist is on disk for cargo-build) and
# uploads it; every other job that compiles the crate places it via
# `artifacts`. Add eslint/prettier/tsc steps to `lint` once the frontend has
# them (the first node step installs; later ones pass `install: 'false'`).

# Required checks are exactly the jobs `build`, `test` and `lint`. Tests run
# once, coverage-instrumented: `test` also reports coverage (report-only).
# Each job composes tool actions as steps, so each job IS one
# check (no reusable-workflow `caller / called` duplicates). Later lint steps
# run `if: !cancelled()` so every linter reports even when an earlier one fails.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # CI-only: link the image's system OpenSSL instead of compiling openssl-src.
  # Release builds do not set this, so shipped binaries keep vendoring it.
  OPENSSL_NO_VENDOR: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    # ci-rust bakes in the toolchain, sccache and Node; its tag tracks
    # orca/rust-toolchain.toml.
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    # Gitea runs `run:` in a custom container with sh (dash); force bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust (toolchain, sccache)
        uses: argyle-labs/.github/.github/actions/rust-setup@main
        with:
          wrap-cc: 'true'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      - name: Vite build
        uses: argyle-labs/.github/.github/actions/vite-build@main
        with:
          working-directory: ui
      - name: Build test archive (cargo llvm-cov nextest-archive)
        uses: argyle-labs/.github/.github/actions/cargo-build@main
      - name: CI summary
        uses: argyle-labs/.github/.github/actions/ci-summary@main
        if: ${{ !cancelled() }}

  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust (toolchain, sccache)
        uses: argyle-labs/.github/.github/actions/rust-setup@main
        with:
          wrap-cc: 'true'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      - name: Test + coverage (cargo nextest)
        uses: argyle-labs/.github/.github/actions/cargo-test@main
        with:
          artifacts: vite-dist:ui/dist
      - name: Vitest
        uses: argyle-labs/.github/.github/actions/vitest@main
        if: ${{ !cancelled() }}
        with:
          working-directory: ui
      - name: svelte-check
        uses: argyle-labs/.github/.github/actions/svelte-check@main
        if: ${{ !cancelled() }}
        with:
          working-directory: ui
          install: 'false'
      - name: CI summary
        uses: argyle-labs/.github/.github/actions/ci-summary@main
        if: ${{ !cancelled() }}

  lint:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust (toolchain, sccache)
        uses: argyle-labs/.github/.github/actions/rust-setup@main
        with:
          wrap-cc: 'true'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      - name: Format (cargo fmt)
        uses: argyle-labs/.github/.github/actions/cargo-fmt@main
      - name: Clippy
        uses: argyle-labs/.github/.github/actions/cargo-clippy@main
        if: ${{ !cancelled() }}
        with:
          artifacts: vite-dist:ui/dist
      - name: Lock file check
        uses: argyle-labs/.github/.github/actions/cargo-lock-check@main
        if: ${{ !cancelled() }}
      - name: CI summary
        uses: argyle-labs/.github/.github/actions/ci-summary@main
        if: ${{ !cancelled() }}

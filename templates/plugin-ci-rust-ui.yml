# ci.yml for a plugin whose crate embeds a Vite frontend from ui/dist:
# vite-build uploads it, and every cargo job that compiles the crate places it
# first via `artifacts`. Add eslint/prettier/tsc blocks the same way once the
# frontend has them, listed in `lint`'s needs.

# Required checks are exactly `build`, `test` and `lint`: plain aggregate jobs
# (stable check names, unlike the `caller / called` names of reusable calls)
# that fail closed on anything but success/skipped in their needs. Tool blocks
# stay separate jobs so each shows its own result. To add a tool, add its block
# job and list it in the matching aggregate's `needs:`; ci-needs-check enforces
# that. `coverage` is report-only and in no aggregate. Every block after
# cargo-build `needs:` it; for cargo-fmt and cargo-lock-check that is ordering
# only.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  vite-build:
    uses: argyle-labs/.github/.github/workflows/vite-build.yml@main
    secrets:
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
    with:
      working-directory: ui

  cargo-build:
    needs: vite-build
    uses: argyle-labs/.github/.github/workflows/cargo-build.yml@main
    secrets:
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
      SCCACHE_S3_ACCESS_KEY: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
      SCCACHE_S3_SECRET_KEY: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
    with:
      artifacts: vite-dist:ui/dist

  cargo-test:
    needs: cargo-build
    uses: argyle-labs/.github/.github/workflows/cargo-test.yml@main
    secrets:
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
      SCCACHE_S3_ACCESS_KEY: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
      SCCACHE_S3_SECRET_KEY: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
    with:
      artifacts: vite-dist:ui/dist

  vitest:
    needs: cargo-build
    uses: argyle-labs/.github/.github/workflows/vitest.yml@main
    secrets:
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
    with:
      working-directory: ui

  svelte-check:
    needs: cargo-build
    uses: argyle-labs/.github/.github/workflows/svelte-check.yml@main
    secrets:
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
    with:
      working-directory: ui

  cargo-fmt:
    needs: cargo-build
    uses: argyle-labs/.github/.github/workflows/cargo-fmt.yml@main
    secrets:
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}

  cargo-lock-check:
    needs: cargo-build
    uses: argyle-labs/.github/.github/workflows/cargo-lock-check.yml@main
    secrets:
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}

  cargo-clippy:
    needs: cargo-build
    uses: argyle-labs/.github/.github/workflows/cargo-clippy.yml@main
    secrets:
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
      SCCACHE_S3_ACCESS_KEY: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
      SCCACHE_S3_SECRET_KEY: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
    with:
      artifacts: vite-dist:ui/dist

  coverage:
    needs: cargo-build
    uses: argyle-labs/.github/.github/workflows/cargo-llvm-cov.yml@main
    secrets:
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
      SCCACHE_S3_ACCESS_KEY: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
      SCCACHE_S3_SECRET_KEY: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
    with:
      artifacts: vite-dist:ui/dist

  ci-needs-check:
    uses: argyle-labs/.github/.github/workflows/ci-needs-check.yml@main
    secrets:
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}

  # ── Required checks ──
  build:
    if: always()
    needs: [vite-build, cargo-build]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"

  test:
    if: always()
    needs: [cargo-test, vitest, svelte-check]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"

  lint:
    if: always()
    needs: [ci-needs-check, cargo-fmt, cargo-clippy, cargo-lock-check]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
